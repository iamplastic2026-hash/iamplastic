<title>THE FOOD BOX ASIA — บรรจุภัณฑ์อาหารครบวงจร</title>
<link rel="icon" href="/logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root {
    --brand: #AB2739;             /* Muted crimson — matched to logo ASIA badge */
    --brand-dark: #7A1929;
    --brand-soft: #F7E3E7;
    --ink: #1A1A1A;               /* Black — เข้ากับโลโก้ */
    --ink-soft: #2A2A2A;
    --wholesale: #0B6B5B;
    --wholesale-soft: #E5F2EF;
    --gold: #F2B707;
    --success: #0B7A3E;
    --success-soft: #E5F2EA;
    --ground: #FFFDF9;
    --ground-warm: #F0EBDD;
    --surface: #FFFFFF;
    --surface-warm: #F5F1E8;
    --text: #0F1420;
    --text-muted: #6E6558;
    --text-faint: #9A907E;
    --border: #E7E1D3;
    --shadow: 0 1px 2px rgba(15,20,32,.05), 0 4px 12px rgba(15,20,32,.06);
    --shadow-lift: 0 4px 16px rgba(171,39,57,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --brand: #E63F5A;
      --brand-dark: #AB2739;
      --brand-soft: #3A1418;
      --ink: #F5F5F5;
      --ink-soft: #E0E0E0;
      --wholesale: #2FA88F;
      --wholesale-soft: #14322C;
      --gold: #F7C63B;
      --success: #35B26A;
      --success-soft: #143A24;
      --ground: #131313;
      --ground-warm: #0E0D0B;
      --surface: #1F1F1F;
      --surface-warm: #262322;
      --text: #F5F1E8;
      --text-muted: #A69C88;
      --text-faint: #6E6858;
      --border: #2C2A28;
      --shadow: 0 2px 6px rgba(0,0,0,.4);
      --shadow-lift: 0 4px 16px rgba(255,103,66,.25);
    }
  }
  :root[data-theme="dark"] {
    --brand: #C94456;
    --brand-dark: #AB2739;
    --brand-soft: #3A181C;
    --ink: #F5F5F5;
    --ink-soft: #E0E0E0;
    --wholesale: #2FA88F;
    --wholesale-soft: #14322C;
    --gold: #F7C63B;
    --success: #35B26A;
    --success-soft: #143A24;
    --ground: #131313;
    --ground-warm: #0E0D0B;
    --surface: #1F1F1F;
    --surface-warm: #262322;
    --text: #F5F1E8;
    --text-muted: #A69C88;
    --text-faint: #6E6858;
    --border: #2C2A28;
    --shadow: 0 2px 6px rgba(0,0,0,.4);
    --shadow-lift: 0 4px 16px rgba(255,103,66,.25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans Thai", ui-sans-serif, system-ui, sans-serif;
    background: var(--ground-warm);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input, select { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* ---- Top announcement ---- */
  .announce {
    background: var(--surface-warm);
    color: var(--text-muted);
    font-size: 12px;
    padding: 6px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .announce b { color: var(--brand); }

  /* ---- Header ---- */
  .header {
    background: linear-gradient(180deg, var(--brand), var(--brand-dark));
    color: #fff;
    position: sticky; top: 0; z-index: 40;
  }
  .header-inner {
    max-width: 1240px; margin: 0 auto;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 20px;
    align-items: center;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    color: #fff; font-weight: 800; font-size: 22px;
    white-space: nowrap;
    cursor: pointer;
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: #fff; color: var(--brand);
    display: grid; place-items: center; font-weight: 800; font-size: 16px;
  }
  .logo small { font-size: 11px; opacity: .85; font-weight: 500; display: block; }
  .search-wrap {
    background: #fff;
    border-radius: 4px;
    display: flex; padding: 4px 4px 4px 12px; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .search-wrap input {
    flex: 1; border: 0; background: transparent;
    padding: 8px 4px; font-size: 13px; color: var(--text);
    outline: none;
  }
  .search-btn {
    background: var(--brand); color: #fff; border: 0;
    padding: 8px 20px; border-radius: 3px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .header-right { display: flex; gap: 22px; align-items: center; }
  .cart-btn {
    color: #fff; position: relative;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
    background: transparent; border: 0; padding: 4px 8px;
  }
  .cart-count {
    position: absolute; top: -6px; right: -8px;
    background: #fff; color: var(--brand);
    border-radius: 999px; font-size: 11px; font-weight: 700;
    padding: 1px 7px; min-width: 20px; text-align: center;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 999px;
    background: linear-gradient(135deg, #FFB49A, #FFDDD1);
    color: var(--brand-dark);
    display: grid; place-items: center; font-weight: 700; font-size: 12px;
  }

  /* ---- Cat strip ---- */
  .cat-strip {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .cat-strip-inner {
    max-width: 1240px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; gap: 24px;
    font-size: 13px;
    white-space: nowrap;
  }
  .cat-strip a { color: var(--text-muted); cursor: pointer; }
  .cat-strip a:hover, .cat-strip a.on { color: var(--brand); font-weight: 600; }

  /* ---- Main ---- */
  main { max-width: 1240px; margin: 0 auto; padding: 16px; }

  /* ---- Hero ---- */
  .hero {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .hero-main {
    background: linear-gradient(120deg, #FFF4E8 0%, #FDECE7 55%, #FCE4DB 100%);
    border-radius: 8px;
    padding: 32px 36px;
    min-height: 220px;
    display: flex; flex-direction: column; justify-content: center;
  }
  :root[data-theme="dark"] .hero-main,
  :root:not([data-theme="light"]) .hero-main {
    background: linear-gradient(120deg, #2A1A14 0%, #3A1E14 55%, #4A2A1A 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .hero-main {
      background: linear-gradient(120deg, #2A1A14 0%, #3A1E14 55%, #4A2A1A 100%);
    }
  }
  .hero-eyebrow { font-size: 12px; color: var(--brand-dark); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
  .hero-title { font-size: 30px; font-weight: 800; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; max-width: 460px; color: var(--text); }
  .hero-sub { color: var(--text-muted); font-size: 14px; margin: 0 0 20px; max-width: 420px; }
  .hero-cta {
    align-self: flex-start;
    background: var(--brand); color: #fff;
    padding: 10px 22px; border-radius: 4px;
    font-weight: 600; font-size: 13px;
    display: inline-flex; gap: 8px; align-items: center;
    cursor: pointer; border: 0;
  }
  .hero-side { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; }
  .hero-side-card {
    color: #fff; padding: 16px 18px; border-radius: 8px;
    min-height: 100px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .hero-side-card.a { background: linear-gradient(135deg, #E85A3C, #C93414); }
  .hero-side-card.b { background: linear-gradient(135deg, #0F8574, #0B6B5B); }
  .hsc-eyebrow { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; margin-bottom: 4px; font-weight: 600; }
  .hsc-title { font-size: 16px; font-weight: 700; margin: 0; }
  .hsc-foot { font-size: 11px; opacity: .9; }

  /* ---- Section head ---- */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 12px; }
  .section-head h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .section-head .link { color: var(--brand); font-size: 12px; cursor: pointer; }

  /* ---- Cat grid ---- */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .cat-tile {
    padding: 20px 8px 16px;
    text-align: center;
    color: var(--text);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .cat-tile:hover { background: var(--brand-soft); }
  .cat-tile:nth-child(8n) { border-right: 0; }
  .cat-tile:nth-last-child(-n+8) { border-bottom: 0; }
  .cat-icon { width: 44px; height: 44px; border-radius: 8px; background: var(--surface-warm); display: grid; place-items: center; font-size: 22px; }
  .cat-label { font-size: 11px; font-weight: 500; }

  /* ---- Mode toggle ---- */
  .mode-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 18px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .mode-label { font-size: 13px; color: var(--text-muted); }
  .mode-label b { color: var(--text); font-weight: 600; }
  .toggle { display: inline-flex; background: var(--surface-warm); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .toggle button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
  .toggle button.on[data-mode="retail"] { background: var(--brand); color: #fff; box-shadow: var(--shadow-lift); }
  .toggle button.on[data-mode="wholesale"] { background: var(--wholesale); color: #fff; box-shadow: 0 4px 12px rgba(11,107,91,.22); }
  .mode-hint {
    font-size: 12px; color: var(--wholesale); background: var(--wholesale-soft);
    padding: 6px 12px; border-radius: 999px; margin-left: auto;
    display: none;
  }
  .mode-hint.on { display: inline-flex; align-items: center; gap: 6px; }

  /* ---- Product grid ---- */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; cursor: pointer;
    display: flex; flex-direction: column;
    transition: box-shadow .15s, transform .15s, border-color .15s;
    position: relative;
  }
  .card:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); border-color: var(--brand); z-index: 2; }
  .card-img {
    aspect-ratio: 1;
    background: var(--surface-warm);
    display: grid; place-items: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img .card-icon-fallback { font-size: 68px; }
  .card-body { padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-name {
    font-size: 13px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 36px;
  }
  .card-price-row { display: flex; align-items: baseline; gap: 6px; }
  .card-price { color: var(--brand); font-size: 17px; font-weight: 700; font-family: "JetBrains Mono", monospace; }
  .card-price .thb { font-size: 11px; margin-right: 1px; }
  body[data-mode="wholesale"] .card-price { color: var(--wholesale); }
  .card-strike { color: var(--text-faint); font-size: 11px; text-decoration: line-through; font-family: "JetBrains Mono", monospace; }
  .card-tier {
    font-size: 11px; color: var(--wholesale); background: var(--wholesale-soft);
    padding: 3px 7px; border-radius: 3px; align-self: flex-start; font-weight: 500;
  }
  body[data-mode="wholesale"] .card-tier { background: var(--brand-soft); color: var(--brand-dark); }
  .card { cursor: pointer; }
  .card-meta {
    display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint);
    padding-top: 4px; border-top: 1px dashed var(--border);
  }
  .card-meta .rating { color: var(--gold); }
  .card-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-top: auto; padding-top: 8px;
  }
  .card-btn {
    padding: 8px 6px; border: 0; border-radius: 5px;
    font-weight: 700; font-size: 12px; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 4px;
    transition: transform .1s, filter .15s;
  }
  .card-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .card-btn:active { transform: translateY(0); }
  .card-btn-cart {
    background: var(--brand-soft); color: var(--brand-dark);
    border: 1px solid var(--brand);
  }
  .card-btn-buy {
    background: var(--brand); color: #fff;
    box-shadow: 0 2px 6px rgba(238,77,45,.25);
  }
  body[data-mode="wholesale"] .card-btn-cart {
    background: var(--wholesale-soft); color: var(--wholesale); border-color: var(--wholesale);
  }
  body[data-mode="wholesale"] .card-btn-buy {
    background: var(--wholesale); box-shadow: 0 2px 6px rgba(11,107,91,.25);
  }
  @media (max-width: 480px) {
    .card-btn { font-size: 11px; padding: 7px 4px; }
    .card-btn-cart span:not(:first-child) { display: none; }
  }
  .badge-disc {
    position: absolute; top: 0; right: 0;
    background: var(--gold); color: #1a1a1a;
    font-size: 10px; font-weight: 700; padding: 3px 8px 3px 10px;
    clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
  }
  .badge-mall {
    position: absolute; top: 8px; left: 8px;
    background: var(--brand); color: #fff;
    font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
    letter-spacing: .05em;
  }

  /* ---- Product detail — extra sections ---- */
  .pd-detail-tabs { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .pd-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 22px;
  }
  .pd-h3 {
    font-size: 16px; font-weight: 700; margin: 0 0 14px;
    padding-bottom: 10px; border-bottom: 2px solid var(--brand-soft);
    display: flex; align-items: center; gap: 8px;
  }
  .pd-desc { font-size: 13px; line-height: 1.75; color: var(--text-muted); white-space: pre-line; }
  .pd-specs { width: 100%; font-size: 13px; border-collapse: collapse; }
  .pd-specs td {
    padding: 10px 4px; border-bottom: 1px dashed var(--border);
  }
  .pd-specs td:first-child {
    color: var(--text-muted); width: 40%; font-weight: 500;
  }
  .pd-specs td:last-child { font-weight: 600; }
  .pd-variants-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  .pd-variant {
    border: 2px solid var(--border); border-radius: 8px;
    padding: 14px 10px; text-align: center; cursor: pointer;
    transition: all .15s;
  }
  .pd-variant:hover { border-color: var(--brand); background: var(--brand-soft); }
  .pd-variant.on {
    border-color: var(--brand); background: var(--brand-soft);
    box-shadow: 0 2px 8px rgba(238,77,45,.2);
  }
  .pd-variant-icon { font-size: 36px; margin-bottom: 6px; }
  .pd-variant-name { font-size: 12px; font-weight: 600; }
  .pd-variant-check { font-size: 10px; color: var(--brand); margin-top: 4px; font-weight: 700; }
  .pd-ship-grid, .pd-pay-grid {
    display: grid; gap: 10px;
  }
  .pd-ship-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .pd-pay-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .pd-ship-card {
    padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface-warm);
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    font-size: 12px;
  }
  .pd-pay-item {
    padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface-warm);
    font-size: 13px; display: flex; align-items: center; gap: 10px;
  }
  .pd-pay-item span { font-size: 20px; }
  @media (max-width: 640px) {
    .pd-section { padding: 16px; }
    .pd-h3 { font-size: 15px; }
    .pd-ship-card { grid-template-columns: auto 1fr; gap: 8px; }
    .pd-ship-card > *:last-child { grid-column: 2; }
  }

  /* ---- Product detail page ---- */
  .pd-crumb { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .pd-crumb .brand { color: var(--brand); }
  .pd-crumb span { cursor: pointer; }
  .pd {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 24px;
    display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px;
  }
  .pd-gallery-big {
    aspect-ratio: 1; background: var(--surface-warm);
    border-radius: 10px; display: grid; place-items: center;
    position: relative; overflow: hidden;
  }
  .pd-gallery-big img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pd-gallery-big .pd-icon-fallback { font-size: 200px; }
  .pd-gallery-thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
  .pd-thumb { aspect-ratio: 1; background: var(--surface-warm); border-radius: 6px; display: grid; place-items: center; font-size: 24px; cursor: pointer; border: 2px solid transparent; overflow: hidden; }
  .pd-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pd-thumb.on { border-color: var(--brand); background: var(--brand-soft); }
  .pd-badges { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .pd-badges span { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 3px; letter-spacing: .05em; }
  .pd-badges .mall { background: var(--brand); color: #fff; }
  .pd-badges .disc { background: var(--gold); color: #1a1a1a; }
  .pd-name { font-size: 24px; font-weight: 700; margin: 0 0 8px; line-height: 1.3; }
  .pd-meta { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .pd-meta .rating { color: var(--gold); font-weight: 600; }
  .pd-price-box {
    background: linear-gradient(120deg, #FFF4E8, #FDECE7);
    padding: 16px 20px; border-radius: 8px; margin-bottom: 16px;
  }
  :root[data-theme="dark"] .pd-price-box,
  :root:not([data-theme="light"]) .pd-price-box {
    background: linear-gradient(120deg, #2A1A14, #3A1E14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .pd-price-box {
      background: linear-gradient(120deg, #2A1A14, #3A1E14);
    }
  }
  .pd-price {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px;
  }
  .pd-price-cur { font-size: 32px; font-weight: 700; color: var(--brand); font-family: "JetBrains Mono", monospace; }
  body[data-mode="wholesale"] .pd-price-cur { color: var(--wholesale); }
  .pd-price-strike { font-size: 14px; color: var(--text-faint); text-decoration: line-through; font-family: "JetBrains Mono", monospace; }
  .pd-save { font-size: 12px; color: var(--brand); background: var(--surface); padding: 2px 8px; border-radius: 3px; font-weight: 600; }
  .pd-tier {
    background: var(--wholesale-soft); border: 1px solid var(--wholesale);
    border-radius: 6px; padding: 10px 14px;
  }
  .pd-tier-h { font-size: 11px; font-weight: 700; color: var(--wholesale); margin-bottom: 8px; }
  .pd-tier table { width: 100%; font-size: 12px; font-family: "JetBrains Mono", monospace; }
  .pd-tier td { padding: 3px 0; color: var(--text); }
  .pd-tier tr.hi td { color: var(--wholesale); font-weight: 700; }
  .pd-field { margin-bottom: 16px; }
  .pd-field-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .pd-opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .pd-opt {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 12px; cursor: pointer; background: var(--surface);
  }
  .pd-opt.on { border: 2px solid var(--brand); background: var(--brand-soft); color: var(--brand-dark); font-weight: 600; padding: 7px 13px; }
  .pd-opt.out { color: var(--text-faint); text-decoration: line-through; cursor: not-allowed; }
  .pd-qty { display: flex; gap: 14px; align-items: center; }
  .qty-ctrl { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .qty-ctrl button { background: transparent; border: 0; padding: 8px 14px; cursor: pointer; color: var(--text-muted); font-size: 16px; }
  .qty-ctrl input {
    width: 60px; text-align: center; padding: 8px 4px; border: 0;
    background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    font-weight: 700; font-family: "JetBrains Mono", monospace; color: var(--text);
  }
  .pd-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    padding: 12px 24px; border-radius: 4px; font-weight: 600; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: 0;
    justify-content: center;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-outline { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
  .btn-wholesale { background: var(--wholesale); color: #fff; }
  .btn-ghost { background: var(--surface-warm); color: var(--text); border: 1px solid var(--border); }
  .btn-big { padding: 14px 20px; font-size: 15px; }
  .btn-block { width: 100%; }
  .pd-guarantees {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; color: var(--text-muted);
  }

  /* ---- Cart page ---- */
  .cart-page { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .cart-items { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0 20px; }
  .cart-head-row {
    display: grid; grid-template-columns: 56px 1fr 100px 130px 90px 30px;
    gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
  }
  .cart-row {
    display: grid; grid-template-columns: 56px 1fr 100px 130px 90px 30px;
    gap: 12px; padding: 16px 0; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .cart-row:last-child { border-bottom: 0; }
  .cart-thumb {
    width: 56px; height: 56px; background: var(--surface-warm);
    border-radius: 6px; display: grid; place-items: center; font-size: 28px;
  }
  .cart-nm { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .cart-nm .sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 400; }
  .cart-p { font-family: "JetBrains Mono", monospace; font-size: 13px; text-align: right; }
  .cart-p.b { font-weight: 700; color: var(--brand); }
  body[data-mode="wholesale"] .cart-p.b { color: var(--wholesale); }
  .cart-del { color: var(--text-faint); text-align: center; cursor: pointer; padding: 6px; }
  .cart-del:hover { color: var(--brand); }
  .summary {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; position: sticky; top: 90px;
  }
  .summary h3 { margin: 0 0 12px; font-size: 15px; }
  .coupon-row { display: flex; gap: 8px; margin-bottom: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .coupon-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; background: var(--surface-warm); color: var(--text); }
  .coupon-active { font-size: 11px; color: var(--wholesale); background: var(--wholesale-soft); padding: 6px 10px; border-radius: 4px; margin-bottom: 12px; }
  .summ-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; color: var(--text-muted); }
  .summ-row.free { color: var(--success); font-weight: 600; }
  .summ-total {
    display: flex; justify-content: space-between; padding: 12px 0 0;
    border-top: 1px solid var(--border); margin-top: 8px; align-items: baseline;
  }
  .summ-total b { font-size: 14px; }
  .summ-total .tot { color: var(--brand); font-size: 22px; font-family: "JetBrains Mono", monospace; font-weight: 700; }
  body[data-mode="wholesale"] .summ-total .tot { color: var(--wholesale); }
  .cart-empty {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 60px 20px; text-align: center; color: var(--text-muted);
  }
  .cart-empty .icon { font-size: 64px; margin-bottom: 10px; }

  /* ---- Checkout ---- */
  .progress {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 20px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .progress-step { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .progress-step.on { color: var(--brand); font-weight: 600; }
  .progress-step .n {
    width: 26px; height: 26px; border-radius: 999px;
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
    background: var(--surface-warm); border: 1px solid var(--border); color: var(--text-muted);
  }
  .progress-step.on .n { background: var(--brand); color: #fff; border-color: var(--brand); }
  .progress-step.done .n { background: var(--success); color: #fff; border-color: var(--success); }
  .progress .line { flex: 1; height: 2px; background: var(--border); }
  .progress .line.on { background: var(--brand); }

  .checkout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  .co-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 14px; }
  .co-card h3 { margin: 0 0 14px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .co-card h3 .switch { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--wholesale); font-weight: 500; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    background: var(--surface-warm); border-radius: 4px; font-size: 13px; color: var(--text);
    font-family: inherit;
  }
  .form-field.wide { grid-column: 1 / -1; }
  .radio-list { display: flex; flex-direction: column; gap: 8px; }
  .radio-opt {
    display: grid; grid-template-columns: 20px 1fr auto; gap: 10px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    align-items: center;
  }
  .radio-opt.on { border: 2px solid var(--brand); background: var(--brand-soft); padding: 11px 13px; }
  .radio-dot {
    width: 16px; height: 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .radio-opt.on .radio-dot {
    border: 4px solid var(--brand); background: #fff;
    box-shadow: inset 0 0 0 2px var(--brand-soft);
  }
  .radio-title { font-size: 13px; font-weight: 600; }
  .radio-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .radio-p { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--text); font-weight: 600; }
  .radio-p.free { color: var(--success); }

  /* Switch */
  .switch-tog { width: 40px; height: 22px; background: var(--border); border-radius: 99px; position: relative; cursor: pointer; transition: background .15s; }
  .switch-tog::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; background: #fff; border-radius: 99px;
    transition: transform .15s, background .15s;
  }
  .switch-tog.on { background: var(--wholesale); }
  .switch-tog.on::after { transform: translateX(18px); }

  /* Order line preview */
  .ord-line { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); align-items: center; font-size: 12px; }
  .ord-line:last-of-type { border-bottom: 0; }
  .ord-line .th { width: 36px; height: 36px; background: var(--surface-warm); border-radius: 4px; display: grid; place-items: center; font-size: 18px; }
  .ord-line .nm { flex: 1; }
  .ord-line .nm .sub { font-size: 10px; color: var(--text-muted); }

  /* ---- Success page ---- */
  .ok-hero {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 24px; text-align: center; margin-bottom: 20px;
  }
  .ok-tick {
    width: 96px; height: 96px; border-radius: 999px;
    background: var(--success); color: #fff;
    display: grid; place-items: center; font-size: 52px;
    margin: 0 auto 20px; box-shadow: 0 8px 20px rgba(11,122,62,.25);
  }
  .ok-hero h1 { margin: 0 0 6px; font-size: 28px; }
  .ok-hero .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 14px; }
  .ok-po { display: inline-block; background: var(--brand-soft); color: var(--brand); font-family: "JetBrains Mono", monospace; padding: 8px 20px; border-radius: 6px; font-weight: 700; font-size: 18px; }
  .ok-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .qr-card { background: var(--surface); border: 2px dashed var(--brand); border-radius: 12px; padding: 24px; text-align: center; }
  .qr-card h3 { color: var(--brand); font-size: 15px; margin: 0 0 4px; }
  .qr-card .sub { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
  .qr-img {
    width: 180px; height: 180px; padding: 8px; background: #000; margin: 0 auto;
    border-radius: 6px;
  }
  .qr-img > div {
    width: 100%; height: 100%;
    background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 50% / 22px 22px;
  }
  .qr-amount { font-family: "JetBrains Mono", monospace; font-size: 28px; font-weight: 700; color: var(--brand); margin-top: 14px; }
  .qr-info { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .qr-timer { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .qr-timer b { color: var(--brand); }
  .timeline { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .timeline h3 { margin: 0 0 12px; font-size: 15px; }
  .timeline-item { display: flex; gap: 12px; padding: 8px 0; align-items: flex-start; }
  .timeline-dot {
    width: 18px; height: 18px; border-radius: 999px; margin-top: 2px;
    background: var(--border); flex-shrink: 0;
    display: grid; place-items: center; color: #fff; font-size: 10px;
  }
  .timeline-dot.done { background: var(--success); }
  .timeline-dot.current { background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .timeline-item .tt { font-size: 13px; font-weight: 600; }
  .timeline-item .ts { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .timeline-item.pending .tt { color: var(--text-muted); font-weight: 400; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--ground);
    padding: 12px 22px; border-radius: 999px; font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 100;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ---- Login / Auth ---- */
  .btn-login {
    background: #fff; color: var(--brand); border: 0;
    padding: 6px 14px; border-radius: 4px; font-weight: 700; font-size: 12px;
    cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.1);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-login:hover { background: var(--brand-soft); }
  .login-wrap { max-width: 440px; margin: 40px auto; padding: 0 16px; }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px 28px;
    box-shadow: var(--shadow);
  }
  .login-logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .login-tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--surface-warm); border-radius: 999px;
    padding: 4px; margin-bottom: 20px;
  }
  .login-tab {
    border: 0; background: transparent; padding: 10px;
    border-radius: 999px; font-weight: 600; font-size: 13px;
    color: var(--text-muted); cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .login-tab.on { background: var(--brand); color: #fff; box-shadow: 0 2px 6px rgba(238,77,45,.2); }

  /* User menu dropdown */
  .user-menu { position: relative; }
  .avatar.admin {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #1a1a1a; box-shadow: 0 0 0 2px rgba(255,215,0,.3);
  }
  .user-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; min-width: 240px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    display: none; z-index: 100; overflow: hidden;
  }
  .user-dropdown.open { display: block; }
  .ud-header {
    padding: 14px 16px; background: var(--surface-warm);
    border-bottom: 1px solid var(--border);
  }
  .ud-name { font-weight: 700; font-size: 14px; color: var(--text); }
  .ud-role { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .ud-item {
    display: block; padding: 10px 16px; color: var(--text);
    font-size: 13px; cursor: pointer; text-decoration: none;
    transition: background .1s;
  }
  .ud-item:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .ud-divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Admin ribbon */
  #admin-ribbon {
    background: linear-gradient(90deg, #FFD700, #FFA500);
    color: #1a1a1a; padding: 8px 0; border-bottom: 2px solid #E68A00;
    position: sticky; top: 68px; z-index: 30;
  }
  .admin-ribbon-inner {
    max-width: 1240px; margin: 0 auto; padding: 0 16px;
    display: flex; gap: 20px; align-items: center; font-size: 13px;
    overflow-x: auto; white-space: nowrap;
  }
  .admin-ribbon-inner a {
    color: #1a1a1a; cursor: pointer; font-weight: 600;
    padding: 2px 4px; border-radius: 3px;
  }
  .admin-ribbon-inner a:hover { background: rgba(0,0,0,.1); }

  /* ---- Bill / Invoice printable ---- */
  .bill-paper {
    background: #fff; color: #000;
    max-width: 210mm; margin: 20px auto;
    padding: 28mm 20mm;
    box-shadow: 0 4px 20px rgba(0,0,0,.1);
    font-family: "Noto Sans Thai", sans-serif;
    font-size: 13px;
  }
  .bill-header {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px;
    padding-bottom: 20px; border-bottom: 3px double #333;
  }
  .bill-title { font-size: 22px; font-weight: 800; margin: 0 0 4px; color: #000; }
  .bill-subtitle { font-size: 11px; color: #666; letter-spacing: .06em; }
  .bill-shop { text-align: right; }
  .bill-shop-name { font-size: 20px; font-weight: 800; color: var(--brand); }
  .bill-shop-tag { font-size: 11px; color: #666; margin-bottom: 6px; }
  .bill-shop-addr { font-size: 11px; color: #333; line-height: 1.5; }
  .bill-meta {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid #ccc;
    font-size: 12px;
  }
  .bill-parties {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    padding: 16px 0 20px; border-bottom: 1px solid #ccc;
  }
  .bill-party { font-size: 11px; line-height: 1.7; }
  .bill-party-h { font-size: 10px; font-weight: 700; color: var(--brand); letter-spacing: .1em; margin-bottom: 4px; }
  .bill-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 12px; }
  .bill-table th { background: #333; color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .04em; }
  .bill-table td { padding: 10px; border-bottom: 1px dotted #ccc; vertical-align: top; }
  .bill-table tfoot td { border-bottom: 0; padding: 4px 10px; }
  .bill-table tfoot tr.bill-grand td { border-top: 2px solid #333; padding-top: 10px; font-size: 16px; color: var(--brand); }
  .bill-footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 60px; }
  .bill-sign { text-align: center; font-size: 11px; color: #333; }
  .bill-sign-line { margin-bottom: 6px; letter-spacing: 2px; }
  .bill-note { margin-top: 30px; padding-top: 14px; border-top: 1px dashed #999; font-size: 11px; color: #666; }

  @media print {
    body { background: #fff; }
    .announce, .header, .cat-strip, .bottom-nav, #admin-ribbon, .no-print { display: none !important; }
    main { padding: 0 !important; max-width: none !important; }
    .bill-paper { box-shadow: none; margin: 0; padding: 15mm; max-width: none; }
    @page { size: A4; margin: 0; }
  }

  /* ---- Search dropdown (bill builder) ---- */
  .search-dropdown {
    position: absolute; top: 100%; left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; margin-top: 4px;
    max-height: 340px; overflow-y: auto;
    z-index: 20; box-shadow: 0 8px 20px rgba(0,0,0,.12);
  }
  .search-result {
    padding: 10px 12px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .search-result:last-child { border-bottom: 0; }
  .search-result:hover { background: var(--brand-soft); }

  /* ---- Admin panel ---- */
  .admin-header {
    background: linear-gradient(135deg, var(--brand-soft), var(--surface));
    border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; margin-bottom: 16px;
  }
  .admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .admin-stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .admin-stat .s-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .admin-stat .s-val { font-size: 22px; font-weight: 700; margin-top: 4px; font-family: "JetBrains Mono", monospace; }
  .admin-toolbar {
    display: grid; grid-template-columns: 1fr 200px auto; gap: 12px;
    margin-bottom: 12px; align-items: center;
  }
  .admin-search {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .admin-select {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .admin-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; overflow-x: auto; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th, .admin-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .admin-table th { background: var(--surface-warm); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
  .admin-table tbody tr:hover { background: var(--surface-warm); }
  .admin-thumb {
    width: 44px; height: 44px; border-radius: 6px; background: var(--surface-warm);
    display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .admin-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .admin-thumb-fallback { font-size: 24px; }
  .admin-btn {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); cursor: pointer; font-size: 14px;
    margin-right: 4px; transition: all .15s;
  }
  .admin-btn:hover { background: var(--brand-soft); border-color: var(--brand); }
  .admin-btn-danger:hover { background: #FEE; border-color: #DC2626; color: #DC2626; }
  .mono.lowstock { color: var(--brand); font-weight: 700; }

  /* Admin form */
  .admin-form { display: flex; flex-direction: column; gap: 16px; }
  .admin-form-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; }
  .admin-form-section h3 { margin: 0 0 16px; font-size: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--brand-soft); }
  .admin-form textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    background: var(--surface-warm); border-radius: 4px; font-size: 13px;
    color: var(--text); font-family: inherit; resize: vertical;
  }
  .admin-form-actions {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 20px 0; border-top: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    .admin-stats { grid-template-columns: repeat(2, 1fr); }
    .admin-toolbar { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .admin-table { font-size: 11px; }
    .admin-table th, .admin-table td { padding: 8px 6px; }
  }

  /* Bottom nav (mobile) */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    display: none;
    grid-template-columns: repeat(5, 1fr);
    z-index: 30;
  }
  .bottom-nav a {
    text-align: center; font-size: 10px; color: var(--text-muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer;
  }
  .bottom-nav .icon { font-size: 20px; }
  .bottom-nav a.on { color: var(--brand); }

  async function apiCall(action, extra = {}, isPost = false, timeoutMs = 25000) {
    const cfg = liveSheetConfig();
    if (!cfg.url) throw new Error("ยังไม่ได้ตั้งค่า Sheet API URL");
    let r, rawText;
    // กันค้าง — ถ้า Apps Script ไม่ตอบภายในเวลาที่กำหนด ให้ล้มเลิก
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      if (isPost) {
        const body = JSON.stringify({ action, token: cfg.token, ...extra });
        r = await fetch(cfg.url, {
          method: "POST",
          redirect: "follow",
          mode: "cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body,
          signal: ctrl.signal,
        });
      } else {
        const u = new URL(cfg.url);
        u.searchParams.set("action", action);
        Object.entries(extra).forEach(([k, v]) => u.searchParams.set(k, v));
        r = await fetch(u.toString(), { redirect: "follow", mode: "cors", signal: ctrl.signal });
      }
      rawText = await r.text();
      console.log(`[apiCall ${action}] status=${r.status} body:`, rawText.substring(0, 200));
      try {
        return JSON.parse(rawText);
      } catch (parseErr) {
        return { ok: false, error: `Response not JSON (status ${r.status}): ${rawText.substring(0, 100)}` };
      }
    } catch (netErr) {
      if (netErr.name === 'AbortError') {
        console.error(`[apiCall ${action}] timeout ${timeoutMs}ms`);
        return { ok: false, error: `หมดเวลารอ ${Math.round(timeoutMs/1000)} วินาที — Apps Script ไม่ตอบ` };
      }
      console.error(`[apiCall ${action}] network error:`, netErr);
      return { ok: false, error: `Network: ${netErr.message}` };
    } finally {
      clearTimeout(timer);
    }
  }

  async function pullProductsFromSheet() {
    try {
      const res = await apiCall("list");
      if (!res.ok) throw new Error(res.error || "API error");
      S.sheetProducts = res.products || [];
      S.sheetLastSync = Date.now();
      saveSynced('sheetProducts','sheetLastSync');
      saveState();
      toast(`↓ โหลด ${S.sheetProducts.length} สินค้าจาก Sheet ✓`);
      return true;
    } catch (e) {
      toast("❌ โหลดจาก Sheet ไม่สำเร็จ: " + e.message);
      return false;
    }
  }

    try {
      const res = await apiCall("upsertProduct", { data: product }, true);
      if (!res.ok) throw new Error(res.error || "API error");
      return true;
    } catch (e) {
      console.error("pushProductToSheet:", e);
      return false;
    }
  }

  let _slipDataUrl = null;

  async function onSlipFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    // Compress: resize + quality
    try {
      const compressed = await compressImage(file, 800, 0.7);
      _slipDataUrl = compressed.dataUrl;
      const preview = document.getElementById("slip-preview");
      const img = document.getElementById("slip-preview-img");
      const info = document.getElementById("slip-size-info");
      img.src = compressed.dataUrl;
      const sizeKB = Math.round(compressed.dataUrl.length / 1024);
      info.textContent = `📎 ขนาด ${sizeKB} KB · ${compressed.width}×${compressed.height} px${sizeKB > 45 ? ' (⚠️ อาจเก็บใน Sheet ยาก — ระบบจะบีบเพิ่ม)' : ''}`;
      preview.style.display = "block";
    } catch (err) {
      toast("❌ อ่านรูปไม่ได้: " + err.message);
    }
  }

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Read fail"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Image load fail"));
        img.onload = () => {
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          // Iterative compression to fit ~40KB
          let q = quality, dataUrl = canvas.toDataURL("image/jpeg", q);
          let tries = 0;
          while (dataUrl.length > 45000 && q > 0.2 && tries < 6) {
            q *= 0.7;
            dataUrl = canvas.toDataURL("image/jpeg", q);
            tries++;
          }
          resolve({ dataUrl, width: w, height: h });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function submitSlip(po) {
    if (!_slipDataUrl) { toast("กรุณาเลือกรูปสลิป"); return; }
    const g = id => (document.getElementById(id)||{}).value.trim();
    const slipData = {
      po,
      image: _slipDataUrl,
      date: g("slip-date"),
      time: g("slip-time"),
      amount: parseFloat(g("slip-amount")) || 0,
      bank: g("slip-bank"),
      note: g("slip-note"),
      uploadedAt: new Date().toISOString(),
    };
    toast("⏳ กำลังส่งสลิป...");

    // Update order locally
    const all = [...(S.sheetOrders || []), ...S.orders];
    const o = all.find(x => x.po === po);
    if (o) {
      o.slip = slipData;
      o.slipStatus = 'pending_verify';
      o.updatedAt = new Date().toISOString();
    }
    // Sync copies in both stores
    [S.orders, S.sheetOrders || []].forEach(list => {
      const idx = list.findIndex(x => x.po === po);
      if (idx >= 0) list[idx] = { ...list[idx], slip: slipData, slipStatus: 'pending_verify', updatedAt: new Date().toISOString() };
    });
    saveState();

    // Push to Sheet
    if (S.sheetApiUrl) {
      try {
        const res = await apiCall("uploadSlip", { po, slip: slipData }, true);
        if (res && res.ok) toast("✅ ส่งสลิปสำเร็จ · กำลังตรวจ...");
        else toast("⚠️ ส่งบน browser สำเร็จ แต่ push Sheet ล้มเหลว: " + (res.error||''));
      } catch (e) {
        toast("⚠️ Push Sheet ล้มเหลว: " + e.message + " (แต่บันทึกในเครื่องแล้ว)");
      }
      // Auto-verify ผ่าน SlipOK (ถ้ามี API key)
      if (S.slipokApiKey && S.slipokBranchId) {
        try {
          const raw = _slipDataUrl.replace(/^data:image\/[a-z]+;base64,/, '');
          const vres = await apiCall("verifySlip", {
            slipBase64: raw, expectedAmount: o ? o.total : 0,
            slipokApiKey: S.slipokApiKey, slipokBranchId: S.slipokBranchId,
          }, true);
          if (vres && vres.ok && vres.result && vres.result.ok) {
            // Auto-verify
            [S.orders, S.sheetOrders || []].forEach(list => {
              const idx = list.findIndex(x => x.po === po);
              if (idx >= 0) { list[idx].slipStatus = 'verified'; list[idx].status = 'paid'; }
            });
            saveState();
            if (S.sheetApiUrl) await updateOrderStatusOnSheet(po, 'paid');
            toast("✅ ตรวจสลิปอัตโนมัติผ่าน → สถานะ paid");
          } else {
            toast("⏳ ส่งสลิปแล้ว · SlipOK ตรวจไม่ผ่าน → รอ admin");
          }
        } catch (e) { console.error("SlipOK err:", e); }
      }
    } else {
      toast("✅ ส่งสลิปสำเร็จ (บันทึกใน browser)");
    }

    _slipDataUrl = null;
    go('/order/' + po);
  }

  async function verifySlip(po, approve) {
    if (approve && !confirm(`ยืนยันสลิปของ ${po}?\nสถานะจะเปลี่ยนเป็น "ได้รับชำระ" (paid)`)) return;
    if (!approve && !confirm("ปฏิเสธสลิป? (ยังคงสถานะ pending_payment)")) return;
    const all = [...(S.sheetOrders || []), ...S.orders];
    const o = all.find(x => x.po === po);
    if (!o) return;
    if (approve) {
      o.slipStatus = 'verified';
      o.status = 'paid';
      if (S.sheetApiUrl) await updateOrderStatusOnSheet(po, 'paid');
    } else {
      o.slipStatus = 'rejected';
    }
    o.updatedAt = new Date().toISOString();
    // Sync in both stores
    [S.orders, S.sheetOrders || []].forEach(list => {
      const idx = list.findIndex(x => x.po === po);
      if (idx >= 0) list[idx] = { ...list[idx], slipStatus: o.slipStatus, status: o.status, updatedAt: o.updatedAt };
    });
    // Push slip status
    if (S.sheetApiUrl) await apiCall("updateSlipStatus", { po, slipStatus: o.slipStatus }, true).catch(()=>{});
    saveState();
    toast(approve ? "✅ ยืนยันสลิป · สถานะ paid" : "✕ ปฏิเสธสลิป");
    render();
  }

  const $ = (id) => document.getElementById(id);
  const money = (n) => { const v = Number(n)||0; return "฿" + v.toLocaleString("th-TH", { minimumFractionDigits: (v%1)?2:0, maximumFractionDigits: 2 }); };
  const priceOf = (p, qty = 1) => {
    if (S.mode === "wholesale") {
      const tier = p.tiers.find(t => qty >= t[0] && qty <= t[1]);
      return tier ? tier[2] : p.wholesale;
    }
    return p.retail;
  };
  function cartCount() { return S.cart.reduce((s, i) => s + i.qty, 0); }
  function cartSubtotal() {
    return S.cart.reduce((s, i) => {
      const p = EP.find(x => x.id === i.pid);
      return s + priceOf(p, i.qty) * i.qty;
    }, 0);
  }
  function findCoupon(code) {
    const list = S.sheetCoupons || [];
    const found = list.find(c => c && c.code && c.code.toUpperCase() === (code||'').toUpperCase() && c.active);
    if (found) {
      if (found.expiresAt && new Date(found.expiresAt) < new Date()) return null;
      if (found.maxUses > 0 && found.used >= found.maxUses) return null;
      return found;
    }
    // fallback hardcoded
    if ((code||'').toUpperCase() === "NEW100") return { code:"NEW100", kind:"amount", value:100, minTotal:800 };
    return null;
  }
  function couponDiscount() {
    const c = findCoupon(S.coupon);
    if (!c) return 0;
    const sub = cartSubtotal();
    if (c.minTotal && sub < c.minTotal) return 0;
    if (c.kind === "percent") return Math.floor(sub * (c.value/100));
    return Math.min(c.value, sub);
  }
  function cartTotal() {
    return Math.max(0, cartSubtotal() - couponDiscount());
  }
  function shippingFee() {
    if (cartSubtotal() >= 1500) return 0;
    return S.coShipping === "flash" ? 55 : (S.coShipping === "pickup" ? 0 : 0);
  }
  // CSV Export
  function exportCsv(filename, rows) {
    if (!rows || !rows.length) { toast("ไม่มีข้อมูลให้ export"); return; }
    const cols = Object.keys(rows[0]);
    const esc = v => { const s = v==null?'':String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
    const lines = [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))];
    const bom = '﻿'; // UTF-8 BOM สำหรับ Excel
    const csv = bom + lines.join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      toast(`📥 export: ${filename}`);
    } catch (e) {
      // iOS Safari fallback — เปิด tab ใหม่
      const dataUrl = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      window.open(dataUrl, '_blank');
      toast("📥 เปิด tab ใหม่ — save-as เพื่อ download");
    }
  }

  function addToCart(pid, qty = 1, size = null) {
    const existing = S.cart.find(i => i.pid === pid && i.size === size);
    if (existing) existing.qty += qty;
    else S.cart.push({ pid, qty, size });
    saveState(); updateCartBadge();
  }
  function updateCartQty(idx, delta) {
    const item = S.cart[idx];
    item.qty = Math.max(1, item.qty + delta);
    saveState();
  }
  function removeCart(idx) { S.cart.splice(idx, 1); saveState(); }
  function clearCart() { S.cart = []; S.coupon = ""; saveState(); }
  function updateCartBadge() {
    const n = cartCount();
    const el = $("cart-count"); const badge = $("cart-badge");
    if (n > 0) {

  // แท็บอื่นเขียน localStorage → อัปเดตแท็บนี้ตาม
  // (แต่ละแท็บมีสำเนา S ของตัวเอง ถ้าไม่ฟังจะเห็นข้อมูลคนละชุด)
  window.addEventListener("storage", (e) => {
    if (!e.key || e.key.indexOf("iamplastic.") !== 0) return;
    const prop = e.key.slice("iamplastic.".length);
    if (!(prop in S)) return;
    try {
      S[prop] = e.newValue ? JSON.parse(e.newValue) : S[prop];
      // URL ไม่ได้อยู่ใน localStorage แล้ว จึงไม่มีเคส "แท็บอื่นเปลี่ยน URL" อีก
      render();
    } catch (err) { console.warn("[storage sync]", prop, err); }
  });

  // เตือนถ้าแท็บนี้รันโค้ดเก่ากว่าที่ deploy อยู่ (เปิดค้างไว้ข้ามการอัปเดต)
  // แถบเตือนค้างจอ ถ้าเครื่องนี้ยังใช้ URL ทดสอบอยู่ (จะได้ไม่ลืมแล้วงงว่าข้อมูลไม่ตรงคนอื่น)
  function showOverrideBanner() {
    if (!hasApiOverride() || document.getElementById('api-override-bar')) return;

    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:3001;background:#7A1D2A;color:#fff;padding:8px 16px;font-size:12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap';
    bar.innerHTML = `⚠️ เครื่องนี้ใช้ URL ทดสอบ — ข้อมูลอาจไม่ตรงกับเครื่องอื่น
      <button onclick="clearApiOverride()" style="background:#fff;color:#7A1D2A;border:none;padding:4px 14px;border-radius:99px;font-weight:800;cursor:pointer;font-family:inherit">↩️ กลับค่าศูนย์กลาง</button>`;
    document.body.appendChild(bar);
  }

  async function checkAppFresh() {
    try {
      const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      const txt = await r.text();
      const m = txt.match(/const APP_VERSION = (\d+)/);
      const live = m ? Number(m[1]) : null;
      if (live && live > APP_VERSION) {
        const bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:3000;background:#AB2739;color:#fff;padding:12px 16px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap';
        bar.innerHTML = `⚠️ แท็บนี้ใช้เว็บเวอร์ชันเก่า (v${APP_VERSION}) · เวอร์ชันล่าสุดคือ v${live}
          <button onclick="location.reload(true)" style="background:#fff;color:#AB2739;border:none;padding:6px 16px;border-radius:99px;font-weight:800;cursor:pointer;font-family:inherit">🔄 โหลดใหม่</button>`;
        document.body.appendChild(bar);
      }
    } catch (e) { /* offline — ข้ามไป */ }
  }

  window.addEventListener("hashchange", () => {
    closeTiktok();
    render();
    // GA4 page_view สำหรับ SPA hash routes
    if (window.gtag && S.gaTagId) {
      gtag('event', 'page_view', { page_path: location.hash || '/', page_title: document.title });
    }
  });
  window.addEventListener("load", () => {
    document.body.dataset.mode = S.mode;
    updateCartBadge();
    renderCatStrip();
    render();
    // Auto-load latest data from Sheet in background (if configured)
    autoLoadFromSheet();
    // LIFF init (ถ้าตั้งค่า)
    if (S.liffId) initLIFF();
    showOverrideBanner();
    setTimeout(checkAppFresh, 3000);

    // กลับมาที่แท็บนี้ → ดึงคลิป/ตั้งค่าใหม่ (กันสองแท็บข้อมูลไม่ตรงกัน)
    let _lastFocusSync = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - _lastFocusSync < 15000) return; // กันยิงถี่เกิน
      _lastFocusSync = Date.now();
      if (!S.sheetApiUrl) return;
      pullPromosFromSheet().then(()=>render()).catch(()=>{});
      pullSettingsFromSheet().then(()=>render()).catch(()=>{});
      // อยู่หน้า admin ลูกค้า → ดึงรายชื่อใหม่ด้วย
      if (isAdmin() && currentRoute().indexOf('/admin/customer') === 0) {
        pullCustomersFromSheet().then(()=>render()).catch(()=>{});
      }
    });
    // GA4 inject (ถ้าตั้งค่า)
    if (S.gaTagId && S.gaTagId.startsWith('G-')) {
      const s = document.createElement('script');
      s.async = true; s.src = `https://www.googletagmanager.com/gtag/js?id=${S.gaTagId}`;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ dataLayer.push(arguments); };
      gtag('js', new Date()); gtag('config', S.gaTagId);
    }
  });

  function currentRoute() {
    const h = location.hash.slice(1) || "/";
    return h;
  }

  let EP = []; // effective products cache — refreshed each render
  function render() {
    EP = getEffectiveProducts();
    const r = currentRoute();
    let content = "";
    if (r === "/" || r.startsWith("/?")) content = viewHome();
    else if (r.startsWith("/cat/")) content = viewCategory(r.split("/")[2]);
    else if (r.startsWith("/product/")) content = viewProduct(r.split("/")[2]);
    else if (r === "/cart") content = viewCart();
    else if (r === "/checkout") content = viewCheckout();
    else if (r.startsWith("/success/")) content = viewOrderDetail(r.split("/")[2], true);
    else if (r.startsWith("/upload-slip/")) content = viewUploadSlip(r.split("/")[2]);
    else if (r === "/orders") content = viewOrders();
    else if (r.startsWith("/order/")) content = viewOrderDetail(r.split("/")[2], false);
    else if (r === "/login") content = viewLogin();
    else if (r === "/register") content = viewRegister();
    else if (r === "/account/addresses") content = viewAddresses();
    else if (r === "/account/address/new") content = viewAddressForm(null);
    else if (r.startsWith("/account/address/")) content = viewAddressForm(r.split("/")[3]);
    else if (r === "/admin") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminDashboard(); }
    else if (r === "/admin/products") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminProducts(); }
    else if (r.startsWith("/admin/edit/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminEdit(r.split("/")[3]); }
    else if (r === "/admin/new") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminEdit(null); }
    else if (r === "/admin/orders") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminOrders(); }
    else if (r === "/admin/bills") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminBills(); }
    else if (r === "/admin/customers") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminCustomers(); }
    else if (r.startsWith("/admin/customer/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminCustomerDetail(decodeURIComponent(r.split("/")[3] || '')); }
    else if (r === "/admin/coupons") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminCoupons(); }
    else if (r === "/admin/settings") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminSettings(); }
    else if (r === "/admin/promos") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminPromos(); }
    else if (r === "/admin/tiktok") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminTiktok(); }
    else if (r === "/admin/manage") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminManage(); }
    else if (r === "/admin/account") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminAccount(); }
    else if (r.startsWith("/admin/label/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminLabel(r.split("/")[3]); }
    else if (r === "/account/profile") content = viewAccountProfile();
    else if (r === "/account/wishlist") content = viewWishlist();
    else if (r === "/admin/create-bill") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminCreateBill(); }
    else if (r.startsWith("/admin/order/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminOrderDetail(r.split("/")[3]); }
    else if (r.startsWith("/admin/bill/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminBill(r.split("/")[3]); }
    else content = viewHome();
    // Preserve focus + caret position across re-renders (fixes input focus loss)
    const focused = document.activeElement;
    const focusedId = focused && focused.id;
    const isTextInput = focused && (focused.tagName === "INPUT" || focused.tagName === "TEXTAREA");
    const selStart = isTextInput ? focused.selectionStart : null;
    const selEnd = isTextInput ? focused.selectionEnd : null;

    $("app").innerHTML = content;
    updateCatStrip(r);
    updateHeaderUser();
    updateAdminRibbon();
    updateCartBadge(); // ensure header cart count is fresh
    setupTiktokAutoplay();

    // Restore focus if same element still exists
    if (focusedId) {
      const el = document.getElementById(focusedId);
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
        el.focus();
        if (selStart !== null && typeof el.setSelectionRange === "function") {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  function renderCatStrip() {

    ).join("");

      a.classList.toggle("on", active);

  // ============================================================
  // Banner rotator
  // เดิมเขียนว่า "rotator" แต่โชว์ banners[0] ตัวเดียวตลอด ส่วนจุดข้างล่าง
  // เป็นแค่ของตกแต่ง ไม่เคยเปลี่ยนเลย → แอดมินเพิ่ม banner ที่ 2,3 แล้วไม่เห็นอะไรขึ้น
  // ============================================================
  let _bannerIdx = 0;
  let _bannerTimer = null;

  function bannerGoTo(i, manual) {
    const n = (S.banners || []).length;
    if (!n) return;
    _bannerIdx = ((i % n) + n) % n;
    const host = document.getElementById('promo-banner');
    if (host) host.innerHTML = bannerSlideHtml();
    if (manual) startBannerRotation();   // กดเองแล้วนับเวลาใหม่
  }

  function startBannerRotation() {
    if (_bannerTimer) clearInterval(_bannerTimer);
    if ((S.banners || []).length < 2) return;
    _bannerTimer = setInterval(() => {
      // ไม่ต้องหมุนตอนผู้ใช้ไม่ได้ดูแท็บนี้
      if (document.visibilityState !== 'visible') return;
      if (!document.getElementById('promo-banner')) { clearInterval(_bannerTimer); _bannerTimer = null; return; }
      bannerGoTo(_bannerIdx + 1);
    }, 5000);
  }

  function bannerSlideHtml() {
    const banners = S.banners || [];
    if (!banners.length) return '';
    if (_bannerIdx >= banners.length) _bannerIdx = 0;
    const b = banners[_bannerIdx];
    return `
      <div style="position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);${b.link?'cursor:pointer':''}"
        ${b.link ? `onclick="openBannerLink(${_bannerIdx})"` : ''}>
        ${b.image ? `<img src="${esc(b.image)}" alt="${esc(b.title||'')}" style="width:100%;display:block;object-fit:cover">` : `
          <div style="background:linear-gradient(135deg,${esc(b.color1||'#AB2739')},${esc(b.color2||'#7A1929')});padding:32px 24px;color:#fff">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
              <div style="flex:1;min-width:200px">
                <div style="font-size:11px;opacity:.9;font-weight:700;letter-spacing:.08em">${esc((b.eyebrow||'PROMO').toUpperCase())}</div>
                <h2 style="margin:8px 0;font-size:28px;font-weight:900;line-height:1.1">${esc(b.title||'โปรใหญ่')}</h2>
                <div style="font-size:14px;opacity:.95">${esc(b.subtitle||'')}</div>
                ${b.cta ? `<button style="margin-top:14px;background:#fff;color:#000;border:none;padding:10px 20px;border-radius:99px;font-weight:700;cursor:pointer">${esc(b.cta)} →</button>`:''}
              </div>
              ${b.emoji ? `<div style="font-size:80px;line-height:1">${b.emoji}</div>`:''}
            </div>
          </div>
        `}
        ${banners.length > 1 ? `
          <div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px">
            ${banners.map((_,i)=>`<span onclick="event.stopPropagation();bannerGoTo(${i},true)"
              style="width:9px;height:9px;border-radius:50%;cursor:pointer;transition:background .2s;background:${i===_bannerIdx?'#fff':'rgba(255,255,255,.45)'};box-shadow:0 1px 3px rgba(0,0,0,.4)"></span>`).join('')}
          </div>
          <button onclick="event.stopPropagation();bannerGoTo(${_bannerIdx-1},true)" aria-label="ก่อนหน้า"
            style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:16px;cursor:pointer">‹</button>
          <button onclick="event.stopPropagation();bannerGoTo(${_bannerIdx+1},true)" aria-label="ถัดไป"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:16px;cursor:pointer">›</button>
        `:''}
      </div>`;
  }

  function openBannerLink(i) {
    const b = (S.banners || [])[i];
    if (!b || !b.link) return;
    // ลิงก์ภายในเว็บ (#/...) ให้เปลี่ยนหน้าเลย ไม่ต้องเปิดแท็บใหม่
    if (b.link.indexOf('#/') === 0 || b.link.indexOf('/#/') === 0) {
      go(b.link.slice(b.link.indexOf('#/') + 1));
    } else {
      window.open(b.link, '_blank', 'noopener');
    }

  // ดึงเลข video id จาก URL TikTok (ใช้สร้าง embed player)
  // แกะเลข video id จากลิงก์ TikTok หลายรูปแบบ
  // ลิงก์สั้น vt.tiktok.com แกะฝั่งเว็บไม่ได้ (ต้องตามredirect) — ต้องให้ backend แปลงก่อน
  function tiktokVideoId(url) {
    const u = String(url || '').trim();
    if (/^\d{8,}$/.test(u)) return u;                       // ใส่มาแต่ตัวเลข
    const pats = [
      /\/video\/(\d+)/,        // .../@user/video/123
      /\/photo\/(\d+)/,        // โพสต์รูป
      /\/embed\/v2\/(\d+)/,    // ลิงก์ embed
      /\/v\/(\d+)/,            // m.tiktok.com/v/123.html
      /[?&]item_id=(\d+)/,
      /[?&]video_id=(\d+)/,
    ];
    for (const re of pats) { const m = u.match(re); if (m) return m[1]; }
    return null;
  }

  // ลิงก์สั้นที่ยังไม่ได้แปลง = เล่นในเว็บไม่ได้ ต้องกด "ซ่อมลิงก์"
  function isShortTiktokLink(url) {
    return /(vt|vm)\.tiktok\.com\//i.test(String(url||''));
  }

  function renderTiktokCard(v, idx) {
    const url = esc(v.url||'');
    const thumb = esc(v.thumbnail||'');
    const vid = tiktokVideoId(v.url);
    const preview = esc(v.previewVideo||'');
    const auto = S.tiktokAutoplay !== false; // default เปิด

    // ชั้นสื่อ: ถ้ามีวิดีโอ preview ที่อัพเอง → เล่นวนอัตโนมัติแบบปิดเสียง (ชัวร์ 100%)
    // ถ้าไม่มี แต่เปิด autoplay + มี video id → โหลด TikTok player ตอนเลื่อนมาเห็น
    let media;
    if (preview) {
      media = `<video src="${preview}" ${auto?'autoplay':''} muted loop playsinline preload="metadata"
        ${thumb?`poster="${thumb}"`:''}
        style="width:100%;height:100%;object-fit:cover;display:block"></video>`;
    } else {
      // หมายเหตุสำคัญ: TikTok embed player "เล่นเองอัตโนมัติไม่ได้"
      // พารามิเตอร์ autoplay=1&muted=1 ที่เคยใส่ไว้ TikTok ไม่รองรับ — ไม่มีผลอะไรเลย
      // ของเดิมจึงได้ player ที่ค้างนิ่ง แถมใส่ pointer-events:none ทำให้กดปุ่มเล่นก็ไม่ได้
      // → แสดงรูปปก + ปุ่ม ▶ แทน กดแล้วเปิด player เต็มจอซึ่งเล่นได้จริง
      // ถ้าอยากให้ "เล่นวนเองแบบไม่มีเสียง" ต้องอัปวิดีโอตัวอย่าง (previewVideo) ซึ่งรองรับอยู่แล้ว
      media = thumb ? `<img src="${thumb}" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.display='none'">`
                    : `<div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#1a1a1a,#333);color:#fff;font-size:32px">🎵</div>`;
    }

    // ถ้าเล่นวนอยู่แล้ว ไม่ต้องมีปุ่ม ▶ ใหญ่บังหน้าจอ — ใช้ไอคอนเสียงปิดแทน
    const playing = !!preview;
    return `
      <div onclick="playTiktok('${url}')" style="cursor:pointer;background:#000;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:9/16;box-shadow:var(--shadow);transition:transform .15s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
        ${media}
        ${playing
          ? `<div style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px" title="ปิดเสียงอยู่ — กดเพื่อดูพร้อมเสียง">🔇</div>`
          : `<div style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.15);pointer-events:none">
               <div style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:18px;color:#000;box-shadow:0 2px 12px rgba(0,0,0,.4);padding-left:3px">▶</div>
             </div>`}
        ${v.views ? `<div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;pointer-events:none">${esc(v.views)}</div>` : ''}
        ${v.title ? `<div style="position:absolute;bottom:0;left:0;right:0;padding:24px 8px 8px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);color:#fff;font-size:11px;font-weight:600;pointer-events:none">${esc(v.title.slice(0,60))}</div>` : ''}
        ${!vid && !preview ? `<div style="position:absolute;top:8px;left:8px;background:#f59e0b;color:#fff;font-size:9px;padding:2px 6px;border-radius:3px">เปิดใน TikTok</div>` : ''}
      </div>
    `;
  }

  // เดิมมี IntersectionObserver คอยสลับรูปเป็น TikTok iframe ตอนเลื่อนมาเห็น
  // ถอดออกแล้ว เพราะ TikTok embed เล่นเองไม่ได้ — ได้ player ค้างนิ่งเปล่าๆ
  function setupTiktokAutoplay() { /* ไม่ใช้แล้ว */ }

  // เล่นคลิปในหน้าเว็บ (TikTok embed player)
  function playTiktok(url) {
    const vid = tiktokVideoId(url);
    if (!vid) {
      // ลิงก์สั้น / ลิงก์ช่อง — ไม่มี video id ให้ embed ได้ → เปิด TikTok แทน
      window.open(url, '_blank', 'noopener');
      return;
    }
    let el = document.getElementById('tt-player');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tt-player';
      document.body.appendChild(el);
    }
    el.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px';
    el.innerHTML = `
      <button onclick="closeTiktok()" aria-label="ปิด" style="position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer">✕</button>
      <div style="width:100%;max-width:340px;aspect-ratio:9/16;max-height:90vh;background:#000;border-radius:12px;overflow:hidden" onclick="event.stopPropagation()">
        <iframe src="https://www.tiktok.com/embed/v2/${esc(vid)}?autoplay=1"
          style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div id="tt-fallback" style="display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.75);padding:8px 16px;border-radius:8px;text-align:center;max-width:300px;line-height:1.6">
        ยังไม่ขึ้น? คลิปบางอันเจ้าของตั้งค่าห้ามฝังในเว็บ<br>กดปุ่มข้างล่างเพื่อดูใน TikTok
      </div>
      <a href="${esc(url)}" target="_blank" rel="noopener" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(255,255,255,.15);padding:8px 18px;border-radius:99px;text-decoration:none">เปิดใน TikTok ↗</a>
    `;
    // บางเครือข่าย/บางคลิป TikTok ไม่ยอมให้ฝัง — กันผู้ใช้นั่งมองจอดำ
    setTimeout(() => {
      const box = document.getElementById('tt-fallback');
      if (box) box.style.display = 'block';
    }, 5000);
    el.onclick = (e) => { if (e.target === el) closeTiktok(); };
    document.body.style.overflow = 'hidden';
    _ttEscHandler = (e) => { if (e.key === 'Escape') closeTiktok(); };
    document.addEventListener('keydown', _ttEscHandler);
  }
  let _ttEscHandler = null;
  function closeTiktok() {
    const el = document.getElementById('tt-player');
    if (el) el.remove();
    document.body.style.overflow = '';
    if (_ttEscHandler) { document.removeEventListener('keydown', _ttEscHandler); _ttEscHandler = null; }
  }

      toast("ไม่พบคูปองนี้ / หมดอายุ / ใช้ครบแล้ว");

  async function placeOrder() {

    _submitting = true;

  async function _placeOrder() {
    const now = new Date();
    const yymm = String(now.getFullYear()+543).slice(-2) + String(now.getMonth()+1).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
    const poNo = `PO-${yymm}-${rand}`;
    const sub = cartSubtotal();
    const disc = couponDiscount();
    const ship = shippingFee();
    const tot = sub - disc + ship;
    // Get selected address
    let customer;
    if (isLoggedIn()) {
      const addresses = getUserAddresses();
      const selected = S.coAddressId ? addresses.find(a => a.id === S.coAddressId) : addresses.find(a => a.isDefault) || addresses[0];
      if (selected) {
        customer = { name: selected.name, phone: selected.phone, address: selected.fullAddress, email: S.user.email };
      } else {
        customer = { name: S.user.name, phone: S.user.phone, address: S.user.address || '', email: S.user.email };
      }
      if (S.user.isCorporate) {
        customer.company = S.user.company;
        customer.taxId = S.user.taxId;
      }
    } else {
      // Guest — get from checkout form inputs
      const g = id => (document.getElementById(id)||{}).value.trim();
      const fullAddr = `${g('co-addr')} ต.${g('co-subdist')} อ.${g('co-dist')} จ.${g('co-prov')} ${g('co-zip')}`.replace(/\s+/g, ' ').trim();
      customer = { name: g('co-name') || 'ลูกค้า', phone: g('co-phone'), address: fullAddr };
    }
    const order = {
      po: poNo,
      status: S.coPayment === "cod" ? "paid" : "pending_payment",
      total: tot,
      subtotal: sub,
      discount: disc,
      shipping: ship,
      items: [...S.cart].map(i => ({ ...i, priceEach: priceOf(EP.find(p=>p.id===i.pid), i.qty) })),
      shippingMethod: S.coShipping,
      carrierName: null,
      tracking: null,
      payment: S.coPayment,
      taxInvoice: S.coTaxOn,
      createdAt: now.toISOString(),
      updatedAt: now.toISOString(),
      mode: S.mode,
      customer,
    };
    S.orders.unshift(order);
    // Also add to sheetOrders local cache so it shows in customer's orders page immediately
    if (!S.sheetOrders) S.sheetOrders = [];
    S.sheetOrders.unshift(order);
    saveState();
    clearCart();
    // ออเดอร์ต้องขึ้น Sheet ให้ได้ — รอผลก่อน อย่าเพิ่งเด้งไปหน้าสำเร็จ
    // (เดิมติดเงื่อนไข autoSync + fire-and-forget + go() ทันที = ออเดอร์หลุดหายเงียบๆ)
    if (S.sheetApiUrl) {
      toast("⏳ กำลังบันทึกออเดอร์...");
      const ok = await pushOrderToSheet(order);
      if (ok) {
        toast(`✓ บันทึกออเดอร์ ${poNo} เรียบร้อย`);
      } else {
        order.pendingSync = true;
        saveState();
        toast(`⚠️ ออเดอร์ ${poNo} ยังไม่ขึ้นระบบกลาง — จะลองส่งใหม่ให้อัตโนมัติ`);
      }
    } else {
      console.warn("[order] Sheet ไม่ได้เชื่อม — order เก็บใน localStorage อย่างเดียว");
    }
    go('/success/' + poNo);
  }

  // SHA-256 → hex (ใช้เก็บรหัสแทน plain text)
  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function saveAddress(existingId) {
    const g = id => (document.getElementById(id)||{}).value.trim();
    const label = g('ad-label');
    const name = g('ad-name');
    const phone = g('ad-phone');
    const addr = g('ad-addr');
    const prov = g('ad-prov');
    const zip = g('ad-zip');
    if (!label || !name || !phone || !addr || !prov || !zip) { toast("กรุณากรอกช่องที่มี * ให้ครบ"); return; }
    const subdist = g('ad-subdist');
    const dist = g('ad-dist');
    const fullAddress = `${addr} ต.${subdist||''} อ.${dist||''} จ.${prov} ${zip}`.replace(/\s+/g, ' ').trim();
    const address = {
      id: existingId || ('ADDR-' + Date.now()),
      label, name, phone, addr, subdist, dist, prov, zip, fullAddress,
      isDefault: false,
    };
    // Find registered user
    const rIdx = S.registeredUsers.findIndex(u => u.phone === S.user.phone || u.email === S.user.email);
    let list;
    if (rIdx >= 0) {
      if (!S.registeredUsers[rIdx].addresses) S.registeredUsers[rIdx].addresses = [];
      list = S.registeredUsers[rIdx].addresses;
    } else {
      // Guest — save on S.user
      if (!S.user.addresses) S.user.addresses = [];
      list = S.user.addresses;
    }
    const idx = list.findIndex(a => a.id === existingId);
    if (idx >= 0) {
      // Preserve isDefault
      address.isDefault = list[idx].isDefault;
      list[idx] = address;
    } else {
      // First address = default
      if (list.length === 0) address.isDefault = true;
      list.push(address);
    }
    saveState();
    toast(existingId ? "บันทึกที่อยู่แล้ว ✓" : "เพิ่มที่อยู่แล้ว ✓");
    go('/account/addresses');
  }

  const REG_FIELDS = ['firstname','lastname','phone','email','addr','subdist','dist','prov','zip',

  const REG_SECRET = ['pw','pw2'];

  function regDraftSet(key, val) {
    if (REG_SECRET.indexOf(key) >= 0) { _regPw[key] = val; return; }

    S.regDraft[key] = val;
    safeSet("iamplastic.regDraft", S.regDraft);

  function regDraftGet(key) {
    if (REG_SECRET.indexOf(key) >= 0) return _regPw[key] || '';
    return (S.regDraft || {})[key] || '';

  function regDraftClear() {
    S.regDraft = {}; _regPw = {};
