  function go(path) {
    // Reset pagination when navigating
    S.homeLimit = 40; S.catLimit = 40;
    // ล้างที่อยู่ที่ค้างในฟอร์ม — ไม่งั้นแก้ที่อยู่ A แล้วไปเปิด B จะเห็นค่าของ A
    S.addrPick = {};
    location.hash = "#" + path;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  // แท็บอื่นเขียน localStorage → อัปเดตแท็บนี้ตาม
  // (แต่ละแท็บมีสำเนา S ของตัวเอง ถ้าไม่ฟังจะเห็นข้อมูลคนละชุด)
  window.addEventListener("storage", (e) => {
    if (!e.key || e.key.indexOf("iamplastic.") !== 0) return;
    const prop = e.key.slice("iamplastic.".length);
    if (!(prop in S)) return;
    try {
      S[prop] = e.newValue ? JSON.parse(e.newValue) : S[prop];
      // URL ไม่ได้อยู่ใน localStorage แล้ว จึงไม่มีเคส "แท็บอื่นเปลี่ยน URL" อีก
      render();
    } catch (err) { console.warn("[storage sync]", prop, err); }
  });

  // เตือนถ้าแท็บนี้รันโค้ดเก่ากว่าที่ deploy อยู่ (เปิดค้างไว้ข้ามการอัปเดต)
  // แถบเตือนค้างจอ ถ้าเครื่องนี้ยังใช้ URL ทดสอบอยู่ (จะได้ไม่ลืมแล้วงงว่าข้อมูลไม่ตรงคนอื่น)
  function showOverrideBanner() {
    if (!hasApiOverride() || document.getElementById('api-override-bar')) return;
    const bar = document.createElement('div');
    bar.id = 'api-override-bar';
    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:3001;background:#7A1D2A;color:#fff;padding:8px 16px;font-size:12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap';
    bar.innerHTML = `⚠️ เครื่องนี้ใช้ URL ทดสอบ — ข้อมูลอาจไม่ตรงกับเครื่องอื่น
      <button onclick="clearApiOverride()" style="background:#fff;color:#7A1D2A;border:none;padding:4px 14px;border-radius:99px;font-weight:800;cursor:pointer;font-family:inherit">↩️ กลับค่าศูนย์กลาง</button>`;
    document.body.appendChild(bar);
  }

  async function checkAppFresh() {
    try {
      const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      const txt = await r.text();
      const m = txt.match(/const APP_VERSION = (\d+)/);
      const live = m ? Number(m[1]) : null;
      if (live && live > APP_VERSION) {
        const bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:3000;background:#AB2739;color:#fff;padding:12px 16px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap';
        bar.innerHTML = `⚠️ แท็บนี้ใช้เว็บเวอร์ชันเก่า (v${APP_VERSION}) · เวอร์ชันล่าสุดคือ v${live}
          <button onclick="location.reload(true)" style="background:#fff;color:#AB2739;border:none;padding:6px 16px;border-radius:99px;font-weight:800;cursor:pointer;font-family:inherit">🔄 โหลดใหม่</button>`;
        document.body.appendChild(bar);
      }
    } catch (e) { /* offline — ข้ามไป */ }
  }

  window.addEventListener("hashchange", () => {
    closeTiktok();
    render();
    // GA4 page_view สำหรับ SPA hash routes
    if (window.gtag && S.gaTagId) {
      gtag('event', 'page_view', { page_path: location.hash || '/', page_title: document.title });
    }
  });
  window.addEventListener("load", () => {
    document.body.dataset.mode = S.mode;
    updateCartBadge();
    renderCatStrip();
    render();
    // Auto-load latest data from Sheet in background (if configured)
    autoLoadFromSheet();
    // LIFF init (ถ้าตั้งค่า)
    if (S.liffId) initLIFF();
    showOverrideBanner();
    setTimeout(checkAppFresh, 3000);

    // กลับมาที่แท็บนี้ → ดึงคลิป/ตั้งค่าใหม่ (กันสองแท็บข้อมูลไม่ตรงกัน)
    let _lastFocusSync = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - _lastFocusSync < 15000) return; // กันยิงถี่เกิน
      _lastFocusSync = Date.now();
      if (!S.sheetApiUrl) return;
      pullPromosFromSheet().then(()=>render()).catch(()=>{});
      pullSettingsFromSheet().then(()=>render()).catch(()=>{});
      // อยู่หน้า admin ลูกค้า → ดึงรายชื่อใหม่ด้วย
      if (isAdmin() && currentRoute().indexOf('/admin/customer') === 0) {
        pullCustomersFromSheet().then(()=>render()).catch(()=>{});
      }
    });
    // GA4 inject (ถ้าตั้งค่า)
    if (S.gaTagId && S.gaTagId.startsWith('G-')) {
      const s = document.createElement('script');
      s.async = true; s.src = `https://www.googletagmanager.com/gtag/js?id=${S.gaTagId}`;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ dataLayer.push(arguments); };
      gtag('js', new Date()); gtag('config', S.gaTagId);
    }
  });

  function currentRoute() {

  let EP = []; // effective products cache — refreshed each render
  function render() {

    // ลูกน้องพิมพ์ URL ตรงเข้าหน้าที่ไม่มีสิทธิ์ → เด้งกลับ dashboard
    if (!routeAllowed(r)) {
      setTimeout(() => { denyStaff('เข้าหน้านี้'); go('/admin'); }, 10);
      $("app").innerHTML = '';
      return;
    }
    let content = "";
    if (r === "/" || r.startsWith("/?")) content = viewHome();
    else if (r.startsWith("/cat/")) content = viewCategory(r.split("/")[2]);
    else if (r.startsWith("/product/")) content = viewProduct(r.split("/")[2]);
    else if (r === "/cart") content = viewCart();
    else if (r === "/checkout") content = viewCheckout();
    else if (r.startsWith("/success/")) content = viewOrderDetail(r.split("/")[2], true);
    else if (r.startsWith("/upload-slip/")) content = viewUploadSlip(r.split("/")[2]);
    else if (r === "/orders") content = viewOrders();
    else if (r.startsWith("/order/")) content = viewOrderDetail(r.split("/")[2], false);
    else if (r === "/login") content = viewLogin();
    else if (r === "/register") content = viewRegister();
    else if (r === "/forgot") content = viewForgot();
    else if (r.startsWith("/reset/")) content = viewReset(decodeURIComponent(r.split("/")[2] || ''));
    else if (r === "/account/addresses") content = viewAddresses();
    else if (r === "/account/address/new") content = viewAddressForm(null);
    else if (r.startsWith("/account/address/")) content = viewAddressForm(r.split("/")[3]);
    else if (r === "/admin") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminDashboard(); }
    else if (r === "/admin/products") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminProducts(); }
    else if (r.startsWith("/admin/edit/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminEdit(r.split("/")[3]); }
    else if (r === "/admin/new") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminEdit(null); }
    else if (r === "/admin/orders") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminOrders(); }
    else if (r === "/admin/bills") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminBills(); }
    else if (r === "/admin/customers") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminCustomers(); }

    else if (r === "/admin/coupons") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminCoupons(); }
    else if (r === "/admin/settings") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminSettings(); }
    else if (r === "/admin/promos") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminPromos(); }
    else if (r === "/admin/tiktok") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminTiktok(); }
    else if (r === "/admin/manage") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminManage(); }
    else if (r === "/admin/account") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminAccount(); }
    else if (r.startsWith("/admin/label/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminLabel(r.split("/")[3]); }
    else if (r === "/account/profile") content = viewAccountProfile();
    else if (r === "/account/wishlist") content = viewWishlist();
    else if (r === "/admin/create-bill") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminCreateBill(); }
    else if (r.startsWith("/admin/order/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminOrderDetail(r.split("/")[3]); }
    else if (r.startsWith("/admin/bill/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminBill(r.split("/")[3]); }
    else content = viewHome();
    // Preserve focus + caret position across re-renders (fixes input focus loss)
    const focused = document.activeElement;
    const focusedId = focused && focused.id;
    const isTextInput = focused && (focused.tagName === "INPUT" || focused.tagName === "TEXTAREA");
    const selStart = isTextInput ? focused.selectionStart : null;
    const selEnd = isTextInput ? focused.selectionEnd : null;

    $("app").innerHTML = content;
    updateCatStrip(r);
    updateHeaderUser();
    updateAdminRibbon();
    updateCartBadge(); // ensure header cart count is fresh
    setupTiktokAutoplay();

    // Restore focus if same element still exists
    if (focusedId) {
      const el = document.getElementById(focusedId);
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
        el.focus();
        if (selStart !== null && typeof el.setSelectionRange === "function") {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  // ============================================================
  // Banner rotator
  // เดิมเขียนว่า "rotator" แต่โชว์ banners[0] ตัวเดียวตลอด ส่วนจุดข้างล่าง
  // เป็นแค่ของตกแต่ง ไม่เคยเปลี่ยนเลย → แอดมินเพิ่ม banner ที่ 2,3 แล้วไม่เห็นอะไรขึ้น
  // ============================================================
  let _bannerIdx = 0;
  let _bannerTimer = null;

  function bannerGoTo(i, manual) {
    const n = (S.banners || []).length;
    if (!n) return;
    _bannerIdx = ((i % n) + n) % n;
    const host = document.getElementById('promo-banner');
    if (host) host.innerHTML = bannerSlideHtml();
    if (manual) startBannerRotation();   // กดเองแล้วนับเวลาใหม่
  }

  function startBannerRotation() {
    if (_bannerTimer) clearInterval(_bannerTimer);
    if ((S.banners || []).length < 2) return;
    _bannerTimer = setInterval(() => {
      // ไม่ต้องหมุนตอนผู้ใช้ไม่ได้ดูแท็บนี้
      if (document.visibilityState !== 'visible') return;
      if (!document.getElementById('promo-banner')) { clearInterval(_bannerTimer); _bannerTimer = null; return; }
      bannerGoTo(_bannerIdx + 1);
    }, 5000);
  }

  function bannerSlideHtml() {

  // ดึงเลข video id จาก URL TikTok (ใช้สร้าง embed player)
  // แกะเลข video id จากลิงก์ TikTok หลายรูปแบบ
  // ลิงก์สั้น vt.tiktok.com แกะฝั่งเว็บไม่ได้ (ต้องตามredirect) — ต้องให้ backend แปลงก่อน
  function tiktokVideoId(url) {
    const u = String(url || '').trim();
    if (/^\d{8,}$/.test(u)) return u;                       // ใส่มาแต่ตัวเลข
    const pats = [
      /\/video\/(\d+)/,        // .../@user/video/123
      /\/photo\/(\d+)/,        // โพสต์รูป
      /\/embed\/v2\/(\d+)/,    // ลิงก์ embed
      /\/v\/(\d+)/,            // m.tiktok.com/v/123.html
      /[?&]item_id=(\d+)/,
      /[?&]video_id=(\d+)/,
    ];
    for (const re of pats) { const m = u.match(re); if (m) return m[1]; }
    return null;
  }

  // ลิงก์สั้นที่ยังไม่ได้แปลง = เล่นในเว็บไม่ได้ ต้องกด "ซ่อมลิงก์"
  function isShortTiktokLink(url) {
    return /(vt|vm)\.tiktok\.com\//i.test(String(url||''));
  }

  function renderTiktokCard(v, idx) {
    const url = esc(v.url||'');
    const thumb = esc(v.thumbnail||'');
    const vid = tiktokVideoId(v.url);
    const preview = esc(v.previewVideo||'');
    const auto = S.tiktokAutoplay !== false; // default เปิด

    // ชั้นสื่อ: ถ้ามีวิดีโอ preview ที่อัพเอง → เล่นวนอัตโนมัติแบบปิดเสียง (ชัวร์ 100%)
    // ถ้าไม่มี แต่เปิด autoplay + มี video id → โหลด TikTok player ตอนเลื่อนมาเห็น
    let media;
    if (preview) {
      media = `<video src="${preview}" ${auto?'autoplay':''} muted loop playsinline preload="metadata"
        ${thumb?`poster="${thumb}"`:''}
        style="width:100%;height:100%;object-fit:cover;display:block"></video>`;
    } else {
      // หมายเหตุสำคัญ: TikTok embed player "เล่นเองอัตโนมัติไม่ได้"
      // พารามิเตอร์ autoplay=1&muted=1 ที่เคยใส่ไว้ TikTok ไม่รองรับ — ไม่มีผลอะไรเลย
      // ของเดิมจึงได้ player ที่ค้างนิ่ง แถมใส่ pointer-events:none ทำให้กดปุ่มเล่นก็ไม่ได้
      // → แสดงรูปปก + ปุ่ม ▶ แทน กดแล้วเปิด player เต็มจอซึ่งเล่นได้จริง
      // ถ้าอยากให้ "เล่นวนเองแบบไม่มีเสียง" ต้องอัปวิดีโอตัวอย่าง (previewVideo) ซึ่งรองรับอยู่แล้ว
      media = thumb ? `<img src="${thumb}" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.display='none'">`
                    : `<div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#1a1a1a,#333);color:#fff;font-size:32px">🎵</div>`;
    }

    // ถ้าเล่นวนอยู่แล้ว ไม่ต้องมีปุ่ม ▶ ใหญ่บังหน้าจอ — ใช้ไอคอนเสียงปิดแทน
    const playing = !!preview;
    return `
      <div onclick="playTiktok('${url}')" style="cursor:pointer;background:#000;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:9/16;box-shadow:var(--shadow);transition:transform .15s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
        ${media}
        ${playing
          ? `<div style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px" title="ปิดเสียงอยู่ — กดเพื่อดูพร้อมเสียง">🔇</div>`
          : `<div style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.15);pointer-events:none">
               <div style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:18px;color:#000;box-shadow:0 2px 12px rgba(0,0,0,.4);padding-left:3px">▶</div>
             </div>`}
        ${v.views ? `<div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;pointer-events:none">${esc(v.views)}</div>` : ''}
        ${v.title ? `<div style="position:absolute;bottom:0;left:0;right:0;padding:24px 8px 8px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);color:#fff;font-size:11px;font-weight:600;pointer-events:none">${esc(v.title.slice(0,60))}</div>` : ''}
        ${!vid && !preview ? `<div style="position:absolute;top:8px;left:8px;background:#f59e0b;color:#fff;font-size:9px;padding:2px 6px;border-radius:3px">เปิดใน TikTok</div>` : ''}
      </div>
    `;
  }

  // เดิมมี IntersectionObserver คอยสลับรูปเป็น TikTok iframe ตอนเลื่อนมาเห็น
  // ถอดออกแล้ว เพราะ TikTok embed เล่นเองไม่ได้ — ได้ player ค้างนิ่งเปล่าๆ
  function setupTiktokAutoplay() { /* ไม่ใช้แล้ว */ }

  // เล่นคลิปในหน้าเว็บ (TikTok embed player)
  function playTiktok(url) {
    const vid = tiktokVideoId(url);
    if (!vid) {
      // ลิงก์สั้น / ลิงก์ช่อง — ไม่มี video id ให้ embed ได้ → เปิด TikTok แทน
      window.open(url, '_blank', 'noopener');
      return;
    }
    let el = document.getElementById('tt-player');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tt-player';
      document.body.appendChild(el);
    }
    el.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px';
    el.innerHTML = `
      <button onclick="closeTiktok()" aria-label="ปิด" style="position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer">✕</button>
      <div style="width:100%;max-width:340px;aspect-ratio:9/16;max-height:90vh;background:#000;border-radius:12px;overflow:hidden" onclick="event.stopPropagation()">
        <iframe src="https://www.tiktok.com/embed/v2/${esc(vid)}?autoplay=1"
          style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div id="tt-fallback" style="display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.75);padding:8px 16px;border-radius:8px;text-align:center;max-width:300px;line-height:1.6">
        ยังไม่ขึ้น? คลิปบางอันเจ้าของตั้งค่าห้ามฝังในเว็บ<br>กดปุ่มข้างล่างเพื่อดูใน TikTok
      </div>
      <a href="${esc(url)}" target="_blank" rel="noopener" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(255,255,255,.15);padding:8px 18px;border-radius:99px;text-decoration:none">เปิดใน TikTok ↗</a>
    `;
    // บางเครือข่าย/บางคลิป TikTok ไม่ยอมให้ฝัง — กันผู้ใช้นั่งมองจอดำ
    setTimeout(() => {
      const box = document.getElementById('tt-fallback');
      if (box) box.style.display = 'block';
    }, 5000);
    el.onclick = (e) => { if (e.target === el) closeTiktok(); };
    document.body.style.overflow = 'hidden';
    _ttEscHandler = (e) => { if (e.key === 'Escape') closeTiktok(); };
    document.addEventListener('keydown', _ttEscHandler);
  }
  let _ttEscHandler = null;
  function closeTiktok() {
    const el = document.getElementById('tt-player');
    if (el) el.remove();
    document.body.style.overflow = '';
    if (_ttEscHandler) { document.removeEventListener('keydown', _ttEscHandler); _ttEscHandler = null; }
  }

  function addFromPd(pid) {
    const p = EP.find(x => x.id === pid);
    addToCart(pid, S.pdQty, S.pdSize);
    toast(`เพิ่ม ${p.name.slice(0,25)}… × ${S.pdQty} แล้ว 🛒`);
  }
  function buyNow(pid) { addFromPd(pid); go('/cart'); }

  function viewCart() {
    // คูปองไม่ดึงตอนเปิดเว็บแล้ว — ดึงตรงนี้ที่เดียว (เบากว่า และเป็นจุดที่ต้องใช้จริง)
    if (S.sheetApiUrl && S.cart.length && (Date.now()-(S.couponsLastSync||0))>60000) {
      S.couponsLastSync = Date.now();
      pullCouponsFromSheet().then(()=>render()).catch(()=>{});
    }
    if (S.cart.length === 0) {
      return `
        <div class="section-head"><h2>ตะกร้าสินค้า</h2></div>
        <div class="cart-empty">
          <div class="icon">🛒</div>
          <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px">ตะกร้าว่างเปล่า</div>
          <div style="font-size:13px;margin-bottom:16px">ยังไม่มีสินค้าในตะกร้า — ลองไปเลือกดูสินค้าดีๆ</div>
          <button class="btn btn-primary" onclick="go('/')">← กลับหน้าแรก</button>
        </div>`;

    const sub = cartSubtotal();
    const disc = couponDiscount();
    const ship = shippingFee();
    const remote = remoteFee();
    const tot = sub - disc + ship + remote;
    return `
      <div class="section-head"><h2>ตะกร้าสินค้า <span style="color:var(--text-muted);font-size:14px;font-weight:400">(${S.cart.length} รายการ)</span></h2></div>
      ${(() => {
        const r = currentRemoteArea();
        if (!r) return '';
        const where = r.whole ? `จ.${esc(r.prov)}` : `อ.${esc(r.dist)} จ.${esc(r.prov)}`;
        const fee = Number(S.remoteFee) || 0;
        return `<div style="background:#e6f4ff;border:1px solid #91caff;padding:11px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#003a75;line-height:1.7">
          📍 <b>${where} เป็นพื้นที่ห่างไกล</b>${fee > 0 ? ` — มีค่าจัดส่งเพิ่ม ${money(fee)}` : ''}<br>
          <span style="font-size:12px">อาจใช้เวลาส่งนานกว่าปกติ 1-3 วัน</span>
        </div>`;
      })()}
      ${missingCartItems().length ? `
        <div style="background:#fff3cd;border:1px solid #ffc107;padding:11px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#7a5a00;line-height:1.7">
          ⚠️ มี ${missingCartItems().length} รายการในตะกร้าที่ไม่มีในร้านแล้ว — ไม่ถูกนำมาคิดเงิน
          <button class="btn btn-outline" style="margin-left:8px;font-size:12px;padding:3px 12px" onclick="removeMissingCartItems()">🗑️ ลบออก</button>
        </div>` : ''}
      ${toggleBar(false)}
      <div class="cart-page">
        <div class="cart-items">
          <div class="cart-head-row"><div></div><div>สินค้า</div><div>ราคา</div><div>จำนวน</div><div style="text-align:right">รวม</div><div></div></div>
          ${S.cart.map((item, idx) => {
            const p = EP.find(x => x.id === item.pid);
            // สินค้าหาไม่เจอ (ถูกลบ/เปลี่ยนรหัส) — ต้องแสดงแถวให้กดลบได้
            // เดิมพังทั้งหน้า ลูกค้าเลยกดตะกร้าแล้วไม่ขึ้นอะไรและลบของก็ไม่ได้
            if (!p) {
              return `<div class="cart-row" style="opacity:.75">
                <div class="cart-thumb">❓</div>
                <div class="cart-nm">สินค้านี้ไม่มีในร้านแล้ว
                  <div class="sub" style="color:#b02a2a">SKU: ${esc(item.pid)}${item.size ? ' · ขนาด: '+esc(item.size) : ''}</div></div>
                <div class="cart-p mono">—</div>
                <div class="qty-ctrl" style="opacity:.4;pointer-events:none"><button>−</button><input value="${Number(item.qty)||0}" readonly><button>+</button></div>
                <div class="cart-p b mono">—</div>
                <div class="cart-del" onclick="removeCart(${idx});render()" title="ลบ">🗑️</div>
              </div>`;
            }
            const each = priceOf(p, item.qty);
            const line = each * item.qty;
            return `<div class="cart-row">
              <div class="cart-thumb">${productThumb(p)}</div>
              <div class="cart-nm">${esc(p.name || '')}<div class="sub">${item.size ? 'ขนาด: '+esc(item.size)+' · ' : ''}SKU: ${esc(p.id)}${(() => {
                const w = Number(p.weight) || 0;
                // ลูกค้าไม่ต้องรับรู้เรื่องข้อมูลไม่ครบ — บอกเฉพาะแอดมินที่แก้ได้
                if (!w) return isAdmin() ? ' · <span style="color:#b45309">⚠️ ยังไม่มีน้ำหนักใน Sheet (คิด 1 kg)</span>' : '';
                return ` · ${fmtKg(w)} × ${item.qty} = <b>${fmtKg(w * item.qty)}</b>`;
              })()}</div></div>
              <div class="cart-p mono">${money(each)}</div>
              <div class="qty-ctrl">
                <button onclick="updateCartQty(${idx},-1);render()">−</button>
                <input type="number" value="${item.qty}" min="1" onchange="S.cart[${idx}].qty=Math.max(1,parseInt(this.value)||1);saveState();render()">
                <button onclick="updateCartQty(${idx},1);render()">+</button>
              </div>
              <div class="cart-p b mono">${money(line)}</div>
              <div class="cart-del" onclick="removeCart(${idx});render()" title="ลบ">🗑️</div>
            </div>`;
          }).join("")}
        </div>
        <div class="summary">

          <div class="coupon-row">
            <input id="coupon-inp" placeholder="รหัสคูปอง (ลอง: NEW100)" value="${S.coupon}">

          </div>
          ${S.coupon === "NEW100" ? `<div class="coupon-active">✓ ใช้โค้ด <b>NEW100</b> แล้ว (−฿100)</div>` : ''}
          <div class="summ-row"><span>ยอดสินค้า (${cartCount()})</span><span class="mono">${money(sub)}</span></div>

          ${S.coShipping !== 'pickup' ? `<div style="font-size:11px;color:var(--text-muted);margin:-4px 0 8px;line-height:1.6">
            คิดจากน้ำหนักรวม · ปลายทาง ${esc(ZONE_LABEL[shipZoneOf(currentShipProvince())])}
            ${currentShipProvince() ? '' : '<br>(ยังไม่ระบุจังหวัด — คิดเรตภาคกลางไว้ก่อน ปรับตามจริงตอน checkout)'}
          </div>` : ''}
          <div class="summ-row"><span>VAT (7%)</span><span class="mono" style="font-size:11px">รวมแล้ว</span></div>
          <div class="summ-total"><b>รวมทั้งสิ้น</b><b class="tot">${money(tot)}</b></div>
          <button class="btn btn-primary btn-block btn-big" style="margin-top:14px" onclick="go('/checkout')">ดำเนินการชำระเงิน →</button>
          <div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:10px">🔒 ปลอดภัย · ออกใบกำกับภาษีได้</div>
        </div>
      </div>
    `;
  }

  function applyCoupon() {
    const val = $("coupon-inp").value.trim().toUpperCase();
    const c = findCoupon(val);
    if (c) {
      S.coupon = c.code;
      saveState();
      const label = c.kind==='percent' ? `${c.value}%` : `฿${c.value}`;
      toast(`ใช้คูปอง ${c.code} ลด ${label} แล้ว`);
    } else {
      S.coupon = ""; saveState();
      toast("ไม่พบคูปองนี้ / หมดอายุ / ใช้ครบแล้ว");
    }
    render();
  }

    const ship = shippingFee();
    const remote = remoteFee();
    const tot = sub - disc + ship + remote;

                        </div>
                        <a onclick="event.stopPropagation();go('/account/address/${a.id}')" style="color:var(--brand);cursor:pointer;font-size:11px;flex-shrink:0">✏️ แก้ไข</a>
                      </div>
                    `).join('')}
                  </div>
                  ${addresses.length > 1 ? '<div style="font-size:11px;color:var(--wholesale);background:var(--wholesale-soft);padding:8px 12px;border-radius:6px;margin-bottom:10px">💡 คลิกที่อยู่ใดๆ เพื่อเปลี่ยนที่ส่ง</div>' : ''}
                ` : ''}
                ${!isLoggedIn() || addresses.length === 0 ? `

  async function _placeOrder() {
    const now = new Date();
    const yymm = String(now.getFullYear()+543).slice(-2) + String(now.getMonth()+1).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
    const poNo = `PO-${yymm}-${rand}`;
    const sub = cartSubtotal();
    const disc = couponDiscount();
    const ship = shippingFee();
    const remote = remoteFee();
    const tot = sub - disc + ship + remote;
    // Get selected address
    let customer;
    if (isLoggedIn()) {
      const addresses = getUserAddresses();
      const selected = S.coAddressId ? addresses.find(a => a.id === S.coAddressId) : addresses.find(a => a.isDefault) || addresses[0];
      if (selected) {
        customer = { name: selected.name, phone: selected.phone, address: selected.fullAddress, email: S.user.email };
      } else {
        customer = { name: S.user.name, phone: S.user.phone, address: S.user.address || '', email: S.user.email };
      }
      if (S.user.isCorporate) {
        customer.company = S.user.company;
        customer.taxId = S.user.taxId;
      }
    } else {
      // Guest — get from checkout form inputs
      const g = id => (document.getElementById(id)||{}).value.trim();
      const fullAddr = `${g('co-addr')} ต.${g('co-subdist')} อ.${g('co-dist')} จ.${g('co-prov')} ${g('co-zip')}`.replace(/\s+/g, ' ').trim();
      customer = { name: g('co-name') || 'ลูกค้า', phone: g('co-phone'), address: fullAddr };
    }
    const order = {
      po: poNo,
      status: "pending_payment",   // ทุกออเดอร์ต้องโอนเงิน + แนบสลิปก่อนเสมอ
      total: tot,
      subtotal: sub,
      discount: disc,
      shipping: ship + remote,
      remoteFee: remote,
      items: [...S.cart].map(i => ({ ...i, priceEach: priceOf(EP.find(p=>p.id===i.pid), i.qty) })),
      shippingMethod: S.coShipping,
      carrierName: null,
      tracking: null,
      payment: S.coPayment,
      taxInvoice: S.coTaxOn,
      createdAt: now.toISOString(),
      updatedAt: now.toISOString(),
      mode: S.mode,
      customer,
    };
    S.orders.unshift(order);
    // Also add to sheetOrders local cache so it shows in customer's orders page immediately
    if (!S.sheetOrders) S.sheetOrders = [];
    S.sheetOrders.unshift(order);
    saveState();
    clearCart();
    // ออเดอร์ต้องขึ้น Sheet ให้ได้ — รอผลก่อน อย่าเพิ่งเด้งไปหน้าสำเร็จ
    // (เดิมติดเงื่อนไข autoSync + fire-and-forget + go() ทันที = ออเดอร์หลุดหายเงียบๆ)
    if (S.sheetApiUrl) {
      toast("⏳ กำลังบันทึกออเดอร์...");
      const ok = await pushOrderToSheet(order);
      if (ok) {
        toast(`✓ บันทึกออเดอร์ ${poNo} เรียบร้อย`);
      } else {
        order.pendingSync = true;
        saveState();
        toast(`⚠️ ออเดอร์ ${poNo} ยังไม่ขึ้นระบบกลาง — จะลองส่งใหม่ให้อัตโนมัติ`);
      }
    } else {
      console.warn("[order] Sheet ไม่ได้เชื่อม — order เก็บใน localStorage อย่างเดียว");
    }
    go('/success/' + poNo);
  }

  // (เคยลืม ทำให้หน้าตรวจสอบขึ้นว่า "ไม่ต้อง deploy ใหม่" ทั้งที่ backend ตกรุ่นอยู่)

  // SHA-256 → hex (ใช้เก็บรหัสแทน plain text)
  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ============================================================
  // รหัสผ่านลูกค้า
  //
  // เดิม: เก็บ btoa(รหัส) ไว้ในเครื่องที่สมัครเท่านั้น
  //   → สมัครด้วยมือถือแล้วล็อกอินบนคอมไม่ได้ตลอดกาล
  //   → พอกดสมัครใหม่ Sheet ก็บอกว่าอีเมลซ้ำ วนไม่จบ
  //   → btoa ไม่ใช่การเข้ารหัส เปิด devtools อ่านรหัสลูกค้าได้หมด
  //
  // ตอนนี้: เก็บ sha256(salt + รหัสผ่าน) ไว้ที่ Sheet
  //   เข้าเครื่องไหนก็ล็อกอินได้ และรหัสจริงไม่ถูกเก็บที่ไหนเลย
  // ============================================================
  function newSalt() {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('');
  }

  async function hashPassword(password, salt) {
    return await sha256(String(salt || '') + String(password || ''));
  }

  async function loginAsCustomer() {
    const contact = document.getElementById("login-phone").value.trim();
    const pw = (document.getElementById("login-pw") || { value: '' }).value;
    if (!contact) { toast("กรุณาใส่เบอร์หรืออีเมล"); return; }
    if (!pw) { toast("กรุณาใส่รหัสผ่าน"); return; }

    // 1) ถามจาก Sheet ก่อน — เข้าได้จากทุกเครื่อง
    if (S.sheetApiUrl) {
      toast("⏳ กำลังตรวจสอบ...");
      try {
        const res = await apiCall("customerAuth", { login: contact }, true);
        const acc = res && res.ok && res.auth;
        if (acc && acc.found) {
          if (!acc.passHash) {
            // บัญชีเก่าที่ยังไม่มีรหัสบน Sheet — กู้ให้เลยถ้ารหัสเดิมในเครื่องนี้ตรง
            const local = S.registeredUsers.find(u => u.email === acc.email || u.phone === acc.phone);
            if (local && local.password === btoa(pw)) {
              const salt = newSalt();
              const hash = await hashPassword(pw, salt);
              await apiCall("setCustomerPassword", { login: contact, passHash: hash, passSalt: salt }, true);
              finishCustomerLogin(acc, local);
              return;
            }
            toast("บัญชีนี้ยังไม่ได้ตั้งรหัสผ่านในระบบใหม่");
            setTimeout(() => toast("👉 กด \"ลืมรหัสผ่าน\" เพื่อตั้งรหัสใหม่ทางอีเมล"), 1800);
            return;
          }
          const hash = await hashPassword(pw, acc.passSalt);
          if (hash !== acc.passHash) { toast("รหัสผ่านไม่ถูกต้อง"); return; }
          finishCustomerLogin(acc, null);
          return;
        }
        // ไม่มีใน Sheet → ลองดูในเครื่องต่อ (เผื่อสมัครตอนเน็ตหลุด)
      } catch (e) {
        console.warn("[login] ถาม Sheet ไม่ได้ ใช้ข้อมูลในเครื่องแทน", e);
      }
    }

    // 2) ข้อมูลในเครื่อง (บัญชีที่ยังไม่ได้ขึ้น Sheet)
    const existing = S.registeredUsers.find(u =>
      u.phone === contact || u.email === contact || u.companyPhone === contact
    );
    if (!existing) {
      toast("ไม่พบบัญชีนี้");
      setTimeout(() => toast("ยังไม่มีบัญชี? กด \"สมัครสมาชิก\" ด้านล่าง"), 1600);
      return;
    }
    if (existing.password !== btoa(pw)) { toast("รหัสผ่านไม่ถูกต้อง"); return; }

    // ล็อกอินผ่านแล้ว — ถือโอกาสดันบัญชี + รหัสขึ้น Sheet ให้เลย
    if (S.sheetApiUrl) {
      const salt = newSalt();
      const hash = await hashPassword(pw, salt);
      pushCustomerToSheet({ ...existing, passHash: hash, passSalt: salt }).catch(() => {});
    }
    finishCustomerLogin(null, existing);
  }

  function finishCustomerLogin(fromSheet, fromLocal) {
    const base = fromLocal || {};
    const acc = fromSheet
      ? { ...base, ...fromSheet, password: base.password }
      : base;
    delete acc.passHash; delete acc.passSalt; delete acc.found;

    // เก็บลง registeredUsers ของเครื่องนี้ไว้ใช้ตอนออฟไลน์
    const idx = S.registeredUsers.findIndex(u =>
      (acc.email && u.email === acc.email) || (acc.phone && u.phone === acc.phone));
    if (idx >= 0) S.registeredUsers[idx] = { ...S.registeredUsers[idx], ...acc };
    else S.registeredUsers.push(acc);

    S.user = { role: 'customer', ...acc };
    saveState();
    toast(`ยินดีต้อนรับกลับ คุณ${acc.firstName || acc.name || ''} 👋`);
    go('/');
  }

  // ---------- ลืมรหัสผ่าน ----------
  async function sendResetLink() {
    const email = (document.getElementById('forgot-email') || {}).value.trim();
    if (!email || email.indexOf('@') < 0) { toast("กรุณากรอกอีเมลให้ถูกต้อง"); return; }
    if (!S.sheetApiUrl) { toast("ระบบยังไม่พร้อม — ติดต่อร้านทาง LINE"); return; }

    S._forgotSending = true; render();
    try {
      const res = await apiCall("requestReset", {
        email,
        siteUrl: location.origin + location.pathname,
      }, true, 40000);
      S._forgotSending = false;
      if (res && res.ok) {
        S._forgotSent = email;
        render();
      } else {
        toast("❌ " + ((res && res.error) || 'ส่งอีเมลไม่สำเร็จ'));
        render();
      }
    } catch (e) {
      S._forgotSending = false;
      toast("❌ " + (e.message || e));
      render();
    }
  }

  async function doResetPassword(token) {
    const pw = (document.getElementById('rs-pw') || {}).value || '';
    const pw2 = (document.getElementById('rs-pw2') || {}).value || '';
    if (pw.length < 6) { toast("รหัสผ่านต้องอย่างน้อย 6 ตัว"); return; }
    if (pw !== pw2) { toast("รหัสผ่านไม่ตรงกัน"); return; }

    toast("⏳ กำลังบันทึก...");
    const salt = newSalt();
    const hash = await hashPassword(pw, salt);
    try {
      const res = await apiCall("resetPassword", { resetToken: token, passHash: hash, passSalt: salt }, true);
      if (res && res.ok) {
        S._resetDone = true; render();
      } else {
        toast("❌ " + ((res && res.error) || 'ตั้งรหัสใหม่ไม่สำเร็จ'));
      }
    } catch (e) { toast("❌ " + (e.message || e)); }
  }

  function saveAddress(existingId) {
    const g = id => (document.getElementById(id)||{}).value.trim();
    const label = g('ad-label');
    const name = g('ad-name');
    const phone = g('ad-phone');
    const addr = g('ad-addr');
    const prov = g('ad-prov');
    const zip = g('ad-zip');
    if (!label || !name || !phone || !addr || !prov || !zip) { toast("กรุณากรอกช่องที่มี * ให้ครบ"); return; }
    const subdist = g('ad-subdist');
    const dist = g('ad-dist');
    const fullAddress = `${addr} ต.${subdist||''} อ.${dist||''} จ.${prov} ${zip}`.replace(/\s+/g, ' ').trim();
    const address = {
      id: existingId || ('ADDR-' + Date.now()),
      label, name, phone, addr, subdist, dist, prov, zip, fullAddress,
      isDefault: false,
    };
    // Find registered user
    const rIdx = S.registeredUsers.findIndex(u => u.phone === S.user.phone || u.email === S.user.email);
    let list;
    if (rIdx >= 0) {
      if (!S.registeredUsers[rIdx].addresses) S.registeredUsers[rIdx].addresses = [];
      list = S.registeredUsers[rIdx].addresses;
    } else {
      // Guest — save on S.user
      if (!S.user.addresses) S.user.addresses = [];
      list = S.user.addresses;
    }
    const idx = list.findIndex(a => a.id === existingId);
    if (idx >= 0) {
      // Preserve isDefault
      address.isDefault = list[idx].isDefault;
      list[idx] = address;
    } else {
      // First address = default
      if (list.length === 0) address.isDefault = true;
      list.push(address);
    }
    saveState();
    toast(existingId ? "บันทึกที่อยู่แล้ว ✓" : "เพิ่มที่อยู่แล้ว ✓");
    go('/account/addresses');
  }

  function setDefaultAddress(id) {
    const rIdx = S.registeredUsers.findIndex(u => u.phone === S.user.phone || u.email === S.user.email);
    const list = rIdx >= 0 ? S.registeredUsers[rIdx].addresses : (S.user.addresses || []);
    list.forEach(a => a.isDefault = (a.id === id));
    saveState();
    toast("ตั้งเป็น default แล้ว ✓");
    render();

  function deleteAddress(id) {
    if (!confirm("ลบที่อยู่นี้?")) return;
    const rIdx = S.registeredUsers.findIndex(u => u.phone === S.user.phone || u.email === S.user.email);
    if (rIdx >= 0) {
      S.registeredUsers[rIdx].addresses = S.registeredUsers[rIdx].addresses.filter(a => a.id !== id);
    } else if (S.user.addresses) {
      S.user.addresses = S.user.addresses.filter(a => a.id !== id);
    }
    saveState();
    toast("ลบแล้ว ✓");
    render();
  }

  // ช่อง input ถูกสร้างใหม่ทุกครั้งที่ render() ทำงาน และ render() ถูกเรียก

  // เก็บค่าที่พิมพ์ไว้ แล้วใส่กลับเข้า value ทุกครั้งที่ render
  // (รหัสผ่านเก็บแค่ในหน่วยความจำ ไม่ลง localStorage)
  // ============================================================
  const REG_FIELDS = ['firstname','lastname','phone','email','addr','subdist','dist','prov','zip',
                      'company','taxid','branch','cphone','cemail','caddr'];
  const REG_SECRET = ['pw','pw2'];
  let _regPw = {};

  function regDraftSet(key, val) {
    if (REG_SECRET.indexOf(key) >= 0) { _regPw[key] = val; return; }
    S.regDraft = S.regDraft || {};
    S.regDraft[key] = val;
    safeSet("iamplastic.regDraft", S.regDraft);
  }
  function regDraftGet(key) {
    if (REG_SECRET.indexOf(key) >= 0) return _regPw[key] || '';
    return (S.regDraft || {})[key] || '';
  }
  function regDraftClear() {
    S.regDraft = {}; _regPw = {};
    safeSet("iamplastic.regDraft", {});
  }

  // เลือกจังหวัด → ล้างอำเภอ/ตำบล/รหัสไปรษณีย์ ที่เลือกไว้เดิมทิ้ง
  // ตัวจัดการ dropdown ที่อยู่แบบใช้ร่วมกัน (checkout = co / สมุดที่อยู่ = ad)
  // เก็บค่าไว้ใน S.addrPick เพราะ render() สร้าง element ใหม่ทุกครั้ง
  function addrPickInit(prefix, seed) {
    if (S.addrPick[prefix]) return S.addrPick[prefix];
    S.addrPick[prefix] = {
      prov: (seed && seed.prov) || '',
      dist: (seed && seed.dist) || '',
      subdist: (seed && seed.subdist) || '',
      zip: (seed && seed.zip) || '',
    };
    return S.addrPick[prefix];
  }

  function onAddrProvince(prefix, v) {
    S.addrPick[prefix] = { prov: v, dist: '', subdist: '', zip: '' };
    render();
  }

  function onAddrDistrict(prefix, v) {
    const a = S.addrPick[prefix] || {};
    a.dist = v; a.subdist = '';
    a.zip = thaiPostcode(a.prov, v, '');
    S.addrPick[prefix] = a;
    render();
  }

  function onAddrSubdistrict(prefix, v) {
    const a = S.addrPick[prefix] || {};
    a.subdist = v;
    a.zip = thaiPostcode(a.prov, a.dist, v);
    S.addrPick[prefix] = a;

  }

      ${addrSelect(`${prefix}-subdist`, 'ตำบล/แขวง *', thaiSubdistricts(a.prov, a.dist), a.subdist, `onAddrSubdistrict('${prefix}', this.value)`, '— เลือกอำเภอก่อน —')}

  function onRegDistrict(v) {
    regDraftSet('dist', v);

  async function doRegister() {
    if (_submitting) { toast("⏳ กำลังดำเนินการ กรุณารอสักครู่"); return; }
    _submitting = true;
    try { await _doRegister(); } finally { _submitting = false; }
  }

  async function _doRegister() {
    const g = id => (document.getElementById(id) || {}).value || '';
    const firstName = g('reg-firstname').trim();
    const lastName = g('reg-lastname').trim();
    const phone = g('reg-phone').trim();
    const email = g('reg-email').trim();
    const password = g('reg-pw');
    const password2 = g('reg-pw2');
    const addr = g('reg-addr').trim();
    const prov = g('reg-prov').trim();
    const zip = g('reg-zip').trim();

    if (!firstName || !lastName) { toast("กรุณากรอกชื่อ-นามสกุล"); return; }
    if (!phone) { toast("กรุณากรอกเบอร์โทร"); return; }
    if (!email || !email.includes('@')) { toast("กรุณากรอกอีเมลให้ถูกต้อง"); return; }
    if (!password || password.length < 6) { toast("รหัสผ่านต้องอย่างน้อย 6 ตัว"); return; }
    if (password !== password2) { toast("รหัสผ่านไม่ตรงกัน"); return; }
    if (!addr) { toast("กรุณากรอกบ้านเลขที่ / ถนน"); return; }
    if (!prov) { toast("กรุณาเลือกจังหวัด"); return; }
    if (!g('reg-dist').trim()) { toast("กรุณาเลือกอำเภอ/เขต"); return; }
    if (!g('reg-subdist').trim()) { toast("กรุณาเลือกตำบล/แขวง"); return; }
    if (!zip) { toast("ไม่พบรหัสไปรษณีย์ — ลองเลือกตำบลใหม่อีกครั้ง"); return; }

    // ============================================================
    // เช็คซ้ำ — ต้องดูทั้ง Sheet (ศูนย์กลาง) และในเครื่อง
    //
    // บั๊กเดิม: ดูแค่ S.registeredUsers ซึ่งเป็นข้อมูล "เฉพาะเครื่องนี้"
    // ถ้าสมัครครั้งก่อนแล้วส่งขึ้น Sheet ไม่สำเร็จ จะมีชื่อค้างอยู่ในเครื่อง
    // → สมัครใหม่ไม่ได้ตลอดกาล ทั้งที่ใน Sheet ไม่มีชื่อเลย
    // ============================================================
    const inSheet = (S.sheetCustomers || []).find(u =>
      (u.phone && u.phone === phone) || (u.email && u.email === email));
    const inLocal = S.registeredUsers.find(u => u.phone === phone || u.email === email);

    if (inSheet) {
      // เดิมบอกแค่ "เคยสมัครแล้ว" แล้วจบ — ลูกค้าที่จำรหัสไม่ได้ติดตายตรงนี้
      const go2 = confirm(
        `มีบัญชีนี้อยู่แล้วในระบบ (${esc(inSheet.name || email || phone)})\n\n` +
        `กด OK = ไปหน้า "ลืมรหัสผ่าน" เพื่อรับลิงก์ตั้งรหัสใหม่ทางอีเมล\n` +
        `กด Cancel = ไปหน้าเข้าสู่ระบบ`
      );
      go(go2 ? '/forgot' : '/login');
      return;
    }
    if (inLocal) {
      // มีในเครื่องแต่ไม่มีใน Sheet = ครั้งก่อนส่งขึ้นไม่สำเร็จ → สมัครทับได้ ไม่ต้องบล็อก
      console.warn("[register] พบข้อมูลค้างในเครื่องที่ยังไม่ขึ้น Sheet — สมัครทับ");
      S.registeredUsers = S.registeredUsers.filter(u => u !== inLocal);
    }

    const fullAddress = `${addr} ต.${g('reg-subdist').trim()||''} อ.${g('reg-dist').trim()||''} จ.${prov} ${zip}`.replace(/\s+/g, ' ').trim();
    const defaultAddress = {
      id: 'ADDR-' + Date.now(),
      label: 'บ้าน',
      name: `${firstName} ${lastName}`, phone,
      addr, subdist: g('reg-subdist').trim(), dist: g('reg-dist').trim(), prov, zip,
      fullAddress,
      isDefault: true,
    };

    const userData = {
      name: `${firstName} ${lastName}`,
      firstName, lastName, phone, email,
      password: btoa(password),   // สำรองไว้ใช้ตอนออฟไลน์เท่านั้น — ตัวจริงคือแฮชบน Sheet
      address: fullAddress,
      addr, subdist: g('reg-subdist').trim(), dist: g('reg-dist').trim(), prov, zip,
      addresses: [defaultAddress],
      isCorporate: S.regIsCorporate,
      registeredAt: new Date().toISOString(),
    };

    if (S.regIsCorporate) {
      const company = g('reg-company').trim();
      const taxid = g('reg-taxid').trim().replace(/[-\s]/g, '');
      const caddr = g('reg-caddr').trim();
      if (!company) { toast("กรุณากรอกชื่อบริษัท"); return; }
      if (!taxid || taxid.length !== 13) { toast("เลขประจำตัวผู้เสียภาษีต้อง 13 หลัก"); return; }
      if (!caddr) { toast("กรุณากรอกที่อยู่บริษัท"); return; }
      userData.company = company;
      userData.taxId = taxid;
      userData.branch = g('reg-branch').trim() || 'สำนักงานใหญ่';
      userData.companyPhone = g('reg-cphone').trim();
      userData.companyEmail = g('reg-cemail').trim();
      userData.companyAddress = caddr;
    }

    // ============================================================
    // ส่งขึ้น Sheet ก่อน แล้วค่อยบอกว่าสมัครสำเร็จ
    //
    // บั๊กเดิม 2 ชั้น:
    //  1) ติดเงื่อนไข S.autoSync — ถ้าปิดไว้ จะไม่ส่งขึ้น Sheet เลยแม้แต่ครั้งเดียว
    //  2) เป็น fire-and-forget แล้ว go('/') ทันที — request ถูกตัดกลางคัน
    //     แถมถ้าพลาดก็บอกแค่ admin ลูกค้าเห็น "สมัครสำเร็จ" ทั้งที่ไม่มีชื่อใน Sheet
    // ============================================================
    S.registeredUsers.push(userData);
    S.user = { role: 'customer', ...userData };
    saveState();

    // แฮชรหัสผ่านขึ้น Sheet — เพื่อให้ล็อกอินจากเครื่องไหนก็ได้
    const salt = newSalt();
    const passHash = await hashPassword(password, salt);

    let synced = false;
    if (S.sheetApiUrl) {
      toast("⏳ กำลังบันทึกข้อมูล...");
      synced = await pushCustomerToSheet({ ...userData, passHash, passSalt: salt });
      if (synced) {
        safeSet('iamplastic.meSynced', Date.now());
        await pullCustomersFromSheet().catch(()=>{});
      } else {
        userData.pendingSync = true;
        S.user.pendingSync = true;
        saveState();
        console.error("[register] ไม่ได้ขึ้น Sheet");
      }
    }

    regDraftClear();

    if (S.sheetApiUrl && !synced) {
      toast("⚠️ สมัครแล้วแต่ยังบันทึกขึ้นระบบกลางไม่ได้ — จะลองส่งใหม่ให้อัตโนมัติ");
    } else {
      toast(`✅ สมัครสมาชิกสำเร็จ · ยินดีต้อนรับ คุณ${firstName}!`);
    }
    go('/');
  }

  async function pushCustomerToSheet(customer) {
    try {
      // ไม่ส่ง password ขึ้น Sheet
      const { password, ...safe } = customer;   // ไม่ส่งรหัสจริง ส่งแค่แฮช

      // ============================================================
      // กันลูกค้าหายบน backend v41
      //
      // v41 อ่านตาราง customers โดยทิ้งแถวที่คอลัมน์ "name" ว่าง
      // (v43 แก้ให้ดู phone/email/LINE ด้วย) — แต่ถ้ายังไม่ได้ deploy
      // ลูกค้าที่ไม่มีชื่อจะหายไปเลย
      // เลยเติมชื่อสำรองให้ทุกแถวก่อนส่ง จะได้ไม่มีแถวไหนชื่อว่าง
      // ============================================================
      if (!String(safe.name || '').trim()) {
        const alt = [safe.firstName, safe.lastName].filter(Boolean).join(' ').trim()
          || safe.company
          || safe.phone
          || (safe.email && safe.email.indexOf('LINE:') !== 0 ? safe.email : '')
          || (safe.lineUserId ? 'ลูกค้า LINE' : '')
          || 'ลูกค้าไม่ระบุชื่อ';
        safe.name = alt;
      }

      const res = await apiCall("registerCustomer", { data: safe }, true);
      if (!(res && res.ok)) console.error("[pushCustomerToSheet] backend:", res && res.error);
      return !!(res && res.ok);
    } catch (e) {
      console.error("pushCustomerToSheet:", e);
      return false;
    }
  }

  // ลูกค้าที่สมัครตอน Sheet ยังต่อไม่ติด จะค้างอยู่แค่ในเครื่องตัวเอง
  // ให้เครื่องนั้นดันข้อมูลตัวเองขึ้น Sheet อัตโนมัติ (upsert — ยิงซ้ำไม่เกิดแถวซ้ำ)
  async function syncMyAccountToSheet() {
    if (!S.sheetApiUrl || !S.user || S.user.role !== 'customer') return;
    const me = S.registeredUsers.find(u =>
      (S.user.email && u.email === S.user.email) ||
      (S.user.phone && u.phone === S.user.phone)
    ) || S.user;
    if (!me || (!me.email && !me.phone)) return;
    // บัญชีที่สมัครแล้วส่งขึ้น Sheet ไม่สำเร็จ ต้องรีบลองใหม่ ไม่ใช่รอ 12 ชม.
    const key = 'iamplastic.meSynced';
    const last = safeGet(key, 0);
    const wait = me.pendingSync ? 60 * 1000 : 12 * 60 * 60 * 1000;
    if (Date.now() - last < wait) return;
    const ok = await pushCustomerToSheet(me);
    if (ok) {
      safeSet(key, Date.now());
      if (me.pendingSync) {
        delete me.pendingSync;
        if (S.user) delete S.user.pendingSync;
        saveState();
        toast("✓ บันทึกข้อมูลสมาชิกขึ้นระบบกลางเรียบร้อยแล้ว");
      }
      console.log("[account] ดันข้อมูลตัวเองขึ้น Sheet แล้ว");
    }
  }

  // กู้รายชื่อที่ค้างอยู่ในเครื่องนี้ขึ้น Sheet (สำหรับคนที่สมัครไว้ตอนระบบยังพัง)
  async function syncLocalUsersToSheet() {
    const users = S.registeredUsers || [];
    if (!users.length) { toast("เครื่องนี้ไม่มีรายชื่อค้างอยู่"); return; }
    const sheetList = S.sheetCustomers || [];
    const missing = users.filter(u => !sheetList.some(c =>
      (c.phone && u.phone && c.phone === u.phone) || (c.email && u.email && c.email === u.email)));
    if (!missing.length) { toast(`✓ รายชื่อในเครื่องทั้ง ${users.length} คน อยู่ใน Sheet ครบแล้ว`); return; }
    if (!confirm(`เจอ ${missing.length} รายชื่อในเครื่องนี้ที่ยังไม่มีใน Sheet\nส่งขึ้น Sheet เลยไหม?`)) return;

    let done = 0;
    for (let i = 0; i < missing.length; i++) {
      toast(`⏳ กำลังส่ง ${i+1}/${missing.length}...`);
      if (await pushCustomerToSheet(missing[i])) { delete missing[i].pendingSync; done++; }
    }
    saveState();
    await pullCustomersFromSheet().catch(()=>{});
    toast(done === missing.length
      ? `✓ ส่งขึ้น Sheet ครบ ${done} รายชื่อ`
      : `⚠️ ส่งได้ ${done}/${missing.length} — ที่เหลือลองกดอีกครั้ง`);
    render();
  }

  async function pullCustomersFromSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return false; }
    try {
      const res = await apiCall("customers");
      if (!res.ok) throw new Error(res.error);
      S.sheetCustomers = res.customers || [];
      saveSynced('sheetCustomers');
      saveState();
      toast(`↓ โหลด ${S.sheetCustomers.length} ลูกค้าจาก Sheet ✓`);
      return true;
    } catch (e) {
      const msg = String(e.message||e);
      if (msg.includes('unknown action')) {
        toast("⚠️ Apps Script ยังเป็นเวอร์ชันเก่า → ตั้งค่า → 🔬 ตรวจสอบระบบ");
      } else {
        toast("❌ โหลดลูกค้าไม่ได้: " + msg);
      }
      return false;
    }
  }

  async function pushAllCustomersToSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return; }
    const users = S.registeredUsers || [];
    if (users.length === 0) { toast("ยังไม่มีลูกค้า register"); return; }
    if (!confirm(`ส่งข้อมูลลูกค้า ${users.length} คนขึ้น Sheet (upsert)?`)) return;
    // ตัด password ออกก่อนส่ง (ไม่ควรเก็บ password ใน Sheet)
    const clean = users.map(u => { const { password, ...rest } = u; return rest; });
    try {
      const res = await apiCall("bulkUpsertCustomers", { data: clean }, true, 45000);
      if (res && res.ok) {
        toast(`✓ ส่ง ${res.count} ลูกค้าขึ้น Sheet แล้ว`);
        await pullCustomersFromSheet();
        render();
      } else {
        const err = String((res && res.error) || '');
        toast(err.includes('unauthorized')
          ? "❌ ส่งไม่สำเร็จ — Secret Token ผิด (ไปที่ ตั้งค่า)"
          : "❌ ส่งไม่สำเร็จ: " + (err || 'ไม่ทราบสาเหตุ'));
      }
    } catch (e) {
      toast("❌ ส่งไม่สำเร็จ: " + e.message);
    }
  }

  async function loginAsAdminAsync(u, p) {
    const hash = await sha256(p);

    // 1) บัญชีในระบบหลายผู้ใช้ (tab admin_users) — รองรับลูกน้อง
    if (S.sheetApiUrl) {
      try {
        const res = await apiCall("getAdminUser", { username: u }, true);
        const acc = res && res.ok && res.user;
        if (acc && acc.disabled) { toast("บัญชีนี้ถูกปิดใช้งาน — ติดต่อเจ้าของร้าน"); return; }
        if (acc && acc.passHash) {
          if (acc.passHash !== hash) { toast("username หรือ password ไม่ถูกต้อง"); return; }
          enterAdmin(acc.username, acc.role || 'staff', acc.displayName || acc.username);
          return;
        }
      } catch (e) {
        console.warn("[admin] อ่าน admin_users ไม่ได้ — ลองวิธีเดิม", e);
      }
    }

    // 2) บัญชีเจ้าของเดิม (tab admin) — ยังใช้ได้เหมือนเดิม
    let creds = null;
    if (S.sheetApiUrl) {
      try {
        const res = await apiCall("getAdmin", {}, true);
        if (res && res.ok && res.admin && res.admin.passHash) {
          creds = res.admin;
          S.adminUser = creds.user; S.adminPassHash = creds.passHash; saveState();
        }
      } catch (e) { console.warn("[admin] อ่านจาก Sheet ไม่ได้ ใช้ค่าในเครื่องแทน"); }
    }
    if (!creds && S.adminPassHash) creds = { user: S.adminUser, passHash: S.adminPassHash };

    if (creds) {
      if (u === creds.user && hash === creds.passHash) {
        enterAdmin(creds.user, 'owner', 'เจ้าของร้าน');
      } else {
        toast("username หรือ password ไม่ถูกต้อง");
      }
      return;
    }

    // 3) ยังไม่เคยตั้งรหัสเอง → ค่าเริ่มต้น
    if (u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
      enterAdmin(u, 'owner', 'เจ้าของร้าน');
      setTimeout(() => toast("⚠️ ยังใช้รหัสเริ่มต้น — ควรเปลี่ยนที่ จัดการแอดมิน"), 1800);
    } else {
      toast("username หรือ password ไม่ถูกต้อง");
    }
  }

  function setSyncing(on) {
    let el = document.getElementById('sync-bar');
    if (on) {
      if (!el) {
        el = document.createElement('div');
        el.id = 'sync-bar';
        el.style.cssText = 'position:fixed;left:0;top:0;height:3px;width:100%;z-index:3002;background:linear-gradient(90deg,transparent,#AB2739,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:syncSlide 1.1s linear infinite;pointer-events:none';
        document.body.appendChild(el);

    } else if (el) {

  async function autoLoadFromSheet() {
    if (!S.sheetApiUrl) return;

    // คลิป + ตั้งค่า + รีวิว รวมเป็น request เดียว (เดิมยิง 4 อันแล้วต่อคิวกัน)
    // คูปองไม่ดึงตอนเปิดหน้า — ดึงตอนเข้าตะกร้าเท่านั้น
    setSyncing(true);
    try {
      await pullBootstrapFromSheet();
      render();

      // สินค้า 271 รายการ — หนัก จึงข้ามได้ถ้าเพิ่ง sync มาไม่เกิน 5 นาที
      const staleness = Date.now() - (S.sheetLastSync || 0);
      if (!(staleness < 5 * 60 * 1000 && S.sheetProducts)) {
        await pullProductsFromSheet();
      }
      render();
    } finally {
      setSyncing(false);
    }
    syncMyAccountToSheet().catch(()=>{});

  function renderStatsBlock(orders) {
    const today = new Date().toISOString().slice(0,10);
    const monthKey = new Date().toISOString().slice(0,7);
    const paid = orders.filter(o => ['paid','preparing','shipping','delivered'].includes(o.status));
    const bills = allBillsFlat();
    const salesToday = paid.filter(o => (o.createdAt||'').slice(0,10)===today).reduce((s,o)=>s+(o.total||0),0)
                     + bills.filter(b => (b.createdAt||'').slice(0,10)===today && b.status==='paid').reduce((s,b)=>s+(b.total||0),0);
    const salesMonth = paid.filter(o => (o.createdAt||'').slice(0,7)===monthKey).reduce((s,o)=>s+(o.total||0),0)
                     + bills.filter(b => (b.createdAt||'').slice(0,7)===monthKey && b.status==='paid').reduce((s,b)=>s+(b.total||0),0);
    // Top products
    const qtyByPid = {};
    [...paid, ...bills.filter(b=>b.status==='paid')].forEach(o => {
      (o.items||[]).forEach(it => { qtyByPid[it.pid] = (qtyByPid[it.pid]||0) + Number(it.qty||0); });
    });
    const topProducts = Object.entries(qtyByPid).sort((a,b)=>b[1]-a[1]).slice(0,10);
    // New customers this month
    const custSource = S.sheetCustomers || S.registeredUsers || [];
    const newCustomers = custSource.filter(u => (u.registeredAt||'').slice(0,7) === monthKey).length;
    // Low stock
    const lowStock = EP.filter(p => Number(p.stock||0) > 0 && Number(p.stock||0) < 20).sort((a,b)=>Number(a.stock)-Number(b.stock)).slice(0,10);
    const outOfStock = EP.filter(p => Number(p.stock||0) === 0).length;
    return `
      <div class="section-head" style="margin-top:24px"><h2 style="font-size:16px">📈 สรุปยอดขาย</h2></div>
      <div class="admin-stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="admin-stat" style="border:2px solid #22c55e"><div class="s-label">ยอดขายวันนี้</div><div class="s-val" style="color:#22c55e">${money(salesToday)}</div></div>
        <div class="admin-stat"><div class="s-label">ยอดขายเดือนนี้</div><div class="s-val">${money(salesMonth)}</div></div>
        <div class="admin-stat"><div class="s-label">ลูกค้าใหม่ (เดือนนี้)</div><div class="s-val" style="color:var(--brand)">${newCustomers}</div></div>
        <div class="admin-stat" style="cursor:pointer" onclick="go('/admin/products')"><div class="s-label">สินค้าใกล้หมด / หมด</div><div class="s-val" style="color:${lowStock.length||outOfStock?'#f59e0b':'#22c55e'}">${lowStock.length} / ${outOfStock}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
        <div class="co-card" style="margin:0">
          <h3 style="margin:0 0 12px">🏆 Top 10 สินค้าขายดี</h3>
          ${topProducts.length===0?'<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">ยังไม่มีข้อมูล</div>':`
          <table class="admin-table"><thead><tr><th>#</th><th>สินค้า</th><th style="text-align:right">ขายได้</th></tr></thead><tbody>
            ${topProducts.map(([pid, qty], i) => {
              const p = EP.find(x=>x.id===pid) || { name: pid, icon:'📦' };
              return `<tr style="cursor:pointer" onclick="go('/product/${pid}')">
                <td style="font-weight:700;color:var(--brand)">${i+1}</td>
                <td style="font-size:12px">${p.icon||'📦'} ${(p.name||pid).slice(0,50)}</td>
                <td class="mono" style="text-align:right;font-weight:700">${qty}</td>
              </tr>`;
            }).join('')}
          </tbody></table>`}
        </div>
        <div class="co-card" style="margin:0">
          <h3 style="margin:0 0 12px">⚠️ สต็อกใกล้หมด (< 20)</h3>
          ${lowStock.length===0?'<div style="padding:16px;text-align:center;color:var(--success);font-size:13px">✅ สต็อกทุกตัวปกติ</div>':`
          <table class="admin-table"><thead><tr><th>สินค้า</th><th style="text-align:right">คงเหลือ</th></tr></thead><tbody>
            ${lowStock.map(p => `<tr style="cursor:pointer" onclick="go('/admin/edit/${p.id}')">
              <td style="font-size:12px">${p.icon||'📦'} ${(p.name||'').slice(0,50)}</td>
              <td class="mono" style="text-align:right;font-weight:700;color:${Number(p.stock)<5?'#ef4444':'#f59e0b'}">${p.stock}</td>
            </tr>`).join('')}
          </tbody></table>`}
        </div>
      </div>
    `;
  }

  async function pullOrdersFromSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return false; }
    try {
      const res = await apiCall("orders");
      if (!res.ok) throw new Error(res.error);
      S.sheetOrders = res.orders || [];
      saveSynced('sheetOrders');
      saveState();
      toast(`↓ โหลด ${S.sheetOrders.length} คำสั่งซื้อจาก Sheet ✓`);
      return true;
    } catch (e) {
      toast("❌ โหลดไม่ได้: " + e.message);
      return false;
    }
  }

  async function pullBillsFromSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return false; }
    try {
      const res = await apiCall("bills");
      if (!res.ok) throw new Error(res.error);
      S.sheetBills = { cash: res.cash || [], tax: res.tax || [] };
      saveSynced('sheetBills');
      saveState();
      toast(`↓ โหลดบิล: เงินสด ${S.sheetBills.cash.length} · ใบกำกับ ${S.sheetBills.tax.length} ✓`);
      return true;
    } catch (e) {
      toast("❌ โหลดบิลไม่ได้: " + e.message);
      return false;
    }
  }

  function allBillsFlat() {
    const b = S.sheetBills || { cash: [], tax: [] };
    return [
      ...(b.cash || []).map(x => ({ ...x, type: 'cash' })),
      ...(b.tax  || []).map(x => ({ ...x, type: 'tax'  })),
    ];
  }

  async function promptNewCoupon() {
    if (!can('coupon')) { denyStaff('แก้ไขคูปอง'); return; }
    const code = (prompt("โค้ด (พิมพ์ใหญ่ ไม่มีเว้นวรรค):","") || '').trim().toUpperCase();
    if (!code) return;
    const kind = confirm("ลดเป็น % หรือไม่? (OK=%, Cancel=฿)") ? 'percent' : 'amount';
    const value = Number(prompt(kind==='percent'?"ลดกี่ %?":"ลดกี่ ฿?","10")||0);
    const minTotal = Number(prompt("ขั้นต่ำยอดสั่ง (0=ไม่จำกัด):","0")||0);
    const maxUses = Number(prompt("ใช้ได้กี่ครั้ง (0=ไม่จำกัด):","0")||0);
    const expiresAt = prompt("วันหมดอายุ (YYYY-MM-DD, ว่าง=ไม่หมด):","");
    const data = { code, kind, value, minTotal, maxUses, used:0, active:true, expiresAt, note:'' };
    const res = await apiCall("upsertCoupon", { data }, true);
    if (res && res.ok) { toast(`✓ เพิ่มคูปอง ${code}`); pullCouponsFromSheet().then(()=>render()); }
    else toast("❌ ล้มเหลว: " + ((res&&res.error)||''));
  }
  async function toggleCoupon(code) {
    if (!can('coupon')) { denyStaff('แก้ไขคูปอง'); return; }
    const c = (S.sheetCoupons||[]).find(x=>x.code===code); if (!c) return;
    c.active = !c.active;
    await apiCall("upsertCoupon", { data: c }, true);
    pullCouponsFromSheet().then(()=>render());
  }
  async function deleteCouponAdmin(code) {
    if (!can('coupon')) { denyStaff('ลบคูปอง'); return; }
    if (!confirm(`ลบคูปอง ${code}?`)) return;
    await apiCall("deleteCoupon", { code }, true);
    pullCouponsFromSheet().then(()=>render());
  }

  // ============================================================
  // แก้ 2 บั๊กในหน้าจัดการ banner
  //
  // 1) กด Cancel ใน prompt คืนค่า null แล้วโค้ดเดิมใช้ ||'' → ข้อมูลเดิมถูกลบทิ้ง
  //    เช่นแก้แค่หัวข้อ แต่กด Cancel ที่ช่องรูป → รูปหายเลย
  //    ตอนนี้ Cancel = ไม่เปลี่ยนค่าเดิม
  //
  // 2) ลบ/แก้ด้วยเลขลำดับ (index) แต่ระหว่างนั้น sync เบื้องหลังอาจสลับลำดับ
  //    ทำให้กดลบอันนึงแต่หายอีกอัน → เปลี่ยนมาอ้างด้วย id ที่ตายตัว
  // ============================================================
  function bannerId() { return 'BN' + Date.now() + Math.floor(Math.random()*1000); }

  // ถาม แต่กด Cancel = คงค่าเดิม
  function askKeep(label, current) {
    const v = prompt(label, current == null ? '' : current);
    return v === null ? (current || '') : v;
  }

  function findBannerIdx(id) { return (S.banners||[]).findIndex(b => b.id === id); }

  async function saveBanners(msg) {
    saveState();
    saveSynced('tiktokVideos','banners');
    render();
    const ok = await savePromosToSheet();
    toast(ok ? (msg || "✓ บันทึกแล้ว") : "❌ ยังไม่ขึ้น Sheet — กด ↑ Push อีกครั้ง");
  }

  async function addBanner() {
    if (!can('promo')) { denyStaff('เพิ่ม banner'); return; }
    const title = prompt("หัวข้อ banner:","โปรใหญ่ของเดือน"); if (title === null) return;
    const subtitle = askKeep("คำอธิบายรอง:","ลดสูงสุด 50%");
    const cta = askKeep("ข้อความปุ่ม:","ช้อปเลย");
    const link = askKeep("URL เมื่อคลิก (ปล่อยว่างได้):","");
    const image = askKeep("URL รูป (ปล่อยว่าง = ใช้พื้นหลังสี):","");
    const emoji = image ? '' : askKeep("Emoji ใหญ่ (ถ้าไม่มีรูป):","📦");
    S.banners = S.banners || [];
    S.banners.push({ id: bannerId(), title, subtitle, cta, link, image, emoji,
                     color1:'#AB2739', color2:'#7A1929' });
    await saveBanners("✓ เพิ่ม banner แล้ว");
  }

  async function editBanner(i) {
    if (!can('promo')) { denyStaff('แก้ไข banner'); return; }
    const b = (S.banners||[])[i]; if (!b) return;
    if (!b.id) b.id = bannerId();
    const id = b.id;

    const title = prompt("หัวข้อ:", b.title); if (title === null) return;  // Cancel ที่ช่องแรก = ยกเลิกทั้งหมด
    const subtitle = askKeep("คำอธิบาย:", b.subtitle);
    const cta      = askKeep("ปุ่ม CTA:", b.cta);
    const link     = askKeep("URL เมื่อคลิก:", b.link);
    const image    = askKeep("URL รูป:", b.image);
    const emoji    = image ? (b.emoji||'') : askKeep("Emoji (ถ้าไม่มีรูป):", b.emoji || '📦');

    // หาใหม่ตอนจะเขียนจริง — ระหว่างที่กรอก อาจมี sync เข้ามาสลับลำดับ
    const idx = findBannerIdx(id);
    if (idx < 0) { toast("⚠️ banner นี้ถูกลบไปแล้วจากอีกเครื่อง"); render(); return; }
    Object.assign(S.banners[idx], { title, subtitle, cta, link, image, emoji });
    await saveBanners("✓ อัพเดต banner แล้ว");
  }

  async function deleteBanner(i) {
    if (!can('promo')) { denyStaff('ลบ banner'); return; }
    const b = (S.banners||[])[i]; if (!b) return;
    if (!confirm(`ลบ banner "${b.title||'ไม่มีชื่อ'}" ?`)) return;
    const id = b.id;
    const idx = id ? findBannerIdx(id) : i;
    if (idx < 0) { toast("⚠️ ถูกลบไปแล้ว"); render(); return; }
    S.banners.splice(idx, 1);
    if (_bannerIdx >= S.banners.length) _bannerIdx = 0;
    await saveBanners("✓ ลบ banner แล้ว");
  }

  // เลื่อนลำดับ banner — ตัวแรกคือตัวที่ลูกค้าเห็นก่อน
  async function moveBanner(i, dir) {
    if (!can('promo')) { denyStaff('จัดลำดับ banner'); return; }
    const list = S.banners || [];
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    await saveBanners("✓ สลับลำดับแล้ว");
  }

  let _lastTiktokError = '';
  async function fetchTiktokMeta(url) {
    _lastTiktokError = '';
    if (!S.sheetApiUrl) { _lastTiktokError = 'ยังไม่ได้เชื่อม Sheet'; return null; }
    try {
      const res = await apiCall("oembedTiktok", { videoUrl: url }, false, 25000);
      if (res && res.ok) return res;
      _lastTiktokError = (res && res.error) || 'ไม่ทราบสาเหตุ';
      console.error("[tiktok oembed]", res);
      return null;
    } catch (e) {
      _lastTiktokError = String(e.message||e);
      console.error("[tiktok oembed]", e);
      return null;
    }
  }

  async function addTiktokVideo() {
    if (!can('tiktok')) { denyStaff('เพิ่มคลิป'); return; }
    const url = prompt("Paste URL คลิป TikTok:","https://www.tiktok.com/@iamplastic.thailand/video/xxxxx");
    if (!url) return;
    toast("⏳ กำลังดึงข้อมูลจาก TikTok...");
    const meta = await fetchTiktokMeta(url);
    const title = meta?.title || prompt("ดึงไม่ได้ · กรอก caption:","")||'';
    const thumbnail = meta?.thumbnail || prompt("ดึงไม่ได้ · paste URL thumbnail:","")||'';
    const author = meta?.author || '';
    const views = prompt("ยอด view (optional · ปล่อยว่างได้):","")||'';
    // สำคัญ: เก็บ URL เต็มที่ backend แกะให้ ไม่ใช่ลิงก์สั้นที่ paste มา
    // ไม่งั้น tiktokVideoId() หา id ไม่เจอ → คลิปเล่นในเว็บไม่ได้เลย
    const finalUrl = (meta && meta.resolved && /\/video\/\d+/.test(meta.resolved)) ? meta.resolved : url;
    if (isShortTiktokLink(finalUrl)) {
      toast("⚠️ แปลงลิงก์สั้นไม่สำเร็จ — คลิปนี้จะกดแล้วเด้งไป TikTok แทน");
    }
    S.tiktokVideos = S.tiktokVideos || [];
    S.tiktokVideos.unshift({ url: finalUrl, title, thumbnail, author, views, createdAt: new Date().toISOString() });
    saveState(); saveSynced('tiktokVideos','banners');
    savePromosToSheet();
    toast(meta ? `✓ เพิ่มคลิป: ${title.slice(0,40)} · sync แล้ว` : "✓ เพิ่มคลิป · sync แล้ว");
    render();
  }

  // ซ่อมลิงก์สั้นทั้งหมดรวดเดียว — ลิงก์สั้นเล่นในเว็บไม่ได้ ต้องแปลงเป็น URL เต็มก่อน
  async function fixAllTiktokLinks() {
    if (!can('tiktok')) { denyStaff('แก้ลิงก์คลิป'); return; }
    const list = S.tiktokVideos || [];
    const broken = list.filter(v => !tiktokVideoId(v.url));
    if (!broken.length) { toast("✓ ทุกคลิปเล่นในเว็บได้อยู่แล้ว"); return; }
    let fixed = 0;
    for (let i = 0; i < broken.length; i++) {
      const v = broken[i];
      toast(`⏳ กำลังซ่อม ${i+1}/${broken.length}...`);
      const meta = await fetchTiktokMeta(v.url);
      if (meta && meta.resolved && /\/video\/\d+/.test(meta.resolved)) {
        v.url = meta.resolved;
        if (meta.thumbnail) v.thumbnail = meta.thumbnail;
        if (meta.title && !v.title) v.title = meta.title;
        fixed++;
      }
    }
    if (fixed) {
      saveState(); saveSynced('tiktokVideos','banners');
      const ok = await savePromosToSheet();
      toast(ok ? `✓ ซ่อมได้ ${fixed}/${broken.length} คลิป · บันทึกขึ้น Sheet แล้ว` : `⚠️ ซ่อมได้ ${fixed} แต่ยังไม่ขึ้น Sheet`);
    } else {
      toast(`❌ ซ่อมไม่ได้เลย (${broken.length} คลิป) — ${_lastTiktokError||'เช็คการเชื่อมต่อ Sheet'}`);
    }
    render();
  }

  async function refetchTiktok(i) {
    const v = S.tiktokVideos[i]; if (!v || !v.url) return;
    toast("⏳ ดึงใหม่จาก TikTok...");
    const meta = await fetchTiktokMeta(v.url);
    if (meta) {
      v.title = meta.title || v.title;
      v.thumbnail = meta.thumbnail || v.thumbnail;
      v.author = meta.author || v.author;
      // อัปเกรดลิงก์สั้นเป็น URL เต็ม → เล่นในเว็บได้
      if (meta.resolved && /\/video\/\d+/.test(meta.resolved)) v.url = meta.resolved;
      saveState(); saveSynced('tiktokVideos','banners'); savePromosToSheet(); toast("✓ อัพเดตแล้ว"); render();
    } else { toast("❌ ดึงไม่ได้: " + (_lastTiktokError||'')); }
  }

  async function editTiktok(i) {
    if (!can('tiktok')) { denyStaff('แก้ไขคลิป'); return; }
    const v = S.tiktokVideos[i]; if (!v) return;
    const newUrl = prompt("URL:", v.url) || v.url;
    if (newUrl !== v.url) {
      v.url = newUrl;
      toast("⏳ ดึงข้อมูลใหม่...");
      const meta = await fetchTiktokMeta(newUrl);
      if (meta) {
        v.title = meta.title; v.thumbnail = meta.thumbnail; v.author = meta.author;
        if (meta.resolved && /\/video\/\d+/.test(meta.resolved)) v.url = meta.resolved;
      }
    }
    v.title = prompt("Caption:", v.title||'') || v.title || '';
    v.thumbnail = prompt("Thumbnail URL:", v.thumbnail||'') || v.thumbnail || '';
    v.views = prompt("ยอด view:", v.views||'') || v.views || '';
    saveState(); saveSynced('tiktokVideos','banners'); savePromosToSheet(); toast("✓ อัพเดต"); render();
  }
  function deleteTiktok(i) {
    if (!can('tiktok')) { denyStaff('ลบคลิป'); return; }
    if (!confirm("ลบคลิปนี้?")) return;
    S.tiktokVideos.splice(i,1); saveState(); saveSynced('tiktokVideos','banners'); savePromosToSheet(); render();
  }

  async function pullAdminUsers() {
    if (!S.sheetApiUrl) return;
    try {
      const res = await apiCall("listAdminUsers", {}, true);
      if (res && res.ok) { S.sheetAdminUsers = res.users || []; saveSynced('sheetAdminUsers'); }
      else if (res && /unknown action/i.test(String(res.error||''))) {
        toast("⚠️ ต้อง deploy Code.gs v" + NEED_BACKEND + " ก่อนถึงจะเพิ่มบัญชีพนักงานได้");
      }
    } catch (e) { console.error("[adminUsers]", e); }
  }

  async function saveStaff(data, okMsg) {
    if (!can('admins')) { denyStaff('จัดการบัญชีพนักงาน'); return false; }
    try {
      const res = await apiCall("upsertAdminUser", { data }, true);
      if (res && res.ok) {
        await pullAdminUsers();
        toast(okMsg || "✓ บันทึกแล้ว");
        render();
        return true;
      }
      toast("❌ " + ((res && res.error) || 'บันทึกไม่สำเร็จ'));
      return false;
    } catch (e) { toast("❌ " + (e.message||e)); return false; }
  }

  async function promptNewStaff() {
    if (!can('admins')) { denyStaff('เพิ่มบัญชีพนักงาน'); return; }
    const username = (prompt("Username สำหรับลูกน้อง (ภาษาอังกฤษ/ตัวเลข ไม่มีเว้นวรรค):", "") || "").trim();
    if (!username) return;
    if (/\s/.test(username)) { toast("username ห้ามมีเว้นวรรค"); return; }
    if ((S.sheetAdminUsers||[]).some(u => u.username.toLowerCase() === username.toLowerCase())) {
      toast("มี username นี้อยู่แล้ว"); return;
    }
    const displayName = (prompt("ชื่อเรียก (ไว้ดูว่าใครเปิดบิล):", username) || username).trim();
    const pw = prompt("รหัสผ่าน (อย่างน้อย 6 ตัว):", "");
    if (pw === null) return;
    if (!pw || pw.length < 6) { toast("รหัสผ่านต้องอย่างน้อย 6 ตัว"); return; }

    const isOwnerAcc = confirm(
      "ให้บัญชีนี้เป็น 'เจ้าของร้าน' (ทำได้ทุกอย่าง) ไหม?\n\n" +
      "กด OK = เจ้าของร้าน\n" +
      "กด Cancel = ลูกน้อง (เปิดบิลได้ · ดูได้ · แก้ไขไม่ได้) ← แนะนำ"
    );

    toast("⏳ กำลังสร้างบัญชี...");
    const ok = await saveStaff({
      username, displayName, role: isOwnerAcc ? 'owner' : 'staff',
      passHash: await sha256(pw), active: true,
    }, `✓ สร้างบัญชี ${username} แล้ว`);

    if (ok) {
      setTimeout(() => alert(
        "สร้างบัญชีเรียบร้อย\n\n" +
        "Username: " + username + "\n" +
        "รหัสผ่าน: " + pw + "\n\n" +
        "บอกรหัสนี้กับลูกน้อง แล้วให้เข้าที่หน้า 'เข้าสู่ระบบ' ได้เลย\n" +
        "(ระบบเก็บแค่ค่าที่เข้ารหัสแล้ว ดูรหัสย้อนหลังไม่ได้ ถ้าลืมต้องตั้งใหม่)"
      ), 400);
    }
  }

  async function promptResetStaffPw(username) {
    if (!can('admins')) { denyStaff('ตั้งรหัสผ่านให้พนักงาน'); return; }
    const pw = prompt(`ตั้งรหัสผ่านใหม่ให้ "${username}" (อย่างน้อย 6 ตัว):`, "");
    if (pw === null) return;
    if (!pw || pw.length < 6) { toast("รหัสผ่านต้องอย่างน้อย 6 ตัว"); return; }
    const ok = await saveStaff({ username, passHash: await sha256(pw) }, `✓ ตั้งรหัสใหม่ให้ ${username} แล้ว`);
    if (ok) setTimeout(() => alert(`รหัสใหม่ของ ${username}:\n\n${pw}\n\nบอกเจ้าตัวได้เลย`), 400);
  }

  async function toggleStaffActive(username) {
    if (!can('admins')) { denyStaff('เปิด/ปิดบัญชีพนักงาน'); return; }
    const u = (S.sheetAdminUsers||[]).find(x => x.username === username);
    if (!u) return;
    const next = !u.active;
    if (!next && !confirm(`ปิดใช้งานบัญชี "${username}"?\nเจ้าตัวจะล็อกอินไม่ได้จนกว่าจะเปิดใหม่`)) return;
    await saveStaff({ username, role: u.role, displayName: u.displayName, active: next },
      next ? `✓ เปิดใช้งาน ${username} แล้ว` : `✓ ปิดใช้งาน ${username} แล้ว`);
  }

  async function deleteStaff(username) {
    if (!can('admins')) { denyStaff('ลบบัญชีพนักงาน'); return; }
    if (!confirm(`ลบบัญชี "${username}" ถาวร?\nถ้าแค่อยากพักการใช้งาน ให้กดปุ่ม 🚫 ปิดใช้งานแทน`)) return;
    try {
      const res = await apiCall("deleteAdminUser", { username }, true);
      if (res && res.ok) { await pullAdminUsers(); toast(`✓ ลบบัญชี ${username} แล้ว`); render(); }
      else toast("❌ " + ((res && res.error) || 'ลบไม่สำเร็จ'));
    } catch (e) { toast("❌ " + (e.message||e)); }
  }

  async function saveAdminCreds() {
    if (!can('admins')) { denyStaff('เปลี่ยนรหัสแอดมิน'); return; }
    const g = id => (document.getElementById(id)||{}).value || '';
    const box = document.getElementById('adm-result');
    const show = (bg, border, color, html) =>
      box.innerHTML = `<div style="background:${bg};border:1px solid ${border};color:${color};padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.6">${html}</div>`;

    const oldPw = g('adm-old'), user = g('adm-user').trim(), np = g('adm-new'), np2 = g('adm-new2');

    // ยืนยันรหัสเดิม
    let oldOk;
    if (S.adminPassHash) oldOk = (await sha256(oldPw)) === S.adminPassHash;
    else oldOk = (oldPw === ADMIN_PASSWORD);
    if (!oldOk) { show('#fde8e8','#f5a3a3','#b02a2a','❌ รหัสผ่านเดิมไม่ถูกต้อง'); return; }

    if (!user) { show('#fde8e8','#f5a3a3','#b02a2a','❌ ต้องใส่ username'); return; }
    if (np.length < 8) { show('#fde8e8','#f5a3a3','#b02a2a','❌ รหัสใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร'); return; }
    if (np !== np2) { show('#fde8e8','#f5a3a3','#b02a2a','❌ รหัสใหม่ทั้งสองช่องไม่ตรงกัน'); return; }
    if (np === ADMIN_PASSWORD) { show('#fff3cd','#ffc107','#7a5a00','⚠️ ห้ามใช้รหัสเริ่มต้น — ตั้งรหัสอื่น'); return; }

    const hash = await sha256(np);
    S.adminUser = user; S.adminPassHash = hash; saveState();

    let sheetMsg = '';
    if (S.sheetApiUrl) {
      try {
        const res = await apiCall("setAdmin", { user, passHash: hash }, true);
        sheetMsg = (res && res.ok)
          ? '<br>✅ บันทึกขึ้น Sheet tab <b>admin</b> แล้ว — ใช้ได้ทุก browser'
          : '<br>⚠️ บันทึกในเครื่องแล้ว แต่ขึ้น Sheet ไม่สำเร็จ: ' + esc((res && res.error) || 'unknown') + '<br>(Apps Script อาจยังไม่ redeploy)';
      } catch (e) {
        sheetMsg = '<br>⚠️ บันทึกในเครื่องแล้ว แต่ต่อ Sheet ไม่ได้';
      }
    } else {
      sheetMsg = '<br>⚠️ ยังไม่เชื่อม Sheet — รหัสเก็บเฉพาะ browser นี้';
    }

    show('#e6f7ed','#8ed9ae','#0B7A3E', `✅ <b>เปลี่ยนรหัสสำเร็จ</b><br>Username: <b>${esc(user)}</b>${sheetMsg}`);
    ['adm-old','adm-new','adm-new2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    toast("🔐 เปลี่ยนรหัสแอดมินแล้ว");
  }
