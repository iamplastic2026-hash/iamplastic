          <h3>📦 น้ำหนัก + ขนาดบรรจุ (สำหรับคำนวณค่าส่ง)</h3>
          <div class="form-grid">
            <div class="form-field"><label>น้ำหนักต่อแพ็ค (kg)</label><input id="ae-weight" type="number" step="0.01" min="0" value="${p.weight||0}"></div>
            <div class="form-field"><label>ขนาด (WxLxH cm)</label><input id="ae-dims" value="${p.dimensions||''}" placeholder="เช่น 30x20x15 cm"></div>
          </div>
        </div>

        <div class="admin-form-actions">
          <button class="btn btn-ghost" onclick="go('/admin/products')">ยกเลิก</button>
          <button class="btn btn-primary btn-big" onclick="adminSave('${p.id}', ${isNew})">${isNew?'➕ เพิ่มสินค้า':'💾 บันทึกการแก้ไข'}</button>
        </div>
      </div>
    `;
  }

  async function uploadCoverFile(inp) {
    const f = inp.files && inp.files[0]; if (!f) return;
    toast("⏳ อัพรูปขึ้น Cloudinary...");
    const url = await uploadToCloudinary(f);
    if (url) {
      document.getElementById('ae-cover').value = url;
      document.getElementById('ae-cover-preview').innerHTML = `<img src="${url}" style="max-width:120px;border-radius:8px">`;
      toast("✓ อัพรูปสำเร็จ");
    }
  }

  async function adminSave(pid, isNew) {
    const g = id => document.getElementById(id);
    const idVal = isNew ? g('ae-id').value.trim() : pid;
    if (!idVal) { toast("กรุณาใส่รหัสสินค้า"); return; }
    if (isNew && EP.find(x => x.id === idVal)) { toast("รหัสสินค้าซ้ำ — ใช้รหัสอื่น"); return; }
    const name = g('ae-name').value.trim();
    if (!name) { toast("กรุณาใส่ชื่อสินค้า"); return; }
    const retail = parseFloat(g('ae-retail').value) || 0;
    const wholesale = parseFloat(g('ae-wholesale').value) || 0;
    if (retail <= 0) { toast("กรุณาใส่ราคาปลีก"); return; }
    const existing = !isNew ? EP.find(x => x.id === pid) : null;
    const data = {
      id: idVal, name, cat: g('ae-cat').value,
      retail, wholesale,
      moq: parseInt(g('ae-moq').value) || 1,
      strike: parseFloat(g('ae-strike').value) || retail,
      discount: parseInt(g('ae-discount').value) || 0,
      stock: parseInt(g('ae-stock').value) || 0,
      sold: g('ae-sold').value.trim() || '0+',
      cover: g('ae-cover').value.trim(),
      desc: g('ae-desc').value.trim(),
      sizes: g('ae-sizes').value.split(',').map(s => s.trim()).filter(Boolean),
      weight: parseFloat((g('ae-weight')||{value:0}).value) || 0,
      dimensions: (g('ae-dims')||{value:''}).value.trim(),
      images: [g('ae-cover').value.trim()].filter(Boolean),
      sizeOut: [], mall: true, rating: 4.8,
      icon: isNew ? (g('ae-icon').value.trim() || '📦') : (existing?.icon || '📦'),
      tiers: [[parseInt(g('ae-moq').value)||1, 999999, wholesale]],
    };

    // Sync to Sheet if configured
    if (S.sheetApiUrl && S.autoSync) {
      toast("⏳ กำลังบันทึกลง Sheet…");
      const ok = await pushProductToSheet(data);
      if (ok) {
        // Update sheetProducts cache
        if (!S.sheetProducts) S.sheetProducts = [];
        const idx = S.sheetProducts.findIndex(x => x.id === data.id);
        if (idx >= 0) S.sheetProducts[idx] = data;
        else S.sheetProducts.push(data);
      }
    }

    if (isNew) {
      S.newProducts.push(data);
    } else {
      S.productOverrides[pid] = data;
    }
    saveState();
    toast((isNew ? "เพิ่มสินค้าใหม่แล้ว ✓" : "บันทึกการแก้ไขแล้ว ✓") + (S.sheetApiUrl && S.autoSync ? ' (Sheet synced)' : ''));
    go('/admin/products');
  }

  // รวม orders จาก Sheet + localStorage (dedupe by PO), กรองตาม user
  function getMyOrders() {
    const local = S.orders || [];
    const sheet = S.sheetOrders || [];
    // Merge — sheet เป็นแหล่งหลัก, localStorage เติมถ้าไม่มีใน sheet
    const byPo = new Map();
    sheet.forEach(o => byPo.set(o.po, o));
    local.forEach(o => { if (!byPo.has(o.po)) byPo.set(o.po, o); });
    let all = Array.from(byPo.values());
    // เรียงจากใหม่สุดก่อน
    all.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    // กรอง: admin เห็นทั้งหมด, customer เห็นแค่ของตัวเอง
    if (isAdmin()) return all;
    if (!S.user) return local; // guest: เห็นแค่ local
    const phone = S.user.phone || '';
    const email = S.user.email || '';
    const name = S.user.name || '';
    return all.filter(o => {
      const c = o.customer || {};
      return (phone && c.phone === phone) ||
             (email && c.email === email) ||
             (name && c.name === name);
    });
  }

  function viewOrders() {
    // Pull latest from Sheet in background (silent)
    if (S.sheetApiUrl && (Date.now() - (S.sheetLastSync||0)) > 30000) {
      pullOrdersFromSheet().then(() => render()).catch(()=>{});
    }
    const myOrders = getMyOrders();
    if (myOrders.length === 0) {
      return `
        <div class="section-head"><h2>คำสั่งซื้อของฉัน</h2></div>
        <div class="cart-empty">
          <div class="icon">📋</div>
          <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px">ยังไม่มีคำสั่งซื้อ</div>
          <div style="font-size:13px;margin-bottom:16px">${!S.user ? 'เข้าสู่ระบบ เพื่อดูคำสั่งซื้อของคุณ · หรือ' : 'ลองสั่งซื้อสินค้าแรกเลย!'}</div>
          <button class="btn btn-primary" onclick="go('/')">← ไปเลือกสินค้า</button>
          ${!S.user ? '<button class="btn btn-outline" style="margin-left:8px" onclick="go(\'/login\')">🔑 เข้าสู่ระบบ</button>' : ''}
        </div>`;
    }
    return `
      <div class="section-head">
        <h2>คำสั่งซื้อของฉัน <span style="color:var(--text-muted);font-size:14px;font-weight:400">(${myOrders.length} รายการ)</span></h2>
        ${S.sheetApiUrl ? '<button class="btn btn-ghost" onclick="pullOrdersFromSheet().then(()=>render())">🔄 Refresh</button>' : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${myOrders.map(o => {
          const st = STATUS_LABEL[o.status] || { color:'#666', icon:'❓', th:o.status };
          const firstItem = EP.find(x => x.id === (o.items[0]||{}).pid) || { icon: '📦' };
          return `<div class="co-card" style="margin:0;cursor:pointer" onclick="go('/order/${o.po}')">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
              <div style="display:flex;gap:14px;align-items:center;flex:1;min-width:200px">
                <div style="width:52px;height:52px;background:var(--surface-warm);border-radius:8px;display:grid;place-items:center;font-size:28px;flex-shrink:0;overflow:hidden">${firstItem.cover?`<img src="${firstItem.cover}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.textContent='${firstItem.icon}'">`:firstItem.icon}</div>
                <div>
                  <div class="mono" style="font-size:13px;font-weight:700;color:var(--brand)">${o.po}</div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${new Date(o.createdAt).toLocaleString('th-TH')}</div>
                  <div style="font-size:12px;margin-top:4px">${o.items.length} รายการ · <b>${money(o.total)}</b></div>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
                <span style="background:${st.color};color:#fff;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap">${st.icon} ${st.th}</span>
                ${o.tracking ? `<div class="mono" style="font-size:10px;color:var(--text-muted)">📦 ${o.tracking}</div>` : ''}
              </div>
            </div>
          </div>`;
        }).join("")}
      </div>
      <div style="margin-top:20px;padding:12px;background:var(--surface-warm);border-radius:8px;font-size:11px;color:var(--text-muted);text-align:center">
        💡 สถานะจะอัพเดตอัตโนมัติจากทางร้าน · <a onclick="pullOrdersFromSheet().then(()=>render())" style="color:var(--brand);cursor:pointer;font-weight:700">🔄 Refresh</a>
      </div>
    `;
  }

  function viewOrderDetail(po, isSuccess) {
    // ดูจากทั้ง localStorage + Sheet
    const all = [...(S.sheetOrders || []), ...S.orders];
    const o = all.find(x => x.po === po);
    if (!o) {
      return `<div class="cart-empty"><div class="icon">🔍</div><div style="font-size:16px;color:var(--text)">ไม่พบคำสั่งซื้อ ${po}</div><button class="btn btn-primary" style="margin-top:16px" onclick="go('/')">← กลับหน้าแรก</button></div>`;
    }
    const paymentLabel = ({ qr: "QR PromptPay", bank: "โอนธนาคาร", cod: "เก็บเงินปลายทาง (COD)", card: "บัตรเครดิต", cash: "💵 เงินสด", credit: "📝 เครดิต (ค้างชำระ)" }[o.payment]) || o.payment || '-';
    const st = STATUS_LABEL[o.status];
    const stIdx = statusIndex(o.status);
    const nextStatus = STATUS_FLOW[stIdx + 1];
    return `
      ${isSuccess ? `
      <div class="progress">
        <div class="progress-step done"><span class="n">✓</span><span>ตะกร้า</span></div>
        <div class="line on"></div>
        <div class="progress-step done"><span class="n">✓</span><span>ที่อยู่ + ชำระเงิน</span></div>
        <div class="line on"></div>
        <div class="progress-step on"><span class="n">3</span><span>เสร็จสิ้น</span></div>
      </div>` : `
      <div class="pd-crumb"><span onclick="go('/orders')">คำสั่งซื้อของฉัน</span> › <span class="brand">${o.po}</span></div>
      `}

      <div class="ok-hero">
        <div style="width:80px;height:80px;border-radius:999px;background:${st.color};color:#fff;display:grid;place-items:center;font-size:42px;margin:0 auto 16px;box-shadow:0 8px 20px rgba(0,0,0,.15)">${st.icon}</div>
        <h1 style="color:${st.color}">${st.th}</h1>
        <div class="sub">${st.desc || 'คำสั่งซื้อ ' + o.po}</div>
        <div class="ok-po" style="background:${st.color === 'var(--success)' ? 'var(--success-soft)' : st.color+'20'};color:${st.color}">${o.po}</div>
        ${o.tracking ? `<div style="margin-top:14px;padding:12px 16px;background:#7C3AED15;border:1px dashed #7C3AED;border-radius:8px;display:inline-block">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">🚚 หมายเลขติดตามพัสดุ (${o.carrierName})</div>
          <div class="mono" style="font-size:16px;font-weight:700;color:#7C3AED">${o.tracking}</div>
        </div>` : ''}
        ${o.slip ? `<div style="margin-top:14px;padding:12px 16px;background:${o.slipStatus==='verified'?'var(--success-soft)':'#F9F5E5'};border:1px dashed ${o.slipStatus==='verified'?'var(--success)':'var(--gold)'};border-radius:8px;display:inline-block;text-align:left;max-width:300px">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">📸 สลิปที่แจ้งโอน ${o.slipStatus==='verified'?'· ✓ ยืนยันแล้ว':'· ⏳ รอตรวจสอบ'}</div>
          ${o.slip.image?`<img src="${o.slip.image}" style="max-width:100%;max-height:160px;border-radius:4px;cursor:pointer" onclick="window.open('${o.slip.image}','_blank')">`:''}
          <div style="font-size:11px;margin-top:6px">${o.slip.date} ${o.slip.time} · ${o.slip.bank||''} · ${money(o.slip.amount)}</div>
        </div>` : ''}
        ${isAdmin() && nextStatus && o.status !== 'cancelled' ? `
          <div style="margin-top:16px;padding-top:16px;border-top:1px dashed var(--border)">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">🔧 <b>Admin:</b> เปลี่ยนสถานะ</div>
            <button class="btn btn-primary" onclick="advanceOrder('${o.po}')">▶ อัพเดต: ${STATUS_LABEL[nextStatus].th}</button>
            ${o.status !== 'delivered' && o.status !== 'shipping' ? `<button class="btn btn-ghost" style="margin-left:8px" onclick="cancelOrder('${o.po}')">ยกเลิกคำสั่งซื้อ</button>` : ''}
            <button class="btn btn-outline" style="margin-left:8px" onclick="go('/admin/order/${o.po}')">🔧 จัดการแบบเต็ม</button>
          </div>
        ` : ''}
      </div>

      <div class="ok-cols">
        ${o.status === 'pending_payment' && (o.payment === 'qr' || o.payment === 'bank') ? `
        <div class="qr-card">
          <h3>${o.payment === 'qr' ? '📱 สแกน QR เพื่อจ่าย' : '🏦 โอนเงินเข้าบัญชี'}</h3>
          <div class="sub">ยอดที่ต้องชำระ · ${S.shopName||'THE FOOD BOX ASIA'}</div>
          <div class="qr-amount" style="margin:8px 0 4px">${money(o.total)}</div>
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 12px;margin-bottom:12px" onclick="copyText('${o.total}','ยอด')">📋 คัดลอกยอด</button>

          ${renderPaymentQr(o.total)}
          ${renderBankAccounts()}

          <button class="btn btn-primary btn-block btn-big" style="margin-top:16px" onclick="go('/upload-slip/${o.po}')">📸 แจ้งโอนแล้ว (แนบสลิป) →</button>
        </div>
        ` : o.status === 'pending_payment' ? `
        <div class="qr-card" style="border-style:solid;border-color:var(--border)">
          <h3 style="color:var(--text)">💳 ${paymentLabel}</h3>
          <div class="sub" style="margin-bottom:0">${o.payment === 'cod' ? 'จ่ายเงินสด ' + money(o.total) + ' ตอนรับสินค้า' : 'ระบบจะพาไปยังหน้าชำระเงินของธนาคาร'}</div>
          <div class="qr-amount" style="color:var(--brand)">${money(o.total)}</div>
        </div>
        ` : `
        <div class="qr-card" style="border-style:solid;border-color:var(--border);background:var(--success-soft)">
          <h3 style="color:var(--success);font-size:22px">✓ ${o.status === 'delivered' ? 'ได้รับสินค้าเรียบร้อย!' : 'ชำระเงินเรียบร้อย'}</h3>
          <div class="sub" style="margin-bottom:14px">${paymentLabel} · ${money(o.total)}</div>
          <div style="text-align:left;font-size:12px;color:var(--text-muted);padding:12px;background:var(--surface);border-radius:6px">
            <div style="margin-bottom:8px"><b style="color:var(--text)">📍 จัดส่งไปที่</b></div>
            <div style="line-height:1.6">${(o.customer||{}).name||'-'} · ${(o.customer||{}).phone||'-'}<br>${(o.customer||{}).address||'-'}</div>
          </div>
          ${o.status === 'delivered' ? `<div style="margin-top:12px;text-align:center">
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">รู้สึกยังไงบ้าง? รีวิวได้เลย</div>
            ${(o.items||[]).map(it => {
              const p = EP.find(x=>x.id===it.pid); if (!p) return '';
              return `<button class="btn btn-outline" style="margin:2px;font-size:11px" onclick="submitReview('${it.pid}','${o.po}')">⭐ รีวิว ${(p.name||'').slice(0,20)}</button>`;
            }).join('')}
          </div>` : ''}
        </div>
        `}

        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="timeline">
            <h3>🚦 สถานะคำสั่งซื้อ</h3>
            ${o.status === 'cancelled' ? `
              <div class="timeline-item"><span class="timeline-dot done">✓</span><div><div class="tt">ได้รับคำสั่งซื้อแล้ว</div><div class="ts">${new Date(o.createdAt).toLocaleString('th-TH')}</div></div></div>
              <div class="timeline-item"><span class="timeline-dot" style="background:#DC2626;color:#fff">✕</span><div><div class="tt" style="color:#DC2626">ยกเลิกคำสั่งซื้อ</div><div class="ts">${new Date(o.updatedAt).toLocaleString('th-TH')}</div></div></div>
            ` : STATUS_FLOW.map((s, i) => {
              const info = STATUS_LABEL[s];
              const isDone = i < stIdx;
              const isCurrent = i === stIdx;
              const isPending = i > stIdx;
              const ts = i === 0 ? new Date(o.createdAt).toLocaleString('th-TH')
                       : isCurrent ? new Date(o.updatedAt).toLocaleString('th-TH')
                       : isDone ? '' : '';
              const cls = isDone ? 'done' : isCurrent ? 'current' : 'pending';
              const dotContent = isDone ? '✓' : isCurrent ? '' : '';
              return `<div class="timeline-item ${cls}">
                <span class="timeline-dot ${isDone ? 'done' : isCurrent ? 'current' : ''}">${dotContent}</span>
                <div>
                  <div class="tt" style="${isCurrent?'color:'+info.color:''}">${info.icon} ${info.th}${s==='shipping'&&o.carrierName?' · '+o.carrierName:''}</div>
                  ${ts ? `<div class="ts">${ts}</div>` : (isPending && info.desc ? `<div class="ts">${info.desc}</div>` : '')}
                  ${s==='shipping'&&o.tracking&&(isDone||isCurrent)?`<div class="ts mono" style="color:#7C3AED;font-weight:600;margin-top:2px">📦 ${o.tracking}</div>`:''}
                </div>
              </div>`;
            }).join("")}
          </div>

          <div class="co-card" style="margin:0">
            <h3 style="margin-bottom:8px">📄 เอกสาร</h3>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px"><span>📋 ใบสั่งซื้อ</span><span style="color:var(--brand);cursor:pointer">ดาวน์โหลด PDF →</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-top:1px dashed var(--border)"><span>🧾 ใบกำกับภาษี</span><span style="color:var(--text-muted);font-size:11px">${o.taxInvoice ? 'รอชำระเงินก่อน' : 'ไม่ได้ขอ'}</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-top:1px dashed var(--border)"><span>🚚 ใบส่งสินค้า</span><span style="color:var(--text-muted);font-size:11px">รอจัดส่ง</span></div>
          </div>

          <div class="co-card" style="margin:0">
            <h3 style="margin-bottom:8px">รายการสินค้า (${o.items.length})</h3>
            ${o.items.map(item => {
              const p = EP.find(x => x.id === item.pid) || { icon: '📦', name: item.pid };
              const each = item.priceEach !== undefined ? item.priceEach : priceOf(p, item.qty);
              return `<div class="ord-line"><div class="th">${p.icon}</div><div class="nm">${p.name}<div class="sub">×${item.qty}${item.size?' · '+item.size:''}</div></div><div class="mono">${money(each * item.qty)}</div></div>`;
            }).join("")}
            <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
              <div class="summ-row"><span>ยอดรวม</span><span class="mono">${money(o.subtotal)}</span></div>
              ${o.discount>0?`<div class="summ-row"><span>ส่วนลด</span><span class="mono">−${money(o.discount)}</span></div>`:''}
              <div class="summ-row"><span>ค่าจัดส่ง</span><span class="mono">${o.shipping===0?'ฟรี':money(o.shipping)}</span></div>
              <div class="summ-total"><b>ชำระทั้งสิ้น</b><b class="tot">${money(o.total)}</b></div>
            </div>
          </div>

          <div style="display:flex;gap:10px">
            <button class="btn btn-ghost" style="flex:1" onclick="go('/')">← กลับหน้าแรก</button>
            <button class="btn btn-primary" style="flex:1" onclick="go('/orders')">📋 คำสั่งซื้อของฉัน</button>
          </div>
        </div>
      </div>
    `;
  }

  function onSearch(v) {
    S.searchQ = v;
    if (currentRoute() !== '/') go('/');
    else render();
  }
</script>
