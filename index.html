    width: 60px; text-align: center; padding: 8px 4px; border: 0;
    background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    font-weight: 700; font-family: "JetBrains Mono", monospace; color: var(--text);
  }
  .pd-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    padding: 12px 24px; border-radius: 4px; font-weight: 600; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: 0;
    justify-content: center;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-outline { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
  .btn-wholesale { background: var(--wholesale); color: #fff; }
  .btn-ghost { background: var(--surface-warm); color: var(--text); border: 1px solid var(--border); }
  .btn-big { padding: 14px 20px; font-size: 15px; }
  .btn-block { width: 100%; }
  .pd-guarantees {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; color: var(--text-muted);
  }

  /* ---- Cart page ---- */
  .cart-page { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .cart-items { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0 20px; }
  .cart-head-row {
    display: grid; grid-template-columns: 56px 1fr 100px 130px 90px 30px;
    gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
  }
  .cart-row {
    display: grid; grid-template-columns: 56px 1fr 100px 130px 90px 30px;
    gap: 12px; padding: 16px 0; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .cart-row:last-child { border-bottom: 0; }
  .cart-thumb {
    width: 56px; height: 56px; background: var(--surface-warm);
    border-radius: 6px; display: grid; place-items: center; font-size: 28px;
  }
  .cart-nm { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .cart-nm .sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 400; }
  .cart-p { font-family: "JetBrains Mono", monospace; font-size: 13px; text-align: right; }
  .cart-p.b { font-weight: 700; color: var(--brand); }
  body[data-mode="wholesale"] .cart-p.b { color: var(--wholesale); }
  .cart-del { color: var(--text-faint); text-align: center; cursor: pointer; padding: 6px; }
  .cart-del:hover { color: var(--brand); }
  .summary {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; position: sticky; top: 90px;
  }
  .summary h3 { margin: 0 0 12px; font-size: 15px; }
  .coupon-row { display: flex; gap: 8px; margin-bottom: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .coupon-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; background: var(--surface-warm); color: var(--text); }
  .coupon-active { font-size: 11px; color: var(--wholesale); background: var(--wholesale-soft); padding: 6px 10px; border-radius: 4px; margin-bottom: 12px; }
  .summ-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; color: var(--text-muted); }
  .summ-row.free { color: var(--success); font-weight: 600; }
  .summ-total {
    display: flex; justify-content: space-between; padding: 12px 0 0;
    border-top: 1px solid var(--border); margin-top: 8px; align-items: baseline;
  }
  .summ-total b { font-size: 14px; }
  .summ-total .tot { color: var(--brand); font-size: 22px; font-family: "JetBrains Mono", monospace; font-weight: 700; }
  body[data-mode="wholesale"] .summ-total .tot { color: var(--wholesale); }
  .cart-empty {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 60px 20px; text-align: center; color: var(--text-muted);
  }
  .cart-empty .icon { font-size: 64px; margin-bottom: 10px; }

  /* ---- Checkout ---- */
  .progress {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 20px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .progress-step { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .progress-step.on { color: var(--brand); font-weight: 600; }
  .progress-step .n {
    width: 26px; height: 26px; border-radius: 999px;
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
    background: var(--surface-warm); border: 1px solid var(--border); color: var(--text-muted);
  }
  .progress-step.on .n { background: var(--brand); color: #fff; border-color: var(--brand); }
  .progress-step.done .n { background: var(--success); color: #fff; border-color: var(--success); }
  .progress .line { flex: 1; height: 2px; background: var(--border); }
  .progress .line.on { background: var(--brand); }

  .checkout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  .co-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 14px; }
  .co-card h3 { margin: 0 0 14px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .co-card h3 .switch { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--wholesale); font-weight: 500; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    background: var(--surface-warm); border-radius: 4px; font-size: 13px; color: var(--text);
    font-family: inherit;
  }
  .form-field.wide { grid-column: 1 / -1; }
  .radio-list { display: flex; flex-direction: column; gap: 8px; }
  .radio-opt {
    display: grid; grid-template-columns: 20px 1fr auto; gap: 10px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    align-items: center;
  }
  .radio-opt.on { border: 2px solid var(--brand); background: var(--brand-soft); padding: 11px 13px; }
  .radio-dot {
    width: 16px; height: 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .radio-opt.on .radio-dot {
    border: 4px solid var(--brand); background: #fff;
    box-shadow: inset 0 0 0 2px var(--brand-soft);
  }
  .radio-title { font-size: 13px; font-weight: 600; }
  .radio-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .radio-p { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--text); font-weight: 600; }
  .radio-p.free { color: var(--success); }

  /* Switch */
  .switch-tog { width: 40px; height: 22px; background: var(--border); border-radius: 99px; position: relative; cursor: pointer; transition: background .15s; }
  .switch-tog::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; background: #fff; border-radius: 99px;
    transition: transform .15s, background .15s;
  }
  .switch-tog.on { background: var(--wholesale); }
  .switch-tog.on::after { transform: translateX(18px); }

  /* Order line preview */
  .ord-line { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); align-items: center; font-size: 12px; }
  .ord-line:last-of-type { border-bottom: 0; }
  .ord-line .th { width: 36px; height: 36px; background: var(--surface-warm); border-radius: 4px; display: grid; place-items: center; font-size: 18px; }
  .ord-line .nm { flex: 1; }
  .ord-line .nm .sub { font-size: 10px; color: var(--text-muted); }

  /* ---- Success page ---- */
  .ok-hero {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 24px; text-align: center; margin-bottom: 20px;
  }
  .ok-tick {
    width: 96px; height: 96px; border-radius: 999px;
    background: var(--success); color: #fff;
    display: grid; place-items: center; font-size: 52px;
    margin: 0 auto 20px; box-shadow: 0 8px 20px rgba(11,122,62,.25);
  }
  .ok-hero h1 { margin: 0 0 6px; font-size: 28px; }
  .ok-hero .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 14px; }
  .ok-po { display: inline-block; background: var(--brand-soft); color: var(--brand); font-family: "JetBrains Mono", monospace; padding: 8px 20px; border-radius: 6px; font-weight: 700; font-size: 18px; }
  .ok-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .qr-card { background: var(--surface); border: 2px dashed var(--brand); border-radius: 12px; padding: 24px; text-align: center; }
  .qr-card h3 { color: var(--brand); font-size: 15px; margin: 0 0 4px; }
  .qr-card .sub { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
  .qr-img {
    width: 180px; height: 180px; padding: 8px; background: #000; margin: 0 auto;
    border-radius: 6px;
  }
  .qr-img > div {
    width: 100%; height: 100%;
    background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 50% / 22px 22px;
  }
  .qr-amount { font-family: "JetBrains Mono", monospace; font-size: 28px; font-weight: 700; color: var(--brand); margin-top: 14px; }
  .qr-info { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .qr-timer { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .qr-timer b { color: var(--brand); }
  .timeline { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .timeline h3 { margin: 0 0 12px; font-size: 15px; }
  .timeline-item { display: flex; gap: 12px; padding: 8px 0; align-items: flex-start; }
  .timeline-dot {
    width: 18px; height: 18px; border-radius: 999px; margin-top: 2px;
    background: var(--border); flex-shrink: 0;
    display: grid; place-items: center; color: #fff; font-size: 10px;
  }
  .timeline-dot.done { background: var(--success); }
  .timeline-dot.current { background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .timeline-item .tt { font-size: 13px; font-weight: 600; }
  .timeline-item .ts { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .timeline-item.pending .tt { color: var(--text-muted); font-weight: 400; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--ground);
    padding: 12px 22px; border-radius: 999px; font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 100;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ---- Login / Auth ---- */
  .btn-login {
    background: #fff; color: var(--brand); border: 0;
    padding: 6px 14px; border-radius: 4px; font-weight: 700; font-size: 12px;
    cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.1);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-login:hover { background: var(--brand-soft); }
  .login-wrap { max-width: 440px; margin: 40px auto; padding: 0 16px; }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px 28px;
    box-shadow: var(--shadow);
  }
  .login-logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .login-tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--surface-warm); border-radius: 999px;
    padding: 4px; margin-bottom: 20px;
  }
  .login-tab {
    border: 0; background: transparent; padding: 10px;
    border-radius: 999px; font-weight: 600; font-size: 13px;
    color: var(--text-muted); cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .login-tab.on { background: var(--brand); color: #fff; box-shadow: 0 2px 6px rgba(238,77,45,.2); }

  /* User menu dropdown */
  .user-menu { position: relative; }
  .avatar.admin {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #1a1a1a; box-shadow: 0 0 0 2px rgba(255,215,0,.3);
  }
  .user-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; min-width: 240px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    display: none; z-index: 100; overflow: hidden;
  }
  .user-dropdown.open { display: block; }
  .ud-header {
    padding: 14px 16px; background: var(--surface-warm);
    border-bottom: 1px solid var(--border);
  }
  .ud-name { font-weight: 700; font-size: 14px; color: var(--text); }
  .ud-role { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .ud-item {
    display: block; padding: 10px 16px; color: var(--text);
    font-size: 13px; cursor: pointer; text-decoration: none;
    transition: background .1s;
  }
  .ud-item:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .ud-divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Admin ribbon */
  #admin-ribbon {
    background: linear-gradient(90deg, #FFD700, #FFA500);
    color: #1a1a1a; padding: 8px 0; border-bottom: 2px solid #E68A00;
    position: sticky; top: 68px; z-index: 30;
  }
  .admin-ribbon-inner {
    max-width: 1240px; margin: 0 auto; padding: 0 16px;
    display: flex; gap: 20px; align-items: center; font-size: 13px;
    overflow-x: auto; white-space: nowrap;
  }
  .admin-ribbon-inner a {
    color: #1a1a1a; cursor: pointer; font-weight: 600;
    padding: 2px 4px; border-radius: 3px;
  }
  .admin-ribbon-inner a:hover { background: rgba(0,0,0,.1); }

  /* ---- Bill / Invoice printable ---- */
  .bill-paper {
    background: #fff; color: #000;
    max-width: 210mm; margin: 20px auto;
    padding: 28mm 20mm;
    box-shadow: 0 4px 20px rgba(0,0,0,.1);
    font-family: "Noto Sans Thai", sans-serif;
    font-size: 13px;
  }
  .bill-header {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px;
    padding-bottom: 20px; border-bottom: 3px double #333;
  }
  .bill-title { font-size: 22px; font-weight: 800; margin: 0 0 4px; color: #000; }
  .bill-subtitle { font-size: 11px; color: #666; letter-spacing: .06em; }
  .bill-shop { text-align: right; }
  .bill-shop-name { font-size: 20px; font-weight: 800; color: var(--brand); }
  .bill-shop-tag { font-size: 11px; color: #666; margin-bottom: 6px; }
  .bill-shop-addr { font-size: 11px; color: #333; line-height: 1.5; }
  .bill-meta {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid #ccc;
    font-size: 12px;
  }
  .bill-parties {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    padding: 16px 0 20px; border-bottom: 1px solid #ccc;
  }
  .bill-party { font-size: 11px; line-height: 1.7; }
  .bill-party-h { font-size: 10px; font-weight: 700; color: var(--brand); letter-spacing: .1em; margin-bottom: 4px; }
  .bill-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 12px; }
  .bill-table th { background: #333; color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .04em; }
  .bill-table td { padding: 10px; border-bottom: 1px dotted #ccc; vertical-align: top; }
  .bill-table tfoot td { border-bottom: 0; padding: 4px 10px; }
  .bill-table tfoot tr.bill-grand td { border-top: 2px solid #333; padding-top: 10px; font-size: 16px; color: var(--brand); }
  .bill-footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 60px; }
  .bill-sign { text-align: center; font-size: 11px; color: #333; }
  .bill-sign-line { margin-bottom: 6px; letter-spacing: 2px; }
  .bill-note { margin-top: 30px; padding-top: 14px; border-top: 1px dashed #999; font-size: 11px; color: #666; }

  @media print {
    body { background: #fff; }
    .announce, .header, .cat-strip, .bottom-nav, #admin-ribbon, .no-print { display: none !important; }
    main { padding: 0 !important; max-width: none !important; }
    .bill-paper { box-shadow: none; margin: 0; padding: 15mm; max-width: none; }
    @page { size: A4; margin: 0; }
  }

  /* ---- Admin panel ---- */
  .admin-header {
    background: linear-gradient(135deg, var(--brand-soft), var(--surface));
    border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; margin-bottom: 16px;
  }
  .admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .admin-stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .admin-stat .s-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .admin-stat .s-val { font-size: 22px; font-weight: 700; margin-top: 4px; font-family: "JetBrains Mono", monospace; }
  .admin-toolbar {
    display: grid; grid-template-columns: 1fr 200px auto; gap: 12px;
    margin-bottom: 12px; align-items: center;
  }
  .admin-search {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .admin-select {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .admin-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; overflow-x: auto; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th, .admin-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .admin-table th { background: var(--surface-warm); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
  .admin-table tbody tr:hover { background: var(--surface-warm); }
  .admin-thumb {
    width: 44px; height: 44px; border-radius: 6px; background: var(--surface-warm);
    display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .admin-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .admin-thumb-fallback { font-size: 24px; }
  .admin-btn {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); cursor: pointer; font-size: 14px;
    margin-right: 4px; transition: all .15s;
  }
  .admin-btn:hover { background: var(--brand-soft); border-color: var(--brand); }
  .admin-btn-danger:hover { background: #FEE; border-color: #DC2626; color: #DC2626; }
  .mono.lowstock { color: var(--brand); font-weight: 700; }

  /* Admin form */
  .admin-form { display: flex; flex-direction: column; gap: 16px; }
  .admin-form-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; }
  .admin-form-section h3 { margin: 0 0 16px; font-size: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--brand-soft); }
  .admin-form textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    background: var(--surface-warm); border-radius: 4px; font-size: 13px;
    color: var(--text); font-family: inherit; resize: vertical;
  }
  .admin-form-actions {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 20px 0; border-top: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    .admin-stats { grid-template-columns: repeat(2, 1fr); }
    .admin-toolbar { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .admin-table { font-size: 11px; }
    .admin-table th, .admin-table td { padding: 8px 6px; }
  }

  /* Bottom nav (mobile) */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    display: none;
    grid-template-columns: repeat(5, 1fr);
    z-index: 30;
  }
  .bottom-nav a {
    text-align: center; font-size: 10px; color: var(--text-muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer;
  }
  .bottom-nav .icon { font-size: 20px; }
  .bottom-nav a.on { color: var(--brand); }
  .bottom-nav .badge {
    position: absolute; top: -2px; right: 24%;
    background: var(--brand); color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 99px; font-weight: 700;
  }
  .bottom-nav a { position: relative; }

  /* Responsive */
  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
    .cat-grid { grid-template-columns: repeat(4, 1fr); }
    .cat-tile:nth-child(8n) { border-right: 1px solid var(--border); }
    .cat-tile:nth-child(4n) { border-right: 0; }
    .cat-tile:nth-last-child(-n+4) { border-bottom: 0; }
    .cat-tile:nth-child(n+5):nth-child(-n+8) { border-bottom: 1px solid var(--border); }
    .hero { grid-template-columns: 1fr; }
    .hero-side { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
    .cart-page, .checkout, .ok-cols { grid-template-columns: 1fr; }
    .pd { grid-template-columns: 1fr; }

  async function apiCall(action, extra = {}, isPost = false) {
    if (!S.sheetApiUrl) throw new Error("ยังไม่ได้ตั้งค่า Sheet API URL");
    if (isPost) {
      // Apps Script POST: ต้องส่งเป็น text/plain เพื่อ bypass preflight CORS
      const r = await fetch(S.sheetApiUrl, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, token: S.sheetToken, ...extra }),
      });
      return await r.json();
    } else {
      const u = new URL(S.sheetApiUrl);
      u.searchParams.set("action", action);
      Object.entries(extra).forEach(([k, v]) => u.searchParams.set(k, v));
      const r = await fetch(u.toString(), { redirect: "follow" });
      return await r.json();
    }
  }

  async function pullProductsFromSheet() {
    try {
      const res = await apiCall("list");
      if (!res.ok) throw new Error(res.error || "API error");
      S.sheetProducts = res.products || [];
      S.sheetLastSync = Date.now();
      saveState();
      toast(`↓ โหลด ${S.sheetProducts.length} สินค้าจาก Sheet ✓`);
      return true;
    } catch (e) {
      toast("❌ โหลดจาก Sheet ไม่สำเร็จ: " + e.message);
      return false;
    }
  }

  async function pushProductToSheet(product) {
    try {
      const res = await apiCall("upsertProduct", { data: product }, true);
      if (!res.ok) throw new Error(res.error || "API error");
      return true;
    } catch (e) {
      console.error("pushProductToSheet:", e);
      return false;

  // Order status flow
  const STATUS_FLOW = ["pending_payment", "paid", "preparing", "shipping", "delivered"];
  const STATUS_LABEL = {
    pending_payment: { th: "รอชำระเงิน", color: "var(--brand)", icon: "⏳", desc: "จ่ายภายใน 30 นาที" },
    paid: { th: "ได้รับชำระแล้ว", color: "var(--success)", icon: "💰", desc: "รอจัดสินค้า" },
    preparing: { th: "กำลังจัดสินค้า", color: "#0284C7", icon: "📦", desc: "แพ็คของ 1-2 วัน" },
    shipping: { th: "จัดส่งแล้ว", color: "#7C3AED", icon: "🚚", desc: "กำลังส่งถึงคุณ" },
    delivered: { th: "รับสินค้าแล้ว", color: "var(--success)", icon: "✅", desc: "เรียบร้อยแล้ว" },
    cancelled: { th: "ยกเลิก", color: "#DC2626", icon: "❌", desc: "" },
  };
  function statusIndex(s) { return STATUS_FLOW.indexOf(s); }
  function advanceOrder(po) {
    const o = S.orders.find(x => x.po === po);
    if (!o) return;
    const i = statusIndex(o.status);
    if (i < STATUS_FLOW.length - 1) {
      o.status = STATUS_FLOW[i + 1];
      o.updatedAt = new Date().toISOString();
      if (o.status === "shipping" && !o.tracking) {
        o.tracking = "TH" + String(Math.floor(Math.random() * 99999999999)).padStart(11, "0");
        o.carrierName = { kerry: "Kerry Express", flash: "Flash Express", pickup: "รับเองที่คลัง" }[o.shippingMethod];
      }
      saveState();
      toast(`✓ อัพเดต: ${STATUS_LABEL[o.status].th}`);
      render();
    }
  }
  function cancelOrder(po) {
    const o = S.orders.find(x => x.po === po);
    if (!o) return;
    if (!confirm("ยกเลิกคำสั่งซื้อ " + po + " หรือไม่?")) return;
    o.status = "cancelled";
    o.updatedAt = new Date().toISOString();
    saveState(); toast("ยกเลิกคำสั่งซื้อแล้ว"); render();
  }

  // =======================================================
  // UTILITIES
  // =======================================================
  const $ = (id) => document.getElementById(id);
  const money = (n) => "฿" + Number(n).toLocaleString("th-TH", { minimumFractionDigits: (n%1)?2:0, maximumFractionDigits: 2 });
  const priceOf = (p, qty = 1) => {
    if (S.mode === "wholesale") {
      const tier = p.tiers.find(t => qty >= t[0] && qty <= t[1]);
      return tier ? tier[2] : p.wholesale;
    }
    return p.retail;
  };
  function cartCount() { return S.cart.reduce((s, i) => s + i.qty, 0); }
  function cartSubtotal() {
    return S.cart.reduce((s, i) => {
      const p = EP.find(x => x.id === i.pid);
      return s + priceOf(p, i.qty) * i.qty;
    }, 0);
  }
  function couponDiscount() {
    return S.coupon === "NEW100" ? 100 : 0;
  }
  function cartTotal() {
    return Math.max(0, cartSubtotal() - couponDiscount());
  }
  function shippingFee() {
    if (cartSubtotal() >= 1500) return 0;
    return S.coShipping === "flash" ? 55 : (S.coShipping === "pickup" ? 0 : 0);
  }
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1900);
  }

  // =======================================================
  // CART OPS
  // =======================================================
  function addToCart(pid, qty = 1, size = null) {
    const existing = S.cart.find(i => i.pid === pid && i.size === size);
    if (existing) existing.qty += qty;
    else S.cart.push({ pid, qty, size });
    saveState(); updateCartBadge();
  }
  function updateCartQty(idx, delta) {
    const item = S.cart[idx];
    item.qty = Math.max(1, item.qty + delta);
    saveState();
  }
  function removeCart(idx) { S.cart.splice(idx, 1); saveState(); }
  function clearCart() { S.cart = []; S.coupon = ""; saveState(); }
  function updateCartBadge() {
    const n = cartCount();
    const el = $("cart-count"); const badge = $("cart-badge");
    if (n > 0) {
      el.textContent = n; el.style.display = "inline-block";
      badge.textContent = n; badge.style.display = "inline-block";
    } else {
      el.style.display = "none"; badge.style.display = "none";
    }
  }

  function go(path) {
    // Reset pagination when navigating
    S.homeLimit = 40; S.catLimit = 40;
    location.hash = "#" + path;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.addEventListener("load", () => {
    document.body.dataset.mode = S.mode;
    updateCartBadge();
    renderCatStrip();
    render();
    // Auto-load latest data from Sheet in background (if configured)
    autoLoadFromSheet();
  });

  function currentRoute() {
    const h = location.hash.slice(1) || "/";
    return h;
  }

  let EP = []; // effective products cache — refreshed each render
  function render() {
    EP = getEffectiveProducts();
    const r = currentRoute();
    let content = "";
    if (r === "/" || r.startsWith("/?")) content = viewHome();
    else if (r.startsWith("/cat/")) content = viewCategory(r.split("/")[2]);
    else if (r.startsWith("/product/")) content = viewProduct(r.split("/")[2]);
    else if (r === "/cart") content = viewCart();
    else if (r === "/checkout") content = viewCheckout();
    else if (r.startsWith("/success/")) content = viewOrderDetail(r.split("/")[2], true);
    else if (r === "/orders") content = viewOrders();
    else if (r.startsWith("/order/")) content = viewOrderDetail(r.split("/")[2], false);
    else if (r === "/login") content = viewLogin();
    else if (r === "/register") content = viewRegister();
    else if (r === "/admin") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminDashboard(); }
    else if (r === "/admin/products") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminProducts(); }
    else if (r.startsWith("/admin/edit/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminEdit(r.split("/")[3]); }
    else if (r === "/admin/new") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminEdit(null); }
    else if (r === "/admin/orders") { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminOrders(); }
    else if (r.startsWith("/admin/order/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminOrderDetail(r.split("/")[3]); }
    else if (r.startsWith("/admin/bill/")) { if (!isAdmin()) { setTimeout(()=>go('/login'),10); content=''; } else content = viewAdminBill(r.split("/")[3]); }
    else content = viewHome();
    $("app").innerHTML = content;
    updateCatStrip(r);
    updateHeaderUser();
    updateAdminRibbon();
  }

  function placeOrder() {
    const now = new Date();
    const yymm = String(now.getFullYear()+543).slice(-2) + String(now.getMonth()+1).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
    const poNo = `PO-${yymm}-${rand}`;
    const sub = cartSubtotal();
    const disc = couponDiscount();
    const ship = shippingFee();
    const tot = sub - disc + ship;
    const order = {
      po: poNo,
      status: S.coPayment === "cod" ? "paid" : "pending_payment",
      total: tot,
      subtotal: sub,
      discount: disc,
      shipping: ship,
      items: [...S.cart].map(i => ({ ...i, priceEach: priceOf(EP.find(p=>p.id===i.pid), i.qty) })),
      shippingMethod: S.coShipping,
      carrierName: null,
      tracking: null,
      payment: S.coPayment,
      taxInvoice: S.coTaxOn,
      createdAt: now.toISOString(),
      updatedAt: now.toISOString(),
      mode: S.mode,
      customer: { name: "สุรพงษ์ ร่มเย็น", phone: "082-345-6789", address: "123/45 หมู่ 5 ต.กำแพงแสน อ.กำแพงแสน จ.นครปฐม 73140" },
    };
    S.orders.unshift(order);
    saveState();
    clearCart();
    // Fire-and-forget push to Sheet (don't block UX)
    if (S.sheetApiUrl && S.autoSync) pushOrderToSheet(order);
    go('/success/' + poNo);
  }

  async function doRegister() {
    const g = id => (document.getElementById(id) || {}).value || '';
    const firstName = g('reg-firstname').trim();
    const lastName = g('reg-lastname').trim();
    const phone = g('reg-phone').trim();
    const email = g('reg-email').trim();
    const addr = g('reg-addr').trim();
    const prov = g('reg-prov').trim();
    const zip = g('reg-zip').trim();

    if (!firstName || !lastName) { toast("กรุณากรอกชื่อ-นามสกุล"); return; }
    if (!phone) { toast("กรุณากรอกเบอร์โทร"); return; }
    if (!email || !email.includes('@')) { toast("กรุณากรอกอีเมลให้ถูกต้อง"); return; }
    if (!addr || !prov || !zip) { toast("กรุณากรอกที่อยู่ให้ครบ"); return; }

    // Check duplicate
    if (S.registeredUsers.find(u => u.phone === phone || u.email === email)) {
      toast("เบอร์หรืออีเมลนี้เคยสมัครแล้ว — ลองเข้าสู่ระบบแทน");
      return;
    }

    const fullAddress = `${addr} ต.${g('reg-subdist').trim()||''} อ.${g('reg-dist').trim()||''} จ.${prov} ${zip}`.replace(/\s+/g, ' ').trim();

    const userData = {
      name: `${firstName} ${lastName}`,
      firstName, lastName, phone, email,
      address: fullAddress,
      addr, subdist: g('reg-subdist').trim(), dist: g('reg-dist').trim(), prov, zip,
      isCorporate: S.regIsCorporate,
      registeredAt: new Date().toISOString(),
    };

    if (S.regIsCorporate) {
      const company = g('reg-company').trim();
      const taxid = g('reg-taxid').trim().replace(/[-\s]/g, '');
      const caddr = g('reg-caddr').trim();
      if (!company) { toast("กรุณากรอกชื่อบริษัท"); return; }
      if (!taxid || taxid.length !== 13) { toast("เลขประจำตัวผู้เสียภาษีต้อง 13 หลัก"); return; }
      if (!caddr) { toast("กรุณากรอกที่อยู่บริษัท"); return; }
      userData.company = company;
      userData.taxId = taxid;
      userData.branch = g('reg-branch').trim() || 'สำนักงานใหญ่';
      userData.companyPhone = g('reg-cphone').trim();
      userData.companyEmail = g('reg-cemail').trim();
      userData.companyAddress = caddr;
    }

    // Save + login
    S.registeredUsers.push(userData);
    S.user = { role: 'customer', ...userData };
    saveState();

    // Push to Sheet if configured (fire-and-forget)
    if (S.sheetApiUrl && S.autoSync) pushCustomerToSheet(userData).catch(()=>{});

    toast(`✅ สมัครสมาชิกสำเร็จ · ยินดีต้อนรับ คุณ${firstName}!`);
    go('/');
  }

    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return false; }
    try {
      const res = await apiCall("orders");
      if (!res.ok) throw new Error(res.error);
      S.sheetOrders = res.orders || [];
      saveState();
      toast(`↓ โหลด ${S.sheetOrders.length} คำสั่งซื้อจาก Sheet ✓`);
      return true;

      toast("❌ โหลดไม่ได้: " + e.message);
      return false;
    }

  async function advanceOrderAdmin(po) {
    const orders = S.sheetOrders || S.orders || [];
    const o = orders.find(x => x.po === po);
    if (!o) return;
    const nextStatus = STATUS_FLOW[STATUS_FLOW.indexOf(o.status) + 1];
    if (!nextStatus) return;
    let tracking = o.tracking || '';
    if (nextStatus === 'shipping' && !tracking) {
      tracking = prompt("ใส่หมายเลขติดตามพัสดุ (ปล่อยว่างให้ระบบ gen ให้)", "TH" + String(Math.floor(Math.random()*99999999999)).padStart(11,'0')) || '';
    }
    // Update Sheet
    if (S.sheetApiUrl) await updateOrderStatusOnSheet(po, nextStatus, tracking);
    // Update local
    o.status = nextStatus;
    if (tracking) { o.tracking = tracking; o.carrierName = ({kerry:'Kerry Express',flash:'Flash Express',pickup:'รับเองที่คลัง'})[o.shippingMethod]; }
    o.updatedAt = new Date().toISOString();
    // Also update S.orders if present
    const local = S.orders.find(x => x.po === po);
    if (local) { local.status = o.status; local.tracking = o.tracking; local.updatedAt = o.updatedAt; }
    saveState();
    toast(`✓ ${STATUS_LABEL[nextStatus].th}`);
    render();
  }

    const orders = S.sheetOrders || S.orders || [];

  async function adminDelete(pid) {
    const p = EP.find(x => x.id === pid);
    if (!p) return;
    if (!confirm(`ลบ "${p.name.slice(0, 40)}..." ?`)) return;

    // Sync to Sheet if configured
    if (S.sheetApiUrl && S.autoSync) {
      const ok = await deleteProductFromSheet(pid);
      if (ok) {
        // Also remove from sheetProducts cache
        if (S.sheetProducts) S.sheetProducts = S.sheetProducts.filter(x => x.id !== pid);
      }
    }

    // Also update local state (works whether or not sync is on)
    const isNew = S.newProducts.findIndex(x => x.id === pid);
    if (isNew >= 0) {
      S.newProducts.splice(isNew, 1);
    } else {
      if (!S.deletedProducts.includes(pid)) S.deletedProducts.push(pid);
    }
    delete S.productOverrides[pid];
    saveState();
    toast(`ลบสินค้าแล้ว ✓${S.sheetApiUrl && S.autoSync ? ' (Sheet updated)' : ''}`);
    render();
  }

  async function adminSave(pid, isNew) {
    const g = id => document.getElementById(id);
    const idVal = isNew ? g('ae-id').value.trim() : pid;
    if (!idVal) { toast("กรุณาใส่รหัสสินค้า"); return; }
    if (isNew && EP.find(x => x.id === idVal)) { toast("รหัสสินค้าซ้ำ — ใช้รหัสอื่น"); return; }
    const name = g('ae-name').value.trim();
    if (!name) { toast("กรุณาใส่ชื่อสินค้า"); return; }
    const retail = parseFloat(g('ae-retail').value) || 0;
    const wholesale = parseFloat(g('ae-wholesale').value) || 0;
    if (retail <= 0) { toast("กรุณาใส่ราคาปลีก"); return; }
    const existing = !isNew ? EP.find(x => x.id === pid) : null;
    const data = {
      id: idVal, name, cat: g('ae-cat').value,
      retail, wholesale,
      moq: parseInt(g('ae-moq').value) || 1,
      strike: parseFloat(g('ae-strike').value) || retail,
      discount: parseInt(g('ae-discount').value) || 0,
      stock: parseInt(g('ae-stock').value) || 0,
      sold: g('ae-sold').value.trim() || '0+',
      cover: g('ae-cover').value.trim(),
      desc: g('ae-desc').value.trim(),
      sizes: g('ae-sizes').value.split(',').map(s => s.trim()).filter(Boolean),
      weight: parseFloat((g('ae-weight')||{value:0}).value) || 0,
      dimensions: (g('ae-dims')||{value:''}).value.trim(),
      images: [g('ae-cover').value.trim()].filter(Boolean),
      sizeOut: [], mall: true, rating: 4.8,
      icon: isNew ? (g('ae-icon').value.trim() || '📦') : (existing?.icon || '📦'),
      tiers: [[parseInt(g('ae-moq').value)||1, 999999, wholesale]],
    };

    // Sync to Sheet if configured
    if (S.sheetApiUrl && S.autoSync) {
      toast("⏳ กำลังบันทึกลง Sheet…");
      const ok = await pushProductToSheet(data);
      if (ok) {
        // Update sheetProducts cache
        if (!S.sheetProducts) S.sheetProducts = [];
        const idx = S.sheetProducts.findIndex(x => x.id === data.id);
        if (idx >= 0) S.sheetProducts[idx] = data;
        else S.sheetProducts.push(data);
      }
    }

    if (isNew) {
      S.newProducts.push(data);
    } else {
      S.productOverrides[pid] = data;
    }
    saveState();
    toast((isNew ? "เพิ่มสินค้าใหม่แล้ว ✓" : "บันทึกการแก้ไขแล้ว ✓") + (S.sheetApiUrl && S.autoSync ? ' (Sheet synced)' : ''));
    go('/admin/products');
  }

              const isPending = i > stIdx;
              const ts = i === 0 ? new Date(o.createdAt).toLocaleString('th-TH')
                       : isCurrent ? new Date(o.updatedAt).toLocaleString('th-TH')
                       : isDone ? '' : '';
              const cls = isDone ? 'done' : isCurrent ? 'current' : 'pending';
              const dotContent = isDone ? '✓' : isCurrent ? '' : '';
              return `<div class="timeline-item ${cls}">
                <span class="timeline-dot ${isDone ? 'done' : isCurrent ? 'current' : ''}">${dotContent}</span>
                <div>
                  <div class="tt" style="${isCurrent?'color:'+info.color:''}">${info.icon} ${info.th}${s==='shipping'&&o.carrierName?' · '+o.carrierName:''}</div>
                  ${ts ? `<div class="ts">${ts}</div>` : (isPending && info.desc ? `<div class="ts">${info.desc}</div>` : '')}
                  ${s==='shipping'&&o.tracking&&(isDone||isCurrent)?`<div class="ts mono" style="color:#7C3AED;font-weight:600;margin-top:2px">📦 ${o.tracking}</div>`:''}
                </div>
              </div>`;
            }).join("")}
          </div>

          <div class="co-card" style="margin:0">
            <h3 style="margin-bottom:8px">📄 เอกสาร</h3>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px"><span>📋 ใบสั่งซื้อ</span><span style="color:var(--brand);cursor:pointer">ดาวน์โหลด PDF →</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-top:1px dashed var(--border)"><span>🧾 ใบกำกับภาษี</span><span style="color:var(--text-muted);font-size:11px">${o.taxInvoice ? 'รอชำระเงินก่อน' : 'ไม่ได้ขอ'}</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-top:1px dashed var(--border)"><span>🚚 ใบส่งสินค้า</span><span style="color:var(--text-muted);font-size:11px">รอจัดส่ง</span></div>
          </div>

          <div class="co-card" style="margin:0">
            <h3 style="margin-bottom:8px">รายการสินค้า (${o.items.length})</h3>
            ${o.items.map(item => {
              const p = EP.find(x => x.id === item.pid);
              return `<div class="ord-line"><div class="th">${p.icon}</div><div class="nm">${p.name}<div class="sub">×${item.qty}${item.size?' · '+item.size:''}</div></div><div class="mono">${money(priceOf(p, item.qty)*item.qty)}</div></div>`;
            }).join("")}
            <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
              <div class="summ-row"><span>ยอดรวม</span><span class="mono">${money(o.subtotal)}</span></div>
              ${o.discount>0?`<div class="summ-row"><span>ส่วนลด</span><span class="mono">−${money(o.discount)}</span></div>`:''}
              <div class="summ-row"><span>ค่าจัดส่ง</span><span class="mono">${o.shipping===0?'ฟรี':money(o.shipping)}</span></div>
              <div class="summ-total"><b>ชำระทั้งสิ้น</b><b class="tot">${money(o.total)}</b></div>
            </div>
          </div>

          <div style="display:flex;gap:10px">
            <button class="btn btn-ghost" style="flex:1" onclick="go('/')">← กลับหน้าแรก</button>
            <button class="btn btn-primary" style="flex:1" onclick="go('/orders')">📋 คำสั่งซื้อของฉัน</button>
          </div>
        </div>
      </div>
    `;
  }

  function onSearch(v) {
    S.searchQ = v;
    if (currentRoute() !== '/') go('/');
    else render();
  }
</script>
