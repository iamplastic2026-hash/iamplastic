      toast(`✓ อัพเดต: ${STATUS_LABEL[o.status].th}`);
      render();
    }
  }
  function cancelOrder(po) {
    const o = S.orders.find(x => x.po === po);
    if (!o) return;
    if (!confirm("ยกเลิกคำสั่งซื้อ " + po + " หรือไม่?")) return;
    o.status = "cancelled";
    o.updatedAt = new Date().toISOString();
    saveState(); toast("ยกเลิกคำสั่งซื้อแล้ว"); render();
  }

  // =======================================================
  // UTILITIES
  // =======================================================
  const $ = (id) => document.getElementById(id);
  const money = (n) => "฿" + Number(n).toLocaleString("th-TH", { minimumFractionDigits: (n%1)?2:0, maximumFractionDigits: 2 });
  const priceOf = (p, qty = 1) => {
    if (S.mode === "wholesale") {
      const tier = p.tiers.find(t => qty >= t[0] && qty <= t[1]);
      return tier ? tier[2] : p.wholesale;
    }
    return p.retail;
  };
  function cartCount() { return S.cart.reduce((s, i) => s + i.qty, 0); }
  function cartSubtotal() {
    return S.cart.reduce((s, i) => {
      const p = PRODUCTS.find(x => x.id === i.pid);
      return s + priceOf(p, i.qty) * i.qty;
    }, 0);
  }
  function couponDiscount() {
    return S.coupon === "NEW100" ? 100 : 0;
  }
  function cartTotal() {
    return Math.max(0, cartSubtotal() - couponDiscount());
  }
  function shippingFee() {
    if (cartSubtotal() >= 1500) return 0;
    return S.coShipping === "flash" ? 55 : (S.coShipping === "pickup" ? 0 : 0);
  }
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1900);
  }

  // =======================================================
  // CART OPS
  // =======================================================
  function addToCart(pid, qty = 1, size = null) {
    const existing = S.cart.find(i => i.pid === pid && i.size === size);
    if (existing) existing.qty += qty;
    else S.cart.push({ pid, qty, size });
    saveState(); updateCartBadge();
  }
  function updateCartQty(idx, delta) {
    const item = S.cart[idx];
    item.qty = Math.max(1, item.qty + delta);
    saveState();
  }
  function removeCart(idx) { S.cart.splice(idx, 1); saveState(); }
  function clearCart() { S.cart = []; S.coupon = ""; saveState(); }
  function updateCartBadge() {
    const n = cartCount();
    const el = $("cart-count"); const badge = $("cart-badge");
    if (n > 0) {
      el.textContent = n; el.style.display = "inline-block";
      badge.textContent = n; badge.style.display = "inline-block";
    } else {
      el.style.display = "none"; badge.style.display = "none";
    }
  }

  // =======================================================
  function setMode(m) {
    S.mode = m; saveState();
    document.body.dataset.mode = m;
    render();

  // =======================================================
  // ROUTER
  // =======================================================
  function go(path) {
    // Reset pagination when navigating
    S.homeLimit = 40; S.catLimit = 40;
    location.hash = "#" + path;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.addEventListener("hashchange", render);
  window.addEventListener("load", () => {
    document.body.dataset.mode = S.mode;
    updateCartBadge();
    renderCatStrip();
    render();
  });

  function currentRoute() {
    const h = location.hash.slice(1) || "/";
    return h;
  }

  function render() {
    const r = currentRoute();
    let content = "";
    if (r === "/" || r.startsWith("/?")) content = viewHome();
    else if (r.startsWith("/cat/")) content = viewCategory(r.split("/")[2]);
    else if (r.startsWith("/product/")) content = viewProduct(r.split("/")[2]);
    else if (r === "/cart") content = viewCart();
    else if (r === "/checkout") content = viewCheckout();
    else if (r.startsWith("/success/")) content = viewOrderDetail(r.split("/")[2], true);
    else if (r === "/orders") content = viewOrders();
    else if (r.startsWith("/order/")) content = viewOrderDetail(r.split("/")[2], false);
    else content = viewHome();
    $("app").innerHTML = content;
    updateCatStrip(r);
  }

  // VIEWS
  // =======================================================
  function renderCatStrip() {
    $("cat-strip").innerHTML = CATS.map(c =>
      `<a data-cat="${c.id}" onclick="go(c.id==='all'?'/':'/cat/${c.id}')">${c.name}</a>`
    ).join("");
    document.querySelectorAll("#cat-strip a").forEach(a => {
      a.onclick = () => go(a.dataset.cat === "all" ? "/" : "/cat/" + a.dataset.cat);
    });
  }
  function updateCatStrip(r) {
    document.querySelectorAll("#cat-strip a").forEach(a => {
      let active = false;
      if (r === "/" && a.dataset.cat === "all") active = true;
      else if (r.startsWith("/cat/") && r.split("/")[2] === a.dataset.cat) active = true;
      a.classList.toggle("on", active);
    });
  }

  function placeOrder() {
    const now = new Date();
    const yymm = String(now.getFullYear()+543).slice(-2) + String(now.getMonth()+1).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
    const poNo = `PO-${yymm}-${rand}`;
    const sub = cartSubtotal();
    const disc = couponDiscount();
    const ship = shippingFee();
    const tot = sub - disc + ship;
    const order = {
      po: poNo,
      status: S.coPayment === "cod" ? "paid" : "pending_payment",
      total: tot,
      subtotal: sub,
      discount: disc,
      shipping: ship,
      items: [...S.cart].map(i => ({ ...i, priceEach: priceOf(PRODUCTS.find(p=>p.id===i.pid), i.qty) })),
      shippingMethod: S.coShipping,
      carrierName: null,
      tracking: null,
      payment: S.coPayment,
      taxInvoice: S.coTaxOn,
      createdAt: now.toISOString(),
      updatedAt: now.toISOString(),
      mode: S.mode,
      customer: { name: "สุรพงษ์ ร่มเย็น", phone: "082-345-6789", address: "123/45 หมู่ 5 ต.กำแพงแสน อ.กำแพงแสน จ.นครปฐม 73140" },
    };
    S.orders.unshift(order);
    saveState();
    clearCart();
    go('/success/' + poNo);
  }

          <div class="sub" style="margin-bottom:14px">${paymentLabel} · ${money(o.total)}</div>
          <div style="text-align:left;font-size:12px;color:var(--text-muted);padding:12px;background:var(--surface);border-radius:6px">
            <div style="margin-bottom:8px"><b style="color:var(--text)">📍 จัดส่งไปที่</b></div>
            <div style="line-height:1.6">${o.customer.name} · ${o.customer.phone}<br>${o.customer.address}</div>
          </div>
        </div>
        `}

        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="timeline">
            <h3>🚦 สถานะคำสั่งซื้อ</h3>
            ${o.status === 'cancelled' ? `
              <div class="timeline-item"><span class="timeline-dot done">✓</span><div><div class="tt">ได้รับคำสั่งซื้อแล้ว</div><div class="ts">${new Date(o.createdAt).toLocaleString('th-TH')}</div></div></div>
              <div class="timeline-item"><span class="timeline-dot" style="background:#DC2626;color:#fff">✕</span><div><div class="tt" style="color:#DC2626">ยกเลิกคำสั่งซื้อ</div><div class="ts">${new Date(o.updatedAt).toLocaleString('th-TH')}</div></div></div>
            ` : STATUS_FLOW.map((s, i) => {
              const info = STATUS_LABEL[s];
              const isDone = i < stIdx;
              const isCurrent = i === stIdx;
              const isPending = i > stIdx;
              const ts = i === 0 ? new Date(o.createdAt).toLocaleString('th-TH')
                       : isCurrent ? new Date(o.updatedAt).toLocaleString('th-TH')
                       : isDone ? '' : '';
              const cls = isDone ? 'done' : isCurrent ? 'current' : 'pending';
              const dotContent = isDone ? '✓' : isCurrent ? '' : '';
              return `<div class="timeline-item ${cls}">
                <span class="timeline-dot ${isDone ? 'done' : isCurrent ? 'current' : ''}">${dotContent}</span>
                <div>
                  <div class="tt" style="${isCurrent?'color:'+info.color:''}">${info.icon} ${info.th}${s==='shipping'&&o.carrierName?' · '+o.carrierName:''}</div>
                  ${ts ? `<div class="ts">${ts}</div>` : (isPending && info.desc ? `<div class="ts">${info.desc}</div>` : '')}
                  ${s==='shipping'&&o.tracking&&(isDone||isCurrent)?`<div class="ts mono" style="color:#7C3AED;font-weight:600;margin-top:2px">📦 ${o.tracking}</div>`:''}
                </div>
              </div>`;
            }).join("")}
          </div>

          <div class="co-card" style="margin:0">
            <h3 style="margin-bottom:8px">📄 เอกสาร</h3>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px"><span>📋 ใบสั่งซื้อ</span><span style="color:var(--brand);cursor:pointer">ดาวน์โหลด PDF →</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-top:1px dashed var(--border)"><span>🧾 ใบกำกับภาษี</span><span style="color:var(--text-muted);font-size:11px">${o.taxInvoice ? 'รอชำระเงินก่อน' : 'ไม่ได้ขอ'}</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-top:1px dashed var(--border)"><span>🚚 ใบส่งสินค้า</span><span style="color:var(--text-muted);font-size:11px">รอจัดส่ง</span></div>
          </div>

          <div class="co-card" style="margin:0">
            <h3 style="margin-bottom:8px">รายการสินค้า (${o.items.length})</h3>
            ${o.items.map(item => {
              const p = PRODUCTS.find(x => x.id === item.pid);
              return `<div class="ord-line"><div class="th">${p.icon}</div><div class="nm">${p.name}<div class="sub">×${item.qty}${item.size?' · '+item.size:''}</div></div><div class="mono">${money(priceOf(p, item.qty)*item.qty)}</div></div>`;
            }).join("")}
            <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
              <div class="summ-row"><span>ยอดรวม</span><span class="mono">${money(o.subtotal)}</span></div>
              ${o.discount>0?`<div class="summ-row"><span>ส่วนลด</span><span class="mono">−${money(o.discount)}</span></div>`:''}
              <div class="summ-row"><span>ค่าจัดส่ง</span><span class="mono">${o.shipping===0?'ฟรี':money(o.shipping)}</span></div>
              <div class="summ-total"><b>ชำระทั้งสิ้น</b><b class="tot">${money(o.total)}</b></div>
            </div>
          </div>

          <div style="display:flex;gap:10px">
            <button class="btn btn-ghost" style="flex:1" onclick="go('/')">← กลับหน้าแรก</button>
            <button class="btn btn-primary" style="flex:1" onclick="go('/orders')">📋 คำสั่งซื้อของฉัน</button>
          </div>
        </div>
      </div>
    `;
  }

  function onSearch(v) {
    S.searchQ = v;
    if (currentRoute() !== '/') go('/');
    else render();
  }
</script>
