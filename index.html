  async function doRegister() {
    if (_submitting) { toast("⏳ กำลังดำเนินการ กรุณารอสักครู่"); return; }
    _submitting = true;
    try { await _doRegister(); } finally { _submitting = false; }
  }

  async function _doRegister() {
    const g = id => (document.getElementById(id) || {}).value || '';
    const firstName = g('reg-firstname').trim();
    const lastName = g('reg-lastname').trim();
    const phone = g('reg-phone').trim();
    const email = g('reg-email').trim();
    const password = g('reg-pw');
    const password2 = g('reg-pw2');
    const addr = g('reg-addr').trim();
    const prov = g('reg-prov').trim();
    const zip = g('reg-zip').trim();

    if (!firstName || !lastName) { toast("กรุณากรอกชื่อ-นามสกุล"); return; }
    if (!phone) { toast("กรุณากรอกเบอร์โทร"); return; }
    if (!email || !email.includes('@')) { toast("กรุณากรอกอีเมลให้ถูกต้อง"); return; }
    if (!password || password.length < 6) { toast("รหัสผ่านต้องอย่างน้อย 6 ตัว"); return; }
    if (password !== password2) { toast("รหัสผ่านไม่ตรงกัน"); return; }
    if (!addr || !prov || !zip) { toast("กรุณากรอกที่อยู่ให้ครบ"); return; }

    // ============================================================
    // เช็คซ้ำ — ต้องดูทั้ง Sheet (ศูนย์กลาง) และในเครื่อง
    //
    // บั๊กเดิม: ดูแค่ S.registeredUsers ซึ่งเป็นข้อมูล "เฉพาะเครื่องนี้"
    // ถ้าสมัครครั้งก่อนแล้วส่งขึ้น Sheet ไม่สำเร็จ จะมีชื่อค้างอยู่ในเครื่อง
    // → สมัครใหม่ไม่ได้ตลอดกาล ทั้งที่ใน Sheet ไม่มีชื่อเลย
    // ============================================================
    const inSheet = (S.sheetCustomers || []).find(u =>
      (u.phone && u.phone === phone) || (u.email && u.email === email));
    const inLocal = S.registeredUsers.find(u => u.phone === phone || u.email === email);

    if (inSheet) {
      toast("เบอร์หรืออีเมลนี้เคยสมัครแล้ว — ลองเข้าสู่ระบบแทน");
      return;
    }
    if (inLocal) {
      // มีในเครื่องแต่ไม่มีใน Sheet = ครั้งก่อนส่งขึ้นไม่สำเร็จ → สมัครทับได้ ไม่ต้องบล็อก
      console.warn("[register] พบข้อมูลค้างในเครื่องที่ยังไม่ขึ้น Sheet — สมัครทับ");
      S.registeredUsers = S.registeredUsers.filter(u => u !== inLocal);
    }

    const fullAddress = `${addr} ต.${g('reg-subdist').trim()||''} อ.${g('reg-dist').trim()||''} จ.${prov} ${zip}`.replace(/\s+/g, ' ').trim();
    const defaultAddress = {
      id: 'ADDR-' + Date.now(),
      label: 'บ้าน',
      name: `${firstName} ${lastName}`, phone,
      addr, subdist: g('reg-subdist').trim(), dist: g('reg-dist').trim(), prov, zip,
      fullAddress,
      isDefault: true,
    };

    const userData = {
      name: `${firstName} ${lastName}`,
      firstName, lastName, phone, email,
      password: btoa(password), // Simple encoding (demo — production ควรใช้ hash จริง)
      address: fullAddress,
      addr, subdist: g('reg-subdist').trim(), dist: g('reg-dist').trim(), prov, zip,
      addresses: [defaultAddress],
      isCorporate: S.regIsCorporate,
      registeredAt: new Date().toISOString(),
    };

    if (S.regIsCorporate) {
      const company = g('reg-company').trim();
      const taxid = g('reg-taxid').trim().replace(/[-\s]/g, '');
      const caddr = g('reg-caddr').trim();
      if (!company) { toast("กรุณากรอกชื่อบริษัท"); return; }
      if (!taxid || taxid.length !== 13) { toast("เลขประจำตัวผู้เสียภาษีต้อง 13 หลัก"); return; }
      if (!caddr) { toast("กรุณากรอกที่อยู่บริษัท"); return; }
      userData.company = company;
      userData.taxId = taxid;
      userData.branch = g('reg-branch').trim() || 'สำนักงานใหญ่';
      userData.companyPhone = g('reg-cphone').trim();
      userData.companyEmail = g('reg-cemail').trim();
      userData.companyAddress = caddr;
    }

    // ============================================================
    // ส่งขึ้น Sheet ก่อน แล้วค่อยบอกว่าสมัครสำเร็จ
    //
    // บั๊กเดิม 2 ชั้น:
    //  1) ติดเงื่อนไข S.autoSync — ถ้าปิดไว้ จะไม่ส่งขึ้น Sheet เลยแม้แต่ครั้งเดียว
    //  2) เป็น fire-and-forget แล้ว go('/') ทันที — request ถูกตัดกลางคัน
    //     แถมถ้าพลาดก็บอกแค่ admin ลูกค้าเห็น "สมัครสำเร็จ" ทั้งที่ไม่มีชื่อใน Sheet
    // ============================================================
    S.registeredUsers.push(userData);
    S.user = { role: 'customer', ...userData };
    saveState();

    let synced = false;
    if (S.sheetApiUrl) {
      toast("⏳ กำลังบันทึกข้อมูล...");
      synced = await pushCustomerToSheet(userData);
      if (synced) {
        safeSet('iamplastic.meSynced', Date.now());
        await pullCustomersFromSheet().catch(()=>{});
      } else {
        userData.pendingSync = true;
        S.user.pendingSync = true;
        saveState();
        console.error("[register] ไม่ได้ขึ้น Sheet");
      }
    }

    regDraftClear();

    if (S.sheetApiUrl && !synced) {
      toast("⚠️ สมัครแล้วแต่ยังบันทึกขึ้นระบบกลางไม่ได้ — จะลองส่งใหม่ให้อัตโนมัติ");
    } else {
      toast(`✅ สมัครสมาชิกสำเร็จ · ยินดีต้อนรับ คุณ${firstName}!`);
    }
    go('/');
  }

  async function pushCustomerToSheet(customer) {
    try {
      // ไม่ส่ง password ขึ้น Sheet
      const { password, ...safe } = customer;
      const res = await apiCall("registerCustomer", { data: safe }, true);
      if (!(res && res.ok)) console.error("[pushCustomerToSheet] backend:", res && res.error);
      return !!(res && res.ok);
    } catch (e) {
      console.error("pushCustomerToSheet:", e);
      return false;
    }
  }

  // ลูกค้าที่สมัครตอน Sheet ยังต่อไม่ติด จะค้างอยู่แค่ในเครื่องตัวเอง
  // ให้เครื่องนั้นดันข้อมูลตัวเองขึ้น Sheet อัตโนมัติ (upsert — ยิงซ้ำไม่เกิดแถวซ้ำ)
  async function syncMyAccountToSheet() {
    if (!S.sheetApiUrl || !S.user || S.user.role !== 'customer') return;
    const me = S.registeredUsers.find(u =>
      (S.user.email && u.email === S.user.email) ||
      (S.user.phone && u.phone === S.user.phone)
    ) || S.user;
    if (!me || (!me.email && !me.phone)) return;
    // บัญชีที่สมัครแล้วส่งขึ้น Sheet ไม่สำเร็จ ต้องรีบลองใหม่ ไม่ใช่รอ 12 ชม.
    const key = 'iamplastic.meSynced';
    const last = safeGet(key, 0);
    const wait = me.pendingSync ? 60 * 1000 : 12 * 60 * 60 * 1000;
    if (Date.now() - last < wait) return;
    const ok = await pushCustomerToSheet(me);
    if (ok) {
      safeSet(key, Date.now());
      if (me.pendingSync) {
        delete me.pendingSync;
        if (S.user) delete S.user.pendingSync;
        saveState();
        toast("✓ บันทึกข้อมูลสมาชิกขึ้นระบบกลางเรียบร้อยแล้ว");
      }
      console.log("[account] ดันข้อมูลตัวเองขึ้น Sheet แล้ว");
    }
  }

  // กู้รายชื่อที่ค้างอยู่ในเครื่องนี้ขึ้น Sheet (สำหรับคนที่สมัครไว้ตอนระบบยังพัง)
  async function syncLocalUsersToSheet() {
    const users = S.registeredUsers || [];
    if (!users.length) { toast("เครื่องนี้ไม่มีรายชื่อค้างอยู่"); return; }
    const sheetList = S.sheetCustomers || [];
    const missing = users.filter(u => !sheetList.some(c =>
      (c.phone && u.phone && c.phone === u.phone) || (c.email && u.email && c.email === u.email)));
    if (!missing.length) { toast(`✓ รายชื่อในเครื่องทั้ง ${users.length} คน อยู่ใน Sheet ครบแล้ว`); return; }
    if (!confirm(`เจอ ${missing.length} รายชื่อในเครื่องนี้ที่ยังไม่มีใน Sheet\nส่งขึ้น Sheet เลยไหม?`)) return;

    let done = 0;
    for (let i = 0; i < missing.length; i++) {
      toast(`⏳ กำลังส่ง ${i+1}/${missing.length}...`);
      if (await pushCustomerToSheet(missing[i])) { delete missing[i].pendingSync; done++; }
    }
    saveState();
    await pullCustomersFromSheet().catch(()=>{});
    toast(done === missing.length
      ? `✓ ส่งขึ้น Sheet ครบ ${done} รายชื่อ`
      : `⚠️ ส่งได้ ${done}/${missing.length} — ที่เหลือลองกดอีกครั้ง`);
    render();
  }

  async function pullCustomersFromSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return false; }
    try {
      const res = await apiCall("customers");
      if (!res.ok) throw new Error(res.error);
      S.sheetCustomers = res.customers || [];
      saveSynced('sheetCustomers');
      saveState();
      toast(`↓ โหลด ${S.sheetCustomers.length} ลูกค้าจาก Sheet ✓`);
      return true;
    } catch (e) {
      const msg = String(e.message||e);
      if (msg.includes('unknown action')) {
        toast("⚠️ Apps Script ยังเป็นเวอร์ชันเก่า → ตั้งค่า → 🔬 ตรวจสอบระบบ");
      } else {
        toast("❌ โหลดลูกค้าไม่ได้: " + msg);
      }
      return false;
    }
  }

  async function pushAllCustomersToSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return; }
    const users = S.registeredUsers || [];
    if (users.length === 0) { toast("ยังไม่มีลูกค้า register"); return; }
    if (!confirm(`ส่งข้อมูลลูกค้า ${users.length} คนขึ้น Sheet (upsert)?`)) return;
    // ตัด password ออกก่อนส่ง (ไม่ควรเก็บ password ใน Sheet)
    const clean = users.map(u => { const { password, ...rest } = u; return rest; });
    try {
      const res = await apiCall("bulkUpsertCustomers", { data: clean }, true, 45000);
      if (res && res.ok) {
        toast(`✓ ส่ง ${res.count} ลูกค้าขึ้น Sheet แล้ว`);
        await pullCustomersFromSheet();
        render();
      } else {
        const err = String((res && res.error) || '');
        toast(err.includes('unauthorized')
          ? "❌ ส่งไม่สำเร็จ — Secret Token ผิด (ไปที่ ตั้งค่า)"
          : "❌ ส่งไม่สำเร็จ: " + (err || 'ไม่ทราบสาเหตุ'));
      }
    } catch (e) {
      toast("❌ ส่งไม่สำเร็จ: " + e.message);
    }
  }
  function loginAsAdmin() {
    const u = document.getElementById("login-user").value.trim();
    const p = document.getElementById("login-pw").value;
    loginAsAdminAsync(u, p);
  }

  async function loginAsAdminAsync(u, p) {
    // ลำดับตรวจ: Sheet (ถ้าเชื่อมได้) → localStorage → ค่าเริ่มต้น
    let creds = null;
    if (S.sheetApiUrl) {
      try {
        const res = await apiCall("getAdmin", {}, true);

  // Auto-load products from Sheet on page load
  // แถบบางๆ บนสุดตอนกำลังดึงข้อมูลจาก Sheet — จะได้รู้ว่า "กำลังโหลด" ไม่ใช่ "ค้าง"
  function setSyncing(on) {
    let el = document.getElementById('sync-bar');
    if (on) {
      if (!el) {
        el = document.createElement('div');
        el.id = 'sync-bar';
        el.style.cssText = 'position:fixed;left:0;top:0;height:3px;width:100%;z-index:3002;background:linear-gradient(90deg,transparent,#AB2739,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:syncSlide 1.1s linear infinite;pointer-events:none';
        document.body.appendChild(el);
      }
    } else if (el) {
      el.remove();
    }
  }

  async function autoLoadFromSheet() {
    if (!S.sheetApiUrl) return;

    // คลิป + ตั้งค่า + รีวิว รวมเป็น request เดียว (เดิมยิง 4 อันแล้วต่อคิวกัน)
    // คูปองไม่ดึงตอนเปิดหน้า — ดึงตอนเข้าตะกร้าเท่านั้น
    setSyncing(true);
    try {
      await pullBootstrapFromSheet();
      render();

      // สินค้า 271 รายการ — หนัก จึงข้ามได้ถ้าเพิ่ง sync มาไม่เกิน 5 นาที
      const staleness = Date.now() - (S.sheetLastSync || 0);
      if (!(staleness < 5 * 60 * 1000 && S.sheetProducts)) {
        await pullProductsFromSheet();
      }
      render();
    } finally {
      setSyncing(false);
    }
    syncMyAccountToSheet().catch(()=>{});
  }

  // เช็คเวอร์ชัน backend เงียบๆ ตอนเปิดหน้าแอดมิน — จะได้ไม่ต้องรอให้กด "ตรวจสอบระบบ" ถึงจะรู้
  async function checkBackendVersion() {
    if (!S.sheetApiUrl) return;
    try {
      const p = await apiCall('ping', {}, false, 15000);
      const v = (p && p.version) || 0;
      if (S._backendVer !== v) { S._backendVer = v; render(); }
    } catch (e) {}
  }

  function renderStatsBlock(orders) {
    const today = new Date().toISOString().slice(0,10);
    const monthKey = new Date().toISOString().slice(0,7);
    const paid = orders.filter(o => ['paid','preparing','shipping','delivered'].includes(o.status));
    const bills = allBillsFlat();
    const salesToday = paid.filter(o => (o.createdAt||'').slice(0,10)===today).reduce((s,o)=>s+(o.total||0),0)
                     + bills.filter(b => (b.createdAt||'').slice(0,10)===today && b.status==='paid').reduce((s,b)=>s+(b.total||0),0);
    const salesMonth = paid.filter(o => (o.createdAt||'').slice(0,7)===monthKey).reduce((s,o)=>s+(o.total||0),0)
                     + bills.filter(b => (b.createdAt||'').slice(0,7)===monthKey && b.status==='paid').reduce((s,b)=>s+(b.total||0),0);
    // Top products
    const qtyByPid = {};
    [...paid, ...bills.filter(b=>b.status==='paid')].forEach(o => {
      (o.items||[]).forEach(it => { qtyByPid[it.pid] = (qtyByPid[it.pid]||0) + Number(it.qty||0); });
    });
    const topProducts = Object.entries(qtyByPid).sort((a,b)=>b[1]-a[1]).slice(0,10);
    // New customers this month
    const custSource = S.sheetCustomers || S.registeredUsers || [];
    const newCustomers = custSource.filter(u => (u.registeredAt||'').slice(0,7) === monthKey).length;
    // Low stock
    const lowStock = EP.filter(p => Number(p.stock||0) > 0 && Number(p.stock||0) < 20).sort((a,b)=>Number(a.stock)-Number(b.stock)).slice(0,10);
    const outOfStock = EP.filter(p => Number(p.stock||0) === 0).length;
    return `
      <div class="section-head" style="margin-top:24px"><h2 style="font-size:16px">📈 สรุปยอดขาย</h2></div>
      <div class="admin-stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="admin-stat" style="border:2px solid #22c55e"><div class="s-label">ยอดขายวันนี้</div><div class="s-val" style="color:#22c55e">${money(salesToday)}</div></div>
        <div class="admin-stat"><div class="s-label">ยอดขายเดือนนี้</div><div class="s-val">${money(salesMonth)}</div></div>
        <div class="admin-stat"><div class="s-label">ลูกค้าใหม่ (เดือนนี้)</div><div class="s-val" style="color:var(--brand)">${newCustomers}</div></div>
        <div class="admin-stat" style="cursor:pointer" onclick="go('/admin/products')"><div class="s-label">สินค้าใกล้หมด / หมด</div><div class="s-val" style="color:${lowStock.length||outOfStock?'#f59e0b':'#22c55e'}">${lowStock.length} / ${outOfStock}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
        <div class="co-card" style="margin:0">
          <h3 style="margin:0 0 12px">🏆 Top 10 สินค้าขายดี</h3>
          ${topProducts.length===0?'<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">ยังไม่มีข้อมูล</div>':`
          <table class="admin-table"><thead><tr><th>#</th><th>สินค้า</th><th style="text-align:right">ขายได้</th></tr></thead><tbody>
            ${topProducts.map(([pid, qty], i) => {
              const p = EP.find(x=>x.id===pid) || { name: pid, icon:'📦' };
              return `<tr style="cursor:pointer" onclick="go('/product/${pid}')">
                <td style="font-weight:700;color:var(--brand)">${i+1}</td>
                <td style="font-size:12px">${p.icon||'📦'} ${(p.name||pid).slice(0,50)}</td>
                <td class="mono" style="text-align:right;font-weight:700">${qty}</td>
              </tr>`;
            }).join('')}
          </tbody></table>`}
        </div>
        <div class="co-card" style="margin:0">
          <h3 style="margin:0 0 12px">⚠️ สต็อกใกล้หมด (< 20)</h3>
          ${lowStock.length===0?'<div style="padding:16px;text-align:center;color:var(--success);font-size:13px">✅ สต็อกทุกตัวปกติ</div>':`
          <table class="admin-table"><thead><tr><th>สินค้า</th><th style="text-align:right">คงเหลือ</th></tr></thead><tbody>
            ${lowStock.map(p => `<tr style="cursor:pointer" onclick="go('/admin/edit/${p.id}')">

            </tr>`).join('')}
          </tbody></table>`}
        </div>
      </div>
    `;
  }

  async function pullOrdersFromSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return false; }
    try {
      const res = await apiCall("orders");
      if (!res.ok) throw new Error(res.error);
      S.sheetOrders = res.orders || [];
      saveSynced('sheetOrders');
      saveState();
      toast(`↓ โหลด ${S.sheetOrders.length} คำสั่งซื้อจาก Sheet ✓`);
      return true;
    } catch (e) {
      toast("❌ โหลดไม่ได้: " + e.message);
      return false;
    }
  }

  async function pullBillsFromSheet() {
    if (!S.sheetApiUrl) { toast("ยังไม่เชื่อม Sheet"); return false; }
    try {
      const res = await apiCall("bills");
      if (!res.ok) throw new Error(res.error);
      S.sheetBills = { cash: res.cash || [], tax: res.tax || [] };
      saveSynced('sheetBills');
      saveState();
      toast(`↓ โหลดบิล: เงินสด ${S.sheetBills.cash.length} · ใบกำกับ ${S.sheetBills.tax.length} ✓`);
      return true;
    } catch (e) {
      toast("❌ โหลดบิลไม่ได้: " + e.message);
      return false;
    }
  }

  function allBillsFlat() {
    const b = S.sheetBills || { cash: [], tax: [] };
    return [
      ...(b.cash || []).map(x => ({ ...x, type: 'cash' })),
      ...(b.tax  || []).map(x => ({ ...x, type: 'tax'  })),
    ];
  }

  async function promptNewCoupon() {
    const code = (prompt("โค้ด (พิมพ์ใหญ่ ไม่มีเว้นวรรค):","") || '').trim().toUpperCase();
    if (!code) return;
    const kind = confirm("ลดเป็น % หรือไม่? (OK=%, Cancel=฿)") ? 'percent' : 'amount';
    const value = Number(prompt(kind==='percent'?"ลดกี่ %?":"ลดกี่ ฿?","10")||0);
    const minTotal = Number(prompt("ขั้นต่ำยอดสั่ง (0=ไม่จำกัด):","0")||0);
    const maxUses = Number(prompt("ใช้ได้กี่ครั้ง (0=ไม่จำกัด):","0")||0);
    const expiresAt = prompt("วันหมดอายุ (YYYY-MM-DD, ว่าง=ไม่หมด):","");
    const data = { code, kind, value, minTotal, maxUses, used:0, active:true, expiresAt, note:'' };
    const res = await apiCall("upsertCoupon", { data }, true);
    if (res && res.ok) { toast(`✓ เพิ่มคูปอง ${code}`); pullCouponsFromSheet().then(()=>render()); }
    else toast("❌ ล้มเหลว: " + ((res&&res.error)||''));
  }
  async function toggleCoupon(code) {
    const c = (S.sheetCoupons||[]).find(x=>x.code===code); if (!c) return;
    c.active = !c.active;
    await apiCall("upsertCoupon", { data: c }, true);
    pullCouponsFromSheet().then(()=>render());
  }
  async function deleteCouponAdmin(code) {
    if (!confirm(`ลบคูปอง ${code}?`)) return;
    await apiCall("deleteCoupon", { code }, true);
    pullCouponsFromSheet().then(()=>render());
  }

  // ============================================================
  // แก้ 2 บั๊กในหน้าจัดการ banner
  //
  // 1) กด Cancel ใน prompt คืนค่า null แล้วโค้ดเดิมใช้ ||'' → ข้อมูลเดิมถูกลบทิ้ง
  //    เช่นแก้แค่หัวข้อ แต่กด Cancel ที่ช่องรูป → รูปหายเลย
  //    ตอนนี้ Cancel = ไม่เปลี่ยนค่าเดิม
  //
  // 2) ลบ/แก้ด้วยเลขลำดับ (index) แต่ระหว่างนั้น sync เบื้องหลังอาจสลับลำดับ
  //    ทำให้กดลบอันนึงแต่หายอีกอัน → เปลี่ยนมาอ้างด้วย id ที่ตายตัว
  // ============================================================
  function bannerId() { return 'BN' + Date.now() + Math.floor(Math.random()*1000); }

  // ถาม แต่กด Cancel = คงค่าเดิม
  function askKeep(label, current) {
    const v = prompt(label, current == null ? '' : current);
    return v === null ? (current || '') : v;
  }

  function findBannerIdx(id) { return (S.banners||[]).findIndex(b => b.id === id); }

  async function saveBanners(msg) {
    saveState();
    saveSynced('tiktokVideos','banners');
    render();
    const ok = await savePromosToSheet();
    toast(ok ? (msg || "✓ บันทึกแล้ว") : "❌ ยังไม่ขึ้น Sheet — กด ↑ Push อีกครั้ง");
  }

  async function addBanner() {
    const title = prompt("หัวข้อ banner:","โปรใหญ่ของเดือน"); if (title === null) return;
    const subtitle = askKeep("คำอธิบายรอง:","ลดสูงสุด 50%");
    const cta = askKeep("ข้อความปุ่ม:","ช้อปเลย");
    const link = askKeep("URL เมื่อคลิก (ปล่อยว่างได้):","");
    const image = askKeep("URL รูป (ปล่อยว่าง = ใช้พื้นหลังสี):","");
    const emoji = image ? '' : askKeep("Emoji ใหญ่ (ถ้าไม่มีรูป):","📦");
    S.banners = S.banners || [];
    S.banners.push({ id: bannerId(), title, subtitle, cta, link, image, emoji,
                     color1:'#AB2739', color2:'#7A1929' });
    await saveBanners("✓ เพิ่ม banner แล้ว");
  }

  async function editBanner(i) {
    const b = (S.banners||[])[i]; if (!b) return;
    if (!b.id) b.id = bannerId();
    const id = b.id;

    const title = prompt("หัวข้อ:", b.title); if (title === null) return;  // Cancel ที่ช่องแรก = ยกเลิกทั้งหมด
    const subtitle = askKeep("คำอธิบาย:", b.subtitle);
    const cta      = askKeep("ปุ่ม CTA:", b.cta);
    const link     = askKeep("URL เมื่อคลิก:", b.link);
    const image    = askKeep("URL รูป:", b.image);
    const emoji    = image ? (b.emoji||'') : askKeep("Emoji (ถ้าไม่มีรูป):", b.emoji || '📦');

    // หาใหม่ตอนจะเขียนจริง — ระหว่างที่กรอก อาจมี sync เข้ามาสลับลำดับ
    const idx = findBannerIdx(id);
    if (idx < 0) { toast("⚠️ banner นี้ถูกลบไปแล้วจากอีกเครื่อง"); render(); return; }
    Object.assign(S.banners[idx], { title, subtitle, cta, link, image, emoji });
    await saveBanners("✓ อัพเดต banner แล้ว");
  }

  async function deleteBanner(i) {
    const b = (S.banners||[])[i]; if (!b) return;
    if (!confirm(`ลบ banner "${b.title||'ไม่มีชื่อ'}" ?`)) return;
    const id = b.id;
    const idx = id ? findBannerIdx(id) : i;
    if (idx < 0) { toast("⚠️ ถูกลบไปแล้ว"); render(); return; }
    S.banners.splice(idx, 1);
    if (_bannerIdx >= S.banners.length) _bannerIdx = 0;
    await saveBanners("✓ ลบ banner แล้ว");
  }

  // เลื่อนลำดับ banner — ตัวแรกคือตัวที่ลูกค้าเห็นก่อน
  async function moveBanner(i, dir) {
    const list = S.banners || [];
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    await saveBanners("✓ สลับลำดับแล้ว");
  }

  let _lastTiktokError = '';
  async function fetchTiktokMeta(url) {
    _lastTiktokError = '';
    if (!S.sheetApiUrl) { _lastTiktokError = 'ยังไม่ได้เชื่อม Sheet'; return null; }
    try {
      const res = await apiCall("oembedTiktok", { videoUrl: url }, false, 25000);
      if (res && res.ok) return res;
      _lastTiktokError = (res && res.error) || 'ไม่ทราบสาเหตุ';
      console.error("[tiktok oembed]", res);
      return null;
    } catch (e) {
      _lastTiktokError = String(e.message||e);
      console.error("[tiktok oembed]", e);
      return null;
    }
  }

  async function addTiktokVideo() {
    const url = prompt("Paste URL คลิป TikTok:","https://www.tiktok.com/@iamplastic.thailand/video/xxxxx");
    if (!url) return;
    toast("⏳ กำลังดึงข้อมูลจาก TikTok...");
    const meta = await fetchTiktokMeta(url);
    const title = meta?.title || prompt("ดึงไม่ได้ · กรอก caption:","")||'';
    const thumbnail = meta?.thumbnail || prompt("ดึงไม่ได้ · paste URL thumbnail:","")||'';
    const author = meta?.author || '';
    const views = prompt("ยอด view (optional · ปล่อยว่างได้):","")||'';
    // สำคัญ: เก็บ URL เต็มที่ backend แกะให้ ไม่ใช่ลิงก์สั้นที่ paste มา
    // ไม่งั้น tiktokVideoId() หา id ไม่เจอ → คลิปเล่นในเว็บไม่ได้เลย
    const finalUrl = (meta && meta.resolved && /\/video\/\d+/.test(meta.resolved)) ? meta.resolved : url;
    if (isShortTiktokLink(finalUrl)) {
      toast("⚠️ แปลงลิงก์สั้นไม่สำเร็จ — คลิปนี้จะกดแล้วเด้งไป TikTok แทน");
    }
    S.tiktokVideos = S.tiktokVideos || [];
    S.tiktokVideos.unshift({ url: finalUrl, title, thumbnail, author, views, createdAt: new Date().toISOString() });
    saveState(); saveSynced('tiktokVideos','banners');
    savePromosToSheet();
    toast(meta ? `✓ เพิ่มคลิป: ${title.slice(0,40)} · sync แล้ว` : "✓ เพิ่มคลิป · sync แล้ว");
    render();
  }

  // ซ่อมลิงก์สั้นทั้งหมดรวดเดียว — ลิงก์สั้นเล่นในเว็บไม่ได้ ต้องแปลงเป็น URL เต็มก่อน
  async function fixAllTiktokLinks() {
    const list = S.tiktokVideos || [];
    const broken = list.filter(v => !tiktokVideoId(v.url));
    if (!broken.length) { toast("✓ ทุกคลิปเล่นในเว็บได้อยู่แล้ว"); return; }
    let fixed = 0;
    for (let i = 0; i < broken.length; i++) {
      const v = broken[i];
      toast(`⏳ กำลังซ่อม ${i+1}/${broken.length}...`);
      const meta = await fetchTiktokMeta(v.url);
      if (meta && meta.resolved && /\/video\/\d+/.test(meta.resolved)) {
        v.url = meta.resolved;
        if (meta.thumbnail) v.thumbnail = meta.thumbnail;
        if (meta.title && !v.title) v.title = meta.title;
        fixed++;
      }
    }
    if (fixed) {
      saveState(); saveSynced('tiktokVideos','banners');
      const ok = await savePromosToSheet();
      toast(ok ? `✓ ซ่อมได้ ${fixed}/${broken.length} คลิป · บันทึกขึ้น Sheet แล้ว` : `⚠️ ซ่อมได้ ${fixed} แต่ยังไม่ขึ้น Sheet`);
    } else {
      toast(`❌ ซ่อมไม่ได้เลย (${broken.length} คลิป) — ${_lastTiktokError||'เช็คการเชื่อมต่อ Sheet'}`);
    }
    render();
  }

  async function refetchTiktok(i) {
    const v = S.tiktokVideos[i]; if (!v || !v.url) return;
    toast("⏳ ดึงใหม่จาก TikTok...");
    const meta = await fetchTiktokMeta(v.url);
    if (meta) {
      v.title = meta.title || v.title;
      v.thumbnail = meta.thumbnail || v.thumbnail;
      v.author = meta.author || v.author;
      // อัปเกรดลิงก์สั้นเป็น URL เต็ม → เล่นในเว็บได้
      if (meta.resolved && /\/video\/\d+/.test(meta.resolved)) v.url = meta.resolved;
      saveState(); saveSynced('tiktokVideos','banners'); savePromosToSheet(); toast("✓ อัพเดตแล้ว"); render();
    } else { toast("❌ ดึงไม่ได้: " + (_lastTiktokError||'')); }
  }

  async function editTiktok(i) {
    const v = S.tiktokVideos[i]; if (!v) return;
    const newUrl = prompt("URL:", v.url) || v.url;
    if (newUrl !== v.url) {
      v.url = newUrl;
      toast("⏳ ดึงข้อมูลใหม่...");
      const meta = await fetchTiktokMeta(newUrl);
      if (meta) {
        v.title = meta.title; v.thumbnail = meta.thumbnail; v.author = meta.author;
        if (meta.resolved && /\/video\/\d+/.test(meta.resolved)) v.url = meta.resolved;
      }
    }
    v.title = prompt("Caption:", v.title||'') || v.title || '';
    v.thumbnail = prompt("Thumbnail URL:", v.thumbnail||'') || v.thumbnail || '';
    v.views = prompt("ยอด view:", v.views||'') || v.views || '';

  async function saveAdminCreds() {
    const g = id => (document.getElementById(id)||{}).value || '';
    const box = document.getElementById('adm-result');
    const show = (bg, border, color, html) =>
      box.innerHTML = `<div style="background:${bg};border:1px solid ${border};color:${color};padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.6">${html}</div>`;

    const oldPw = g('adm-old'), user = g('adm-user').trim(), np = g('adm-new'), np2 = g('adm-new2');

    // ยืนยันรหัสเดิม
    let oldOk;
    if (S.adminPassHash) oldOk = (await sha256(oldPw)) === S.adminPassHash;
    else oldOk = (oldPw === ADMIN_PASSWORD);
    if (!oldOk) { show('#fde8e8','#f5a3a3','#b02a2a','❌ รหัสผ่านเดิมไม่ถูกต้อง'); return; }

    if (!user) { show('#fde8e8','#f5a3a3','#b02a2a','❌ ต้องใส่ username'); return; }
    if (np.length < 8) { show('#fde8e8','#f5a3a3','#b02a2a','❌ รหัสใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร'); return; }
    if (np !== np2) { show('#fde8e8','#f5a3a3','#b02a2a','❌ รหัสใหม่ทั้งสองช่องไม่ตรงกัน'); return; }
    if (np === ADMIN_PASSWORD) { show('#fff3cd','#ffc107','#7a5a00','⚠️ ห้ามใช้รหัสเริ่มต้น — ตั้งรหัสอื่น'); return; }

    const hash = await sha256(np);
    S.adminUser = user; S.adminPassHash = hash; saveState();

    let sheetMsg = '';
    if (S.sheetApiUrl) {
      try {
        const res = await apiCall("setAdmin", { user, passHash: hash }, true);
        sheetMsg = (res && res.ok)
          ? '<br>✅ บันทึกขึ้น Sheet tab <b>admin</b> แล้ว — ใช้ได้ทุก browser'
          : '<br>⚠️ บันทึกในเครื่องแล้ว แต่ขึ้น Sheet ไม่สำเร็จ: ' + esc((res && res.error) || 'unknown') + '<br>(Apps Script อาจยังไม่ redeploy)';
      } catch (e) {
        sheetMsg = '<br>⚠️ บันทึกในเครื่องแล้ว แต่ต่อ Sheet ไม่ได้';
      }
    } else {
      sheetMsg = '<br>⚠️ ยังไม่เชื่อม Sheet — รหัสเก็บเฉพาะ browser นี้';
    }

    show('#e6f7ed','#8ed9ae','#0B7A3E', `✅ <b>เปลี่ยนรหัสสำเร็จ</b><br>Username: <b>${esc(user)}</b>${sheetMsg}`);
    ['adm-old','adm-new','adm-new2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    toast("🔐 เปลี่ยนรหัสแอดมินแล้ว");
  }

      writeRes = await apiCall("selfTest", {}, true, 25000);
    } catch (e) {

      </div>`);
      return;

    add(wrote, wrote ? 'เขียนลง tab <b>_selftest</b> สำเร็จ' : 'เขียนไม่สำเร็จ');
    add(null, `คำตอบดิบ: <code style="font-size:11px;word-break:break-all">${esc(JSON.stringify(writeRes))}</code>`);

    // อ่านรายชื่อลูกค้าจริง (ไม่เขียนอะไรลงไป)

    try {

    if (wrote && found) {
      verdict = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1);font-size:13px;color:#0B7A3E">
        ✅ <b>ทุกอย่างปกติ</b> — ไปลบแถว <code>[TEST ...]</code> ใน Sheet tab <b>customers</b> ทิ้งได้เลย<br>
        ถ้าลูกค้าที่สมัครก่อนหน้ายังไม่ขึ้น ให้เปิดเว็บจากเครื่องที่สมัคร แล้วกด <b>↑ Sync ขึ้น Sheet</b></div>`;
    } else if (wrote && !found) {
      verdict = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1);font-size:13px;color:#7a5a00">
        ⚠️ <b>เขียนได้ แต่อ่านกลับไม่เจอ</b> — เป็นบั๊ก rowsToObjects ที่แก้ใน Code.gs v37<br>
        เปิด Sheet ดู tab <b>customers</b> ถ้ามีแถว <code>[TEST ...]</code> = ยืนยันว่าเขียนได้จริง<br>
        <b>→ ต้อง deploy Code.gs v37</b></div>`;
    } else {
      const err = String((writeRes && writeRes.error) || '');
      let why = '';
      if (err.includes('unauthorized')) why = 'Token ไม่ตรงกับ <code>SECRET_TOKEN</code> ใน Code.gs';
      else if (err.includes('unknown action')) why = 'Apps Script เป็นเวอร์ชันเก่า — ต้อง deploy ใหม่';
      else if (err.includes('Network') || err.includes('Failed to fetch')) why = 'เรียก URL ไม่ได้ — URL ผิด หรือ deploy ไม่ได้ตั้ง "Anyone"';
      else if (err.includes('not JSON')) why = 'ได้หน้า HTML แทน JSON — มักเกิดจาก deploy ตั้งเป็น "Only myself" แทน "Anyone"';
      else why = 'ดูคำตอบดิบด้านบนประกอบ';
      verdict = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1);font-size:13px;color:#b02a2a">
        ❌ <b>เขียนลง Sheet ไม่ได้</b><br>สาเหตุน่าจะเป็น: ${why}</div>`;
    }

    const bg = (wrote && found) ? '#e6f7ed' : wrote ? '#fff3cd' : '#fde8e8';
    const bd = (wrote && found) ? '#8ed9ae' : wrote ? '#ffc107' : '#f5a3a3';
    setWriteTest(`<div style="margin-top:10px;background:${bg};border:1px solid ${bd};padding:12px 14px;border-radius:8px">${lines.join('')}${verdict}</div>`);
  }

  async function testLiff() {
    const box = document.getElementById('liff-test');
    if (!box) return;
    const row = (ok, txt) => `<div style="display:flex;gap:8px;padding:4px 0;font-size:13px"><span>${ok?'✅':'❌'}</span><span>${txt}</span></div>`;
    const wrap = (bg, bd, html) => box.innerHTML = `<div style="background:${bg};border:1px solid ${bd};padding:12px 14px;border-radius:8px;margin-top:4px">${html}</div>`;

    const liffId = (document.getElementById('set-liffId')||{}).value.trim() || S.liffId;
    if (!liffId) {
      wrap('#fff3cd','#ffc107', row(false,'ยังไม่ได้ใส่ LIFF ID') +
        `<div style="font-size:12px;color:#7a5a00;margin-top:8px;line-height:1.7">
          สร้างที่ <a href="https://developers.line.biz/console" target="_blank" style="color:var(--brand)">developers.line.biz/console</a><br>
          → LINE Login channel → เมนู <b>LIFF</b> → <b>Add</b><br>
          → Size: <b>Full</b> · Endpoint URL: <code>${location.origin}</code><br>
          → Scope: ติ๊ก <b>profile</b> + <b>openid</b> · เปิด <b>OpenID Connect</b><br>
          → copy <b>LIFF ID</b> มาใส่ช่องด้านบน แล้วกด 💾 บันทึก
        </div>`);
      return;
    }

    box.innerHTML = `<div style="padding:12px;color:var(--text-muted);font-size:13px">⏳ กำลังทดสอบ...</div>`;
    let html = row(true, `มี LIFF ID: <code>${esc(liffId)}</code>`);

    const loaded = await loadLiffSdk();
    html += row(loaded, loaded ? 'โหลด LIFF SDK สำเร็จ' : 'โหลด LIFF SDK ไม่ได้ (เช็คอินเทอร์เน็ต / adblock)');
    if (!loaded) { wrap('#fde8e8','#f5a3a3', html); return; }

    try {
      if (!_liffInited) { await liff.init({ liffId }); _liffInited = true; }
      html += row(true, 'liff.init() ผ่าน — LIFF ID + Endpoint URL ถูกต้อง');
    } catch (e) {
      html += row(false, `liff.init() ไม่ผ่าน: ${esc(e.message||String(e))}`);
      wrap('#fde8e8','#f5a3a3', html + `
        <div style="font-size:12px;color:#8a2020;margin-top:10px;line-height:1.7">
          <b>สาเหตุที่พบบ่อย:</b><br>
          • LIFF ID พิมพ์ผิด / ไม่มีอยู่จริง<br>
          • Endpoint URL ใน LINE Console ไม่ตรงกับ <code>${location.origin}</code><br>
          • LIFF app ถูกลบไปแล้ว
        </div>`);
      return;
    }

    const inClient = liff.isInClient();
    html += row(true, inClient ? 'เปิดอยู่ในแอป LINE' : 'เปิดใน browser ทั่วไป (ใช้ได้ปกติ)');

    const loggedIn = liff.isLoggedIn();
    html += row(loggedIn, loggedIn ? 'login LINE อยู่แล้ว' : 'ยังไม่ได้ login — กดปุ่มเขียวที่หน้า /login ได้เลย');

    if (loggedIn) {
      try {
        const p = await liff.getProfile();
        html += row(true, `ดึงโปรไฟล์ได้: <b>${esc(p.displayName)}</b>`);
      } catch (e) {
        html += row(false, 'ดึงโปรไฟล์ไม่ได้ — scope อาจไม่มี profile');
      }
    }

    const allOk = loaded && _liffInited;
    wrap(allOk?'#e6f7ed':'#fff3cd', allOk?'#8ed9ae':'#ffc107', html +
      (allOk ? `<div style="font-size:12px;color:#0B7A3E;margin-top:8px">✅ พร้อมใช้ — ปุ่ม "เข้าสู่ระบบด้วย LINE" จะโผล่ที่หน้า /login</div>` : ''));
  }

  async function runBackendCheck() {
    if (!S.sheetApiUrl) {
      setDiag(`<div style="background:#fde8e8;border:1px solid #f5a3a3;padding:14px;border-radius:10px;margin-bottom:16px">❌ ยังไม่ได้ตั้ง Sheet API URL</div>`);
      return;
    }
    setDiag(`<div style="background:var(--surface-warm);border:1px solid var(--border);padding:16px;border-radius:10px;margin-bottom:16px;text-align:center;color:var(--text-muted)">⏳ กำลังตรวจสอบ backend... (ใช้เวลาถึง 30 วินาที)</div>`);

    // action → ฟีเจอร์ที่ต้องใช้ + เวอร์ชันที่เพิ่มมา
    const checks = [
      { action: 'ping',      label: 'เชื่อมต่อพื้นฐาน',        need: 'v1'  },
      { action: 'list',      label: 'สินค้า (products)',      need: 'v1'  },
      { action: 'orders',    label: 'คำสั่งซื้อ (orders)',     need: 'v1'  },
      { action: 'bills',     label: 'บิล (bills_cash/tax)',   need: 'v18' },
      { action: 'customers', label: 'ลูกค้า (customers)',      need: 'v19' },
      { action: 'promos',    label: 'Banner + คลิป TikTok',   need: 'v28' },
      { action: 'settings',  label: 'ตั้งค่าร้าน (เบอร์/บัญชี)', need: 'v29' },
      { action: 'bootstrap', label: 'โหลดรวดเดียว (bootstrap)', need: 'v42' },
    ];

    // ต้องยิงทีละอัน — Apps Script ประมวลผลทีละคำขอต่อผู้ใช้
    // ถ้ายิงพร้อมกัน ตัวที่หนัก (สินค้า 271 รายการ) จะติดคิวจนหมดเวลา
    const results = [];
    const total = checks.length + 1;
    for (const c of checks) {
      // สินค้าเป็นก้อนใหญ่สุด ให้เวลามากกว่า
      const ms = c.action === 'list' ? 45000 : 20000;
      try {
        const res = await apiCall(c.action, {}, false, ms);
        results.push({ ...c, ok: !!(res && res.ok), err: res && res.error });
      } catch (e) {
        results.push({ ...c, ok: false, err: String(e.message||e) });
      }
      // แสดงความคืบหน้าระหว่างรอ
      setDiag(`<div style="background:var(--surface-warm);border:1px solid var(--border);padding:14px 16px;border-radius:10px;margin-bottom:16px">
        <div style="font-weight:700;margin-bottom:8px">⏳ กำลังตรวจสอบ ${results.length}/${total}</div>
        ${results.map(r => `<div style="font-size:13px;padding:3px 0">${r.ok?'✅':'❌'} ${r.label}</div>`).join('')}
        <div style="font-size:12px;color:var(--text-muted);margin-top:6px">กำลังเช็ค: ${esc((checks[results.length]||{}).label || 'รหัสแอดมิน')}...</div>
      </div>`);
    }
    // getAdmin เป็น POST (ต้องมี token) — เช็คว่า token ถูกด้วย
    try {
      const res = await apiCall('getAdmin', {}, true, 20000);
      results.push({ action:'getadmin', label:'รหัสแอดมิน (admin) · เช็ค token', need:'v33',
        ok: !!(res && res.ok), err: res && res.error });
    } catch (e) {
      results.push({ action:'getadmin', label:'รหัสแอดมิน (admin) · เช็ค token', need:'v33', ok:false, err:String(e.message||e) });
    }

    // อ่านเวอร์ชัน backend จาก ping
    let backendVer = null;
    try { const p = await apiCall('ping'); backendVer = (p && p.version) || null; } catch(e){}
    const EXPECTED_BACKEND = NEED_BACKEND;

    const failed = results.filter(r => !r.ok);
    const backendOk = backendVer !== null && backendVer >= EXPECTED_BACKEND;
    const allOk = failed.length === 0 && backendOk;
    // หา version ต่ำสุดที่ fail → บอกว่า deploy ค้างอยู่รุ่นไหน
    const oldestFail = failed.length ? failed[0].need : null;

    const tokenBad = results.some(r => r.action === 'getadmin' && String(r.err||'').includes('unauthorized'));
    setDiag(`
      <div style="background:${allOk?'#e6f7ed':'#fff3cd'};border:1px solid ${allOk?'#8ed9ae':'#ffc107'};padding:14px 16px;border-radius:10px;margin-bottom:16px">
        ${tokenBad ? `<div style="background:#fde8e8;border:1px solid #f5a3a3;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#b02a2a">
          🔑 <b>Secret Token ไม่ตรงกับ Code.gs</b> — ต้องเป็น <code style="background:#fff;padding:1px 5px;border-radius:3px">iamplastic_secret_2026</code>
          <button class="btn btn-primary" style="display:block;margin-top:8px;font-size:12px" onclick="fixSheetToken()">🔧 แก้ให้อัตโนมัติ</button>
        </div>` : ''}
        <div style="font-weight:800;font-size:15px;margin-bottom:6px;color:${allOk?'#0B7A3E':'#7a5a00'}">
          ${allOk ? '✅ Backend เป็นเวอร์ชันล่าสุด — ทุกฟีเจอร์พร้อมใช้'
                  : (backendVer === null ? '⚠️ Backend เป็นเวอร์ชันเก่ามาก (ไม่บอกเวอร์ชัน)'
                     : !backendOk ? `⚠️ Apps Script ยังเป็น v${backendVer} — ต้อง deploy v${EXPECTED_BACKEND}`
                     : `⚠️ มี ${failed.length} ฟีเจอร์ใช้ไม่ได้`)}
        </div>
        <div style="font-size:12px;margin-bottom:10px;color:var(--text-muted);font-family:monospace">
          index.html ที่ browser โหลด: <b>v${APP_VERSION}</b><br>
          Code.gs ที่ deploy: <b>${backendVer ? 'v'+backendVer : 'เก่ากว่า v37'}</b> · ต้องการ: <b>v${EXPECTED_BACKEND}</b>
          ${backendOk ? ' <span style="color:#0B7A3E">✓ ตรง</span>' : ' <span style="color:#DC2626">✗ ยังไม่ได้ deploy</span>'}
        </div>
        <table style="width:100%;font-size:13px;border-collapse:collapse">
          ${results.map(r => `<tr style="border-bottom:1px solid rgba(0,0,0,.06)">
            <td style="padding:6px 0;width:28px;vertical-align:top">${r.ok?'✅':'❌'}</td>
            <td style="padding:6px 0">${r.label}
              ${!r.ok && r.err ? `<div style="font-size:11px;color:#b02a2a;margin-top:3px;word-break:break-all">${esc(String(r.err).slice(0,160))}</div>` : ''}
            </td>
            <td style="padding:6px 0;text-align:right;font-size:11px;color:var(--text-muted);vertical-align:top;white-space:nowrap">${r.ok?'ใช้ได้':'ต้องการ '+r.need}</td>
          </tr>`).join('')}
        </table>
        ${allOk ? '' : (backendOk ? `
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.1);font-size:13px;color:#0B7A3E;line-height:1.75">
            ✅ <b>Code.gs เป็นเวอร์ชันถูกต้องแล้ว (v${backendVer})</b> — ไม่ต้อง deploy ใหม่<br>
            แถวที่ ❌ มักเกิดจาก <b>หมดเวลารอ</b> เพราะ Apps Script ทำงานทีละคำขอ<br>
            ${results.some(r=>r.action==='list'&&!r.ok) ? `<b>สินค้า</b> เป็นก้อนใหญ่สุด (271 รายการ) จึงช้าที่สุด — แต่หน้าเว็บโหลดสินค้าได้ปกติอยู่แล้ว (เห็น "สินค้า (271)" บนเมนู)<br>` : ''}
            👉 กด <b>🔬 ตรวจสอบระบบ</b> ซ้ำอีกครั้ง มักจะผ่านครบ
          </div>` : `
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.1);font-size:13px;color:#7a5a00;line-height:1.7">
            <div style="background:#fde8e8;border:1px solid #f5a3a3;padding:10px 12px;border-radius:8px;margin-bottom:12px;color:#b02a2a">
              <b>Apps Script ยังค้างอยู่ที่ v${backendVer||'เก่า'}</b> — ของที่ยังใช้ไม่ได้จนกว่าจะ deploy v${EXPECTED_BACKEND}:<br>

              • ปุ่ม <b>🧹 ลบแถวทดสอบ</b> ออกจาก tab customers<br>

            <b>วิธี deploy (ทำครั้งเดียว ~1 นาที):</b><br>

  // แยกประเภท URL TikTok: video (ใช้ได้) / short (ใช้ได้) / profile (ใช้ไม่ได้)
  function classifyTiktokUrl(url) {
    const u = String(url||'').trim();
    if (!u) return { kind:'empty' };
    if (/\/video\/\d+/.test(u)) return { kind:'video' };
    if (/(vt|vm)\.tiktok\.com\//i.test(u)) return { kind:'short' };
    if (/tiktok\.com\/@[^\/]+\/?(\?|$)/i.test(u)) {
      const handle = (u.match(/@([^\/?&]+)/)||[,''])[1];
      return { kind:'profile', handle };
    }
    if (/tiktok\.com/i.test(u)) return { kind:'unknown-tiktok' };
    return { kind:'not-tiktok' };
  }

  function confirmAddTiktok() {
    const typed = (document.getElementById('tt-url')||{}).value.trim();
    const resolved = (document.getElementById('tt-resolved')||{}).value || '';
    // ใช้ URL เต็มที่แกะจากลิงก์สั้น ถ้ามี — จะได้เล่นในเว็บได้
    const url = (resolved && /\/video\/\d+/.test(resolved)) ? resolved : typed;
    const title = (document.getElementById('tt-title')||{}).value || '';
    const thumbnail = (document.getElementById('tt-thumb')||{}).value || '';
    if (!url) return;
    S.tiktokVideos = S.tiktokVideos || [];
    S.tiktokVideos.unshift({ url, title, thumbnail, views:'', createdAt: new Date().toISOString() });
    saveState(); saveSynced('tiktokVideos');
    document.getElementById('tt-url').value = '';
    render();
    savePromosToSheet().then(ok => {
      if (ok) toast("✓ ลงคลิปแล้ว · บันทึกขึ้น Sheet เรียบร้อย");
      // ถ้าไม่ ok → savePromosToSheet แจ้ง error เองแล้ว
    });
  }

  // อัพวิดีโอ preview สั้นๆ → เล่นวนอัตโนมัติแบบปิดเสียงบนหน้าแรก (การันตีว่าเล่นได้)
  async function uploadTiktokPreview(i, inp) {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (!S.cloudinaryCloud || !S.cloudinaryPreset) {
      toast("ยังไม่ได้ตั้งค่า Cloudinary — ไปที่ ตั้งค่าร้าน"); return;
    }
    if (f.size > 25 * 1024 * 1024) { toast("ไฟล์ใหญ่เกิน 25MB — ตัดให้สั้นลงก่อน"); return; }
    toast("⏳ อัพวิดีโอ... (อาจใช้เวลาสักครู่)");
    const fd = new FormData();
    fd.append('file', f);
    fd.append('upload_preset', S.cloudinaryPreset);
    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${S.cloudinaryCloud}/video/upload`, { method:'POST', body:fd });
      const j = await res.json();
      if (!j.secure_url) { toast("อัพไม่สำเร็จ: " + (j.error?j.error.message:'unknown')); return; }
      S.tiktokVideos[i].previewVideo = j.secure_url;
      saveState(); saveSynced('tiktokVideos','banners'); savePromosToSheet();
      toast("✓ อัพวิดีโอสำเร็จ — คลิปนี้จะเล่นวนอัตโนมัติแล้ว");
      render();
    } catch (e) { toast("อัพไม่สำเร็จ: " + e.message); }
  }

  function moveTiktok(i, dir) {
    const list = S.tiktokVideos || [];
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    saveState(); saveSynced('tiktokVideos','banners'); savePromosToSheet(); render();
  }

  async function uploadQrFile(inp) {
    const f = inp.files && inp.files[0]; if (!f) return;
    toast("⏳ อัพ QR ขึ้น Cloudinary...");
    const url = await uploadToCloudinary(f);
    if (url) {
      document.getElementById('set-customQrImage').value = url;
      S.customQrImage = url;
      saveState(); saveSynced('customQrImage'); pushSettingsToSheet();
      toast("✓ อัพ QR สำเร็จ · บันทึกแล้ว");
      render();
    }
  }
  function clearCustomQr() {
    if (!confirm("ลบ QR ที่อัพไว้? (จะกลับไปใช้ QR auto-gen จาก PromptPay)")) return;
    S.customQrImage = '';
    saveState(); saveSynced('customQrImage'); pushSettingsToSheet();
    toast("✓ กลับไปใช้ QR auto-gen"); render();
  }
  function copyText(txt, label) {
    const t = String(txt||'');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast(`📋 คัดลอก${label||''} ${t}`)).catch(()=>prompt('คัดลอก:', t));
    else prompt('คัดลอก:', t);
  }

  function saveProfile() {
    const g = id => (document.getElementById(id)||{}).value.trim();
    const name = g('pf-name'), phone = g('pf-phone'), pw = g('pf-pw');
    if (!name||!phone) { toast("ชื่อ+เบอร์ห้ามว่าง"); return; }
    S.user.name = name; S.user.phone = phone;
    if (pw) { if (pw.length<6) { toast("รหัสผ่าน >= 6 ตัว"); return; } S.user.password = btoa(pw); }
    const idx = S.registeredUsers.findIndex(x => x.email === S.user.email);
    if (idx>=0) { S.registeredUsers[idx].name=name; S.registeredUsers[idx].phone=phone; if (pw) S.registeredUsers[idx].password=btoa(pw); }
    saveState();
    if (S.sheetApiUrl) pushCustomerToSheet(S.user).catch(()=>{});
    toast("✓ บันทึกโปรไฟล์แล้ว"); render();
  }

  // Promos (banners + tiktok) sync กับ Sheet
  async function applyPromos(res) {
    const remoteTt = res.tiktoks || [];
    const remoteBn = res.banners || [];
    const localTt  = S.tiktokVideos || [];
    const localBn  = S.banners || [];

    // ============================================================
    // กฎ: Sheet คือศูนย์กลาง — ฝั่งไหนที่ Sheet มีข้อมูล ให้ใช้ของ Sheet เสมอ
    //
    // บั๊กเดิม: ถ้า banner ใน Sheet ว่าง แต่เครื่องนี้มี banner ค้าง
    // มันจะ savePromosToSheet() ซึ่ง "เขียนทับทั้งตาราง" ด้วยค่าในเครื่อง
    // เครื่องที่ไม่มีคลิป → ส่ง tiktoks: [] ขึ้นไป → คลิปของทุกคนหายเกลี้ยง
    // ต้องรวมข้อมูลก่อนเสมอ ห้ามส่งค่าในเครื่องดิบๆ ขึ้นไป
    // ============================================================
    S.tiktokVideos = remoteTt.length ? remoteTt : localTt;
    S.banners      = remoteBn.length ? remoteBn : localBn;
    saveSynced('banners','tiktokVideos');

    // กู้ขึ้น Sheet เฉพาะตอนที่ "เคยบันทึกไม่สำเร็จ" เท่านั้น
    // ไม่งั้นคลิปที่แอดมินตั้งใจลบ จะถูกเครื่องเก่าอัพกลับขึ้นไปเรื่อยๆ
    const needRecover = S.promosPendingPush &&
      ((remoteTt.length === 0 && localTt.length > 0) || (remoteBn.length === 0 && localBn.length > 0));
    if (needRecover) {
      console.warn("[promos] มีของค้างที่ยังไม่ขึ้น Sheet — กำลังกู้");
      const ok = await savePromosToSheet();
      if (ok) toast(`↑ กู้ข้อมูลที่ค้างขึ้น Sheet แล้ว`);
    }
  }

  // Apps Script รับคำขอของ user เดียวกัน "ทีละอัน" ยิงพร้อมกัน 4 อันไม่ได้เร็วขึ้น

  async function pullBootstrapFromSheet() {

      if (res && /unknown action/i.test(String(res.error||''))) {
        console.warn("[bootstrap] backend ยังเป็นเวอร์ชันเก่า — ใช้วิธียิงทีละอัน");

        await pullSettingsFromSheet();
        await pullReviewsFromSheet();

  // =========================
  // LINE Login (LIFF)
  // =========================
  // โหลด LIFF SDK แบบ on-demand (แก้ปัญหา: เดิมโหลดตอน page load เท่านั้น
  // ถ้า liffId ยังว่างตอนนั้น SDK จะไม่ถูกโหลดเลย แม้ตั้งค่าทีหลัง)
  let _liffSdkPromise = null;
  function loadLiffSdk() {
    if (window.liff) return Promise.resolve(true);
    if (_liffSdkPromise) return _liffSdkPromise;
    _liffSdkPromise = new Promise(resolve => {
      const s = document.createElement('script');
      s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
      s.onload = () => resolve(true);
      s.onerror = () => { _liffSdkPromise = null; resolve(false); };
      document.head.appendChild(s);
    });
    return _liffSdkPromise;
  }

  let _liffInited = false;
  let _liffError = '';
  async function initLIFF() {
    if (!S.liffId) { _liffError = 'ยังไม่ได้ตั้ง LIFF ID'; return; }
    const loaded = await loadLiffSdk();
    if (!loaded || !window.liff) { _liffError = 'โหลด LIFF SDK ไม่ได้'; return; }
    try {
      if (!_liffInited) { await liff.init({ liffId: S.liffId }); _liffInited = true; _liffError = ''; }
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        S.lineProfile = {
          userId: profile.userId,
          displayName: profile.displayName,
          pictureUrl: profile.pictureUrl,
          email: (liff.getDecodedIDToken && liff.getDecodedIDToken() && liff.getDecodedIDToken().email) || '',
        };
        saveState();
        // Auto-login ถ้ายังไม่ได้ login
        if (!isLoggedIn()) {
          autoLoginFromLINE();
        }
        render();
      }
    } catch (e) {
      _liffError = String(e.message || e);
      console.error("LIFF init err:", e);
    }
  }

  async function loginWithLINE() {
    if (!S.liffId) { toast("ยังไม่ได้ตั้ง LIFF ID — ไปที่ ตั้งค่าร้าน"); return; }
    toast("⏳ กำลังเชื่อมต่อ LINE...");
    const loaded = await loadLiffSdk();
    if (!loaded || !window.liff) { toast("❌ โหลด LIFF SDK ไม่ได้ — เช็คอินเทอร์เน็ต"); return; }
    try {
      if (!_liffInited) { await liff.init({ liffId: S.liffId }); _liffInited = true; }
    } catch (e) {
      toast("❌ LIFF ID ผิด หรือ Endpoint URL ไม่ตรง: " + (e.message||e));
      console.error("[liff.init]", e);
      return;
    }
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
    } else {
      const profile = await liff.getProfile();
      S.lineProfile = {
        userId: profile.userId, displayName: profile.displayName,
        pictureUrl: profile.pictureUrl,
        email: (liff.getDecodedIDToken && liff.getDecodedIDToken() && liff.getDecodedIDToken().email) || '',
      };
      saveState();
      autoLoginFromLINE();
    }
  }

  function autoLoginFromLINE() {
    const p = S.lineProfile; if (!p) return;
    const lineKey = 'LINE:' + p.userId;
    // ค้นบัญชีที่ผูก LINE ไว้แล้ว
    let user = S.registeredUsers.find(u => u.lineUserId === p.userId);
    if (!user) {
      // สร้างใหม่
      user = {
        name: p.displayName,
        firstName: p.displayName, lastName: '',
        phone: '', email: p.email || lineKey,
        password: '',
        lineUserId: p.userId,
        pictureUrl: p.pictureUrl,
        registeredAt: new Date().toISOString(),
        addresses: [],
      };
      S.registeredUsers.push(user);
      if (S.sheetApiUrl) pushCustomerToSheet(user).catch(()=>{});
    } else {
      // update ชื่อ+รูปให้ล่าสุด
      user.name = p.displayName;
      user.pictureUrl = p.pictureUrl;
    }
    S.user = { role: 'customer', ...user };
    saveState();
    toast(`✓ เข้าสู่ระบบด้วย LINE · สวัสดีคุณ${p.displayName}`);
    render();
  }

    if (!S.cloudinaryCloud || !S.cloudinaryPreset) { toast("ยังไม่ได้ตั้งค่า Cloudinary — ไปที่ /admin/settings"); return null; }

      if (j.secure_url) return j.secure_url;

    return null;
  }

  function setBillsTab(t) { S.billsTab = t; render(); }

  function copyBillLink(id) {
    const url = location.origin + location.pathname + '#/admin/bill/' + id;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('📋 คัดลอกลิงก์แล้ว: ' + url)).catch(() => toast('ลิงก์: ' + url));
    else { prompt('คัดลอกลิงก์ (Ctrl+C):', url); }
  }

  async function markBillPaid(bl) {
    if (!confirm(`ยืนยันว่าบิล ${bl} ชำระแล้ว?`)) return;
    const bill = allBillsFlat().find(b => (b.bl||b.po) === bl);
    if (bill) { bill.status = 'paid'; bill.updatedAt = new Date().toISOString(); saveState(); }
    const ok = await updateBillStatusOnSheet(bl, 'paid');
    toast(ok ? `✓ บิล ${bl} → ชำระแล้ว` : '❌ อัพเดตไม่สำเร็จ');
    render();
  }

  async function advanceOrderAdmin(po) {
    const orders = S.sheetOrders || S.orders || [];
    const o = orders.find(x => x.po === po);
    if (!o) return;
    const nextStatus = STATUS_FLOW[STATUS_FLOW.indexOf(o.status) + 1];
    if (!nextStatus) return;
    let tracking = o.tracking || '';
    if (nextStatus === 'shipping' && !tracking) {
      tracking = prompt("ใส่หมายเลขติดตามพัสดุ (ปล่อยว่างให้ระบบ gen ให้)", "TH" + String(Math.floor(Math.random()*99999999999)).padStart(11,'0')) || '';
    }
    // Update Sheet
    if (S.sheetApiUrl) await updateOrderStatusOnSheet(po, nextStatus, tracking);
    // Update local
    o.status = nextStatus;
    if (tracking) { o.tracking = tracking; o.carrierName = ({kerry:'Kerry Express',flash:'Flash Express',pickup:'รับเองที่คลัง'})[o.shippingMethod]; }
    o.updatedAt = new Date().toISOString();
    // Also update S.orders if present
    const local = S.orders.find(x => x.po === po);
    if (local) { local.status = o.status; local.tracking = o.tracking; local.updatedAt = o.updatedAt; }
    saveState();
    toast(`✓ ${STATUS_LABEL[nextStatus].th}`);
    render();
  }

  async function addTrackingPrompt(po) {
    const tracking = prompt("หมายเลขติดตามพัสดุ:", "TH" + String(Math.floor(Math.random()*99999999999)).padStart(11,'0'));
    if (!tracking) return;
    const orders = S.sheetOrders || S.orders || [];
    const o = orders.find(x => x.po === po);
    if (!o) return;
    o.tracking = tracking;
    o.carrierName = ({kerry:'Kerry Express',flash:'Flash Express',pickup:'รับเองที่คลัง'})[o.shippingMethod] || 'ขนส่ง';
    if (S.sheetApiUrl) await updateOrderStatusOnSheet(po, o.status, tracking);
    saveState();
    toast("บันทึก tracking ✓"); render();
  }
  async function cancelOrderAdmin(po) {
    if (!confirm("ยกเลิกคำสั่งซื้อ " + po + " ?")) return;
    const orders = S.sheetOrders || S.orders || [];
    const o = orders.find(x => x.po === po);
    if (o) {
      o.status = 'cancelled'; o.updatedAt = new Date().toISOString();
      if (S.sheetApiUrl) await updateOrderStatusOnSheet(po, 'cancelled');
    }
    saveState();
    toast("ยกเลิกแล้ว");
    go('/admin/orders');
  }

  // =======================================================
  // Create Bill (manual) — admin เปิดบิลเอง สำหรับ walk-in/phone order
  // =======================================================
  function viewAdminCreateBill() {
    const b = S.bill;
    // Search products
    let searchResults = [];
    if (b.productSearch && b.productSearch.length >= 1) {
      const q = b.productSearch.toLowerCase();
      searchResults = EP.filter(p =>
        p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
      ).slice(0, 10);
    }
    // Search customers
    let custResults = [];
    if (b.customerSearch && b.customerSearch.length >= 1) {
      const q = b.customerSearch.toLowerCase();
      custResults = S.registeredUsers.filter(u =>
        (u.name||'').toLowerCase().includes(q) ||
        (u.phone||'').includes(q) ||
        (u.email||'').toLowerCase().includes(q) ||
        (u.company||'').toLowerCase().includes(q)
      ).slice(0, 8);
    }
    // Calculate
    const lineItems = b.items.map(it => {
      const p = EP.find(x => x.id === it.pid);
      if (!p) return null;
      const priceEach = it.priceOverride !== undefined && it.priceOverride !== null
        ? it.priceOverride
        : (it.priceMode === 'wholesale' ? p.wholesale : p.retail);
      return { p, qty: it.qty, priceEach, total: priceEach * it.qty };
    }).filter(Boolean);
    const subtotal = lineItems.reduce((s, li) => s + li.total, 0);
    const discount = Number(b.discount) || 0;
    const shipping = Number(b.shipping) || 0;
    const grandTotal = Math.max(0, subtotal - discount + shipping);
    // Weight total (for shipping suggestion)
    const totalWeight = lineItems.reduce((s, li) => s + ((li.p.weight || 0.5) * li.qty), 0);
    const suggestedShip = totalWeight <= 0 ? 0 : totalWeight <= 1 ? 50 : totalWeight <= 5 ? 90 : totalWeight <= 10 ? 140 : 200;

    return `
      ${adminPageHeader('🧾 เปิดบิลใหม่ (Manual)', '🧾', `
        <button class="btn btn-outline" onclick="resetBillBuilder()">🔄 ล้างทั้งหมด</button>
        <button class="btn btn-primary btn-big" onclick="finalizeBill()" ${lineItems.length===0||!b.customer.name?'disabled style="opacity:.5;cursor:not-allowed"':''}>💾 สร้างบิล + พิมพ์</button>
      `)}

      <div style="display:grid;grid-template-columns:1fr 380px;gap:20px">
        <!-- LEFT: Items builder + customer -->
        <div style="display:flex;flex-direction:column;gap:16px">
          <!-- CUSTOMER SECTION -->
          <div class="co-card" style="margin:0">
            <h3>👤 ข้อมูลลูกค้า${b.customer.isCorporate?' <span style="font-size:11px;font-weight:400;color:var(--wholesale);background:var(--wholesale-soft);padding:3px 8px;border-radius:4px">🏢 นิติบุคคล</span>':''}</h3>

            <div style="position:relative;margin-bottom:12px">
              <input placeholder="🔍 ค้นหาลูกค้าเก่า (ชื่อ/เบอร์/อีเมล/บริษัท) หรือกรอกใหม่ด้านล่าง" value="${b.customerSearch}" oninput="S.bill.customerSearch=this.value;render()" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-warm);font-size:13px;color:var(--text);font-family:inherit">
              ${custResults.length > 0 ? `
                <div class="search-dropdown">
                  ${custResults.map(u => `<div class="search-result" onclick="selectCustomer('${u.phone||u.email}')">
                    <div style="font-weight:600;font-size:13px">${u.name}${u.isCorporate?' 🏢':''}</div>
                    <div style="font-size:11px;color:var(--text-muted)">${u.phone||''} · ${u.email||''}${u.company?' · '+u.company:''}</div>
                  </div>`).join('')}
                </div>
              ` : (b.customerSearch.length >= 1 && !custResults.length ? `<div class="search-dropdown"><div style="padding:10px;color:var(--text-muted);font-size:12px">ไม่พบลูกค้าในทะเบียน — กรอกข้อมูลใหม่ด้านล่าง</div></div>` : '')}
            </div>

            <div class="form-grid">
              <div class="form-field"><label>ชื่อ-นามสกุล *</label><input value="${(b.customer.name||'').replace(/"/g,'&quot;')}" oninput="S.bill.customer.name=this.value" placeholder="ชื่อ ลูกค้า"></div>
              <div class="form-field"><label>เบอร์โทร</label><input value="${b.customer.phone||''}" oninput="S.bill.customer.phone=this.value" placeholder="082-xxx-xxxx"></div>
              <div class="form-field wide"><label>ที่อยู่</label><input value="${(b.customer.address||'').replace(/"/g,'&quot;')}" oninput="S.bill.customer.address=this.value" placeholder="ที่อยู่จัดส่ง / ที่อยู่ลูกค้า"></div>
            </div>

            <label style="display:flex;align-items:center;gap:10px;padding:12px 0 8px;border-top:1px solid var(--border);margin-top:12px;cursor:pointer">
              <input type="checkbox" ${b.customer.isCorporate?'checked':''} onchange="S.bill.customer.isCorporate=this.checked;render()" style="width:18px;height:18px;accent-color:var(--wholesale)">
              <span style="font-weight:600;font-size:13px">🏢 ออกใบกำกับภาษี (นิติบุคคล)</span>
            </label>

            ${b.customer.isCorporate ? `
              <div class="form-grid" style="margin-top:8px">
                <div class="form-field wide"><label>ชื่อบริษัท *</label><input value="${(b.customer.company||'').replace(/"/g,'&quot;')}" oninput="S.bill.customer.company=this.value" placeholder="บริษัท ... จำกัด"></div>
                <div class="form-field"><label>เลขประจำตัวผู้เสียภาษี (13 หลัก) *</label><input class="mono" value="${b.customer.taxId||''}" oninput="S.bill.customer.taxId=this.value.replace(/[-\\s]/g,'')" placeholder="0-1055-58001-23-4" maxlength="20"></div>
                <div class="form-field"><label>สาขา</label><input value="${b.customer.branch||'สำนักงานใหญ่'}" oninput="S.bill.customer.branch=this.value"></div>
              </div>
            ` : ''}
          </div>

          <!-- ITEMS SECTION -->
          <div class="co-card" style="margin:0">
            <h3>📦 รายการสินค้า (${lineItems.length})</h3>
            <div style="position:relative;margin-bottom:14px">
              <input placeholder="🔍 พิมพ์ชื่อสินค้า/SKU เพื่อเพิ่มลงบิล" value="${b.productSearch}" oninput="S.bill.productSearch=this.value;render()" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-warm);font-size:13px;color:var(--text);font-family:inherit">
              ${searchResults.length > 0 ? `
                <div class="search-dropdown">
                  ${searchResults.map(p => `<div class="search-result" onclick="addBillItem('${p.id}')">
                    <div style="display:flex;gap:10px;align-items:center">
                      <div style="width:32px;height:32px;background:var(--surface-warm);border-radius:4px;display:grid;place-items:center;font-size:18px;flex-shrink:0;overflow:hidden">${p.cover?`<img src="${p.cover}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.textContent='${p.icon}'">`:p.icon}</div>
                      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div><div style="font-size:10px;color:var(--text-muted)">SKU: ${p.id} · สต็อก ${p.stock}</div></div>
                      <div style="text-align:right;font-family:JetBrains Mono,monospace;font-size:12px;flex-shrink:0"><b style="color:var(--brand)">${money(p.retail)}</b><br><span style="color:var(--wholesale);font-size:10px">ส่ง ${money(p.wholesale)}</span></div>
                    </div>
                  </div>`).join('')}
                </div>
              ` : ''}
            </div>

            ${lineItems.length === 0 ? `<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;background:var(--surface-warm);border-radius:6px;border:2px dashed var(--border)">📦 ยังไม่มีสินค้าในบิล — พิมพ์ค้นหาด้านบนเพื่อเพิ่ม</div>` : `
              <table class="admin-table" style="border:0">
                <thead><tr>
                  <th style="width:36px"></th>
                  <th>สินค้า</th>
                  <th style="width:80px">จำนวน</th>
                  <th style="width:110px">ราคาต่อหน่วย</th>
                  <th style="text-align:right;width:90px">รวม</th>
                  <th style="width:36px"></th>
                </tr></thead>
                <tbody>
                  ${b.items.map((it, i) => {
                    const p = EP.find(x => x.id === it.pid);
                    if (!p) return '';
                    const priceEach = it.priceOverride !== undefined && it.priceOverride !== null ? it.priceOverride : (it.priceMode === 'wholesale' ? p.wholesale : p.retail);
                    return `<tr>
                      <td><div style="width:32px;height:32px;background:var(--surface-warm);border-radius:4px;display:grid;place-items:center;overflow:hidden">${p.cover?`<img src="${p.cover}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.textContent='${p.icon}'">`:p.icon}</div></td>
                      <td><div style="font-size:12px;font-weight:600">${p.name}</div><div style="font-size:10px;color:var(--text-muted)" class="mono">${p.id}</div></td>
                      <td><input type="number" min="1" value="${it.qty}" onchange="updateBillItemQty(${i},parseInt(this.value)||1)" style="width:64px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-family:JetBrains Mono,monospace;color:var(--text);text-align:right"></td>
                      <td>
                        <div style="display:flex;gap:2px;align-items:center">
                          <select onchange="setBillItemPriceMode(${i},this.value)" style="padding:4px 6px;border:1px solid var(--border);border-radius:3px;font-size:11px;background:var(--surface);color:var(--text)">
                            <option value="retail" ${it.priceMode==='retail'?'selected':''}>ปลีก</option>
                            <option value="wholesale" ${it.priceMode==='wholesale'?'selected':''}>ส่ง</option>
                            <option value="custom" ${it.priceOverride!==undefined&&it.priceOverride!==null?'selected':''}>Custom</option>
                          </select>
                          <input type="number" step="0.01" value="${priceEach}" oninput="setBillItemPrice(${i},parseFloat(this.value)||0)" style="width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:3px;background:var(--surface);font-family:JetBrains Mono,monospace;color:var(--text);text-align:right;font-size:12px">
                        </div>
                      </td>
                      <td style="text-align:right;font-weight:700" class="mono">${money(priceEach * it.qty)}</td>
                      <td><button class="admin-btn admin-btn-danger" onclick="removeBillItem(${i})">🗑️</button></td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            `}
          </div>
        </div>

        <!-- RIGHT: Summary -->
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="co-card" style="margin:0;position:sticky;top:100px">
            <h3>💰 สรุปยอด</h3>
            <div class="summ-row"><span>ยอดสินค้า (${lineItems.length})</span><span class="mono">${money(subtotal)}</span></div>
            <div class="summ-row">
              <span>ส่วนลด</span>
              <span><input type="number" min="0" step="0.01" value="${b.discount}" oninput="S.bill.discount=parseFloat(this.value)||0;render()" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface-warm);text-align:right;font-family:JetBrains Mono,monospace;color:var(--text)"></span>
            </div>
            <div class="summ-row">
              <span>ค่าจัดส่ง <span style="color:var(--text-faint);font-size:10px">(สินค้า ${totalWeight.toFixed(1)}kg → แนะนำ ฿${suggestedShip})</span></span>
              <span><input type="number" min="0" step="0.01" value="${b.shipping}" oninput="S.bill.shipping=parseFloat(this.value)||0;render()" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface-warm);text-align:right;font-family:JetBrains Mono,monospace;color:var(--text)"></span>
            </div>
            ${b.customer.isCorporate?`
              <div class="summ-row" style="font-size:11px;color:var(--text-muted)"><span>ยอดก่อน VAT</span><span class="mono">${money(grandTotal/1.07)}</span></div>
              <div class="summ-row" style="font-size:11px;color:var(--text-muted)"><span>VAT 7%</span><span class="mono">${money(grandTotal - grandTotal/1.07)}</span></div>
            `:''}
            <div class="summ-total"><b>รวมทั้งสิ้น</b><b class="tot">${money(grandTotal)}</b></div>

            <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px">
              <label style="font-size:11px;color:var(--text-muted)">ขนส่ง</label>
              <select onchange="S.bill.shippingMethod=this.value" style="padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-family:inherit">
                <option value="kerry" ${b.shippingMethod==='kerry'?'selected':''}>Kerry Express (1-2 วัน)</option>
                <option value="flash" ${b.shippingMethod==='flash'?'selected':''}>Flash Express (2-3 วัน)</option>
                <option value="pickup" ${b.shippingMethod==='pickup'?'selected':''}>รับเองที่คลัง</option>
              </select>
              <label style="font-size:11px;color:var(--text-muted);margin-top:6px">การชำระเงิน</label>
              <select onchange="S.bill.payment=this.value" style="padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-family:inherit">
                <option value="cash" ${b.payment==='cash'?'selected':''}>💵 เงินสด</option>
                <option value="qr" ${b.payment==='qr'?'selected':''}>📱 QR PromptPay</option>
                <option value="bank" ${b.payment==='bank'?'selected':''}>🏦 โอนธนาคาร</option>
                <option value="credit" ${b.payment==='credit'?'selected':''}>📝 เครดิต (ค้างชำระ)</option>
                <option value="cod" ${b.payment==='cod'?'selected':''}>📦 COD เก็บปลายทาง</option>
              </select>
              <label style="font-size:11px;color:var(--text-muted);margin-top:6px">หมายเหตุ</label>
              <textarea rows="2" oninput="S.bill.note=this.value" placeholder="หมายเหตุในบิล (ถ้ามี)" style="padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface-warm);color:var(--text);font-family:inherit;font-size:12px;resize:vertical">${b.note||''}</textarea>
            </div>

            <button class="btn btn-primary btn-block btn-big" style="margin-top:14px" onclick="finalizeBill()" ${lineItems.length===0||!b.customer.name?'disabled style="opacity:.5;cursor:not-allowed;margin-top:14px"':''}>💾 สร้างบิล + พิมพ์ →</button>
            <div style="text-align:center;font-size:10px;color:var(--text-muted);margin-top:6px">${!b.customer.name?'⚠ กรอกชื่อลูกค้าก่อน':lineItems.length===0?'⚠ เพิ่มสินค้าอย่างน้อย 1 รายการ':'✓ พร้อมสร้างบิล'}</div>
          </div>
        </div>
      </div>
    `;
  }

  function resetBillBuilder() {
    if (S.bill.items.length && !confirm("ล้างข้อมูลบิลทั้งหมด?")) return;
    S.bill = {
      items: [], customer: { name:'', phone:'', email:'', address:'', taxId:'', company:'', isCorporate:false },
      discount: 0, shipping: 0, shippingMethod: 'kerry', payment: 'cash', note: '',
      productSearch: '', customerSearch: '',
    };
    render();
  }

  function addBillItem(pid) {
    const p = EP.find(x => x.id === pid);
    if (!p) return;
    // If already in items, +qty
    const existing = S.bill.items.find(i => i.pid === pid);
    if (existing) {
      existing.qty += 1;
    } else {
      S.bill.items.push({ pid, qty: 1, priceMode: 'retail' });
    }
    S.bill.productSearch = '';
    toast(`+ ${p.name.slice(0, 25)}...`);
    render();
  }
  function removeBillItem(idx) {
    S.bill.items.splice(idx, 1);
    render();
  }
  function updateBillItemQty(idx, qty) {
    S.bill.items[idx].qty = Math.max(1, qty);
    render();
  }
  function setBillItemPriceMode(idx, mode) {
    S.bill.items[idx].priceMode = mode;
    if (mode !== 'custom') S.bill.items[idx].priceOverride = null;
    render();
  }
  function setBillItemPrice(idx, price) {
    S.bill.items[idx].priceOverride = price;
    S.bill.items[idx].priceMode = 'custom';
    render();
  }
  function selectCustomer(key) {
    const u = S.registeredUsers.find(u => u.phone === key || u.email === key);
    if (!u) return;
    S.bill.customer = {
      name: u.name || (u.firstName + ' ' + u.lastName),
      phone: u.phone || '', email: u.email || '',
      address: u.address || '',
      isCorporate: !!u.isCorporate,
      company: u.company || '', taxId: u.taxId || '', branch: u.branch || 'สำนักงานใหญ่',
    };
    S.bill.customerSearch = '';
    toast(`เลือกลูกค้า: ${u.name}`);
    render();
  }

  // ออกบิลจาก PO — asTax=true → ใบกำกับภาษี, false → บิลเงินสด
  async function issueBillFromOrder(po, asTax) {
    const o = (S.sheetOrders || S.orders || []).find(x => x.po === po);
    if (!o) { toast("ไม่พบคำสั่งซื้อ " + po); return; }
    // Dedupe: ถ้ามีบิลจาก PO นี้แล้ว → ยืนยันก่อนออกใหม่
    const existing = allBillsFlat().find(b => b.fromPO === po);
    if (existing) {
      if (!confirm(`PO ${po} ออกบิลแล้ว (${existing.bl||existing.po})\nต้องการออกเพิ่มอีก?`)) {
        go('/admin/bill/' + (existing.bl||existing.po));
        return;
      }
    }
    const cust = o.customer || {};
    if (asTax && !cust.taxId) {
      const tid = prompt("ลูกค้ายังไม่มี Tax ID — ใส่เลขผู้เสียภาษี 13 หลัก:", "");
      if (!tid || tid.length < 10) { toast("ยกเลิก — ไม่มี Tax ID"); return; }
      cust.taxId = tid;
      cust.company = cust.company || prompt("ชื่อบริษัท:", cust.name || "") || cust.name || "";
    }
    const now = new Date();
    const yymm = String(now.getFullYear()+543).slice(-2) + String(now.getMonth()+1).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
    const bl = `${asTax?'TX':'RC'}-${yymm}-${rand}`;
    const bill = {
      po: bl, bl,
      status: o.status === 'paid' || o.status === 'preparing' || o.status === 'shipping' || o.status === 'delivered' ? 'paid' : 'pending_payment',
      total: o.total || 0, subtotal: o.subtotal || 0,
      discount: o.discount || 0, shipping: o.shipping || 0,
      items: o.items || [], shippingMethod: o.shippingMethod || '',
      payment: o.payment || 'bank',
      taxInvoice: !!asTax,
      type: asTax ? 'tax' : 'cash',
      createdAt: now.toISOString(), updatedAt: now.toISOString(),
      mode: 'from-po', fromPO: po,
      customer: {
        name: cust.name || '', phone: cust.phone || '', address: cust.address || '',
        company: cust.company || '', taxId: cust.taxId || '', branch: cust.branch || '',
      },
      note: `ออกจาก ${po}`,
      createdBy: (S.user && S.user.name) || 'admin',
    };
    if (!S.sheetBills) S.sheetBills = { cash: [], tax: [] };
    if (asTax) S.sheetBills.tax.unshift(bill); else S.sheetBills.cash.unshift(bill);
    saveState();
    if (S.sheetApiUrl) {
      const res = await apiCall("createBill", { data: bill }, true);
      if (!(res && res.ok)) { toast("❌ ส่งขึ้น Sheet ไม่สำเร็จ: " + ((res && res.error) || '')); return; }
    }
    toast(`✓ ออก${asTax?'ใบกำกับภาษี':'บิลเงินสด'} ${bl} แล้ว · เก็บใน tab ${asTax?'bills_tax':'bills_cash'}`);
    go('/admin/bill/' + bl);
  }

  async function finalizeBill() {
    const b = S.bill;
    if (!b.customer.name) { toast("กรุณาใส่ชื่อลูกค้า"); return; }
    if (b.items.length === 0) { toast("กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ"); return; }

    // Compute
    const items = b.items.map(it => {
      const p = EP.find(x => x.id === it.pid);
      const priceEach = it.priceOverride !== undefined && it.priceOverride !== null
        ? it.priceOverride
        : (it.priceMode === 'wholesale' ? p.wholesale : p.retail);
      return { pid: it.pid, qty: it.qty, priceEach, size: '' };
    });
    const subtotal = items.reduce((s, i) => s + i.priceEach * i.qty, 0);
    const discount = Number(b.discount) || 0;
    const shipping = Number(b.shipping) || 0;
    const total = Math.max(0, subtotal - discount + shipping);

    // Generate เลขที่บิล — ใบกำกับภาษี = TX-  ·  บิลเงินสด = RC-
    const isTax = !!b.customer.isCorporate && !!b.customer.taxId;
    const now = new Date();
    const yymm = String(now.getFullYear()+543).slice(-2) + String(now.getMonth()+1).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
    const bl = `${isTax?'TX':'RC'}-${yymm}-${rand}`;

    const bill = {
      po: bl, // reuse po field for compatibility with viewAdminBill
      bl,
      status: b.payment === 'credit' ? 'pending_payment' : 'paid',
      total, subtotal, discount, shipping,
      items,
      shippingMethod: b.shippingMethod, carrierName: null, tracking: null,
      payment: b.payment,
      taxInvoice: isTax,
      type: isTax ? 'tax' : 'cash',
      createdAt: now.toISOString(), updatedAt: now.toISOString(),
      mode: 'admin-manual',
      customer: {
        name: b.customer.name,
        phone: b.customer.phone,
        address: b.customer.address,
        taxId: b.customer.taxId || '',
        company: b.customer.company || '',
        branch: b.customer.branch || '',
      },
      note: b.note || '',
      createdBy: 'admin',
    };

    // Save locally in sheetBills (แยก cash/tax)
    if (!S.sheetBills) S.sheetBills = { cash: [], tax: [] };
    if (isTax) S.sheetBills.tax.unshift(bill); else S.sheetBills.cash.unshift(bill);
    saveState();

    // บิลต้องขึ้น Sheet ให้ได้ — ถ้าพลาดต้องบอก ไม่ใช่ log เงียบๆ แล้วขึ้นว่าสำเร็จ
    let billOk = true;
    if (S.sheetApiUrl) {
      const res = await apiCall("createBill", { data: bill }, true);
      billOk = !!(res && res.ok);
      if (!billOk) console.error("[bill] push failed:", res && res.error);
    }

    toast(billOk
      ? `✓ สร้าง${isTax?'ใบกำกับภาษี':'บิลเงินสด'} ${bl} แล้ว`
      : `⚠️ สร้าง ${bl} แล้วแต่ยังไม่ขึ้น Sheet — เช็คการเชื่อมต่อ`);
    // Reset builder
    S.bill = { items: [], customer: { name:'', phone:'', email:'', address:'', taxId:'', company:'', isCorporate:false }, discount: 0, shipping: 0, shippingMethod: 'kerry', payment: 'cash', note: '', productSearch: '', customerSearch: '' };
    saveState();
    // Navigate to bill
    go('/admin/bill/' + bl);
  }

  async function adminDelete(pid) {
    const p = EP.find(x => x.id === pid);
    if (!p) return;
    if (!confirm(`ลบ "${p.name.slice(0, 40)}..." ?`)) return;

    // Sync to Sheet if configured
    if (S.sheetApiUrl && S.autoSync) {
      const ok = await deleteProductFromSheet(pid);
      if (ok) {
        // Also remove from sheetProducts cache
        if (S.sheetProducts) S.sheetProducts = S.sheetProducts.filter(x => x.id !== pid);
      }
    }

    // Also update local state (works whether or not sync is on)
    const isNew = S.newProducts.findIndex(x => x.id === pid);
    if (isNew >= 0) {
      S.newProducts.splice(isNew, 1);
    } else {
      if (!S.deletedProducts.includes(pid)) S.deletedProducts.push(pid);
    }
    delete S.productOverrides[pid];
    saveState();
    toast(`ลบสินค้าแล้ว ✓${S.sheetApiUrl && S.autoSync ? ' (Sheet updated)' : ''}`);
    render();
  }
